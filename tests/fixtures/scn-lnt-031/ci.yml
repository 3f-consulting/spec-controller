# The fixture target's OWN workflow, standing in for another repository's pipeline. Both checks
# are ordinary `run:` steps invoking that repository's own scripts — nothing is moved out of the
# pipeline and no wrapper stands in front of a command.
#
# THE ONE DIFFERENCE BETWEEN THE TWO STEPS IS THE `id:`. The first states the code of the row it
# runs, which is the whole of what adoption costs; the second states none and is the same
# repository's unannotated half.
name: fixture CI
jobs:
  quality:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Complexity
        id: SCN-CVT-001
        run: pnpm lint:alpha
      - name: Traceability
        run: pnpm lint:beta
