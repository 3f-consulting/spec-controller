# The fixture target's OWN workflow, standing in for another repository's pipeline. The check is an
# ordinary `run:` step of that pipeline, stating the code of the row it answers and carrying the
# `if: always()` that keeps a later step running past its red.
#
# NO COMMAND HERE IS ONE OF THAT REPOSITORY'S SCRIPTS, which is realistic rather than load-bearing.
# What isolates the record's reading is that a run handed its own record is answered for its
# CONFIGURED rows by that record, so the derivation reader does not credit them a second time
# (3F-3360). Until the membership rule inverted, the isolation was the prefix set's accident —
# a command that is not a script matches no prefix — and an accident is not a guarantee.
name: fixture CI
jobs:
  quality:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Complexity
        id: SCN-CVT-001
        if: always()
        run: eslint
      - name: Dump this run's step record
        id: dump-the-step-record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: printf '%s' "$STEPS_JSON" > ci-steps.json
