# The fixture target's OWN workflow, standing in for another repository's pipeline. All four checks
# are ordinary `run:` steps stating the code of the row they answer, and all four are wired
# identically — so the four steps differ in nothing this file holds, and everything the reader is
# heard to say differently about them came from the record of the run beside it.
#
# NONE OF THE FOUR COMMANDS IS ONE OF THAT REPOSITORY'S SCRIPTS, and that is this fixture's
# isolation. A guard-prefixed script handle would be discovered from this file and observed by the
# derivation reader, whose credit would answer the row's obligation first — so the run record's
# reading would be asserted over rows something else had already settled.
name: fixture CI
jobs:
  quality:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Complexity
        id: SCN-CVT-001
        if: always()
        run: eslint
      - name: Traceability
        id: SCN-CVT-002
        if: always()
        run: scn-subissues
      - name: Duplication
        id: SCN-CVT-003
        if: always()
        run: jscpd
      - name: Doc accuracy
        id: SCN-CVT-004
        if: always()
        run: doc-audit
      - name: Dump this run's step record
        id: dump-the-step-record
        if: always()
        run: printf '%s' "$STEPS_JSON" > ci-steps.json
