# The fixture target's OWN workflow, standing in for another repository's pipeline. All four checks
# are ordinary `run:` steps stating the code of the row they answer, and all four are wired
# identically — so the four steps differ in nothing this file holds, and everything the reader is
# heard to say differently about them came from the record of the run beside it.
#
# NO COMMAND HERE IS ONE OF THAT REPOSITORY'S SCRIPTS, which is realistic rather than load-bearing.
# What isolates the record's reading is that a run handed its own record is answered for its
# CONFIGURED rows by that record, so the derivation reader does not answer them a second time
# Until the membership rule inverted, the isolation was the prefix set's accident —
# a command that is not a script matches no prefix — and an accident is not a guarantee.
name: fixture CI
jobs:
  quality:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Complexity
        id: SCN-CVT-001
        if: always()
        run: eslint
      - name: Traceability
        id: SCN-CVT-002
        if: always()
        run: trace-commits
      - name: Duplication
        id: SCN-CVT-003
        if: always()
        run: jscpd
      - name: Doc accuracy
        id: SCN-CVT-004
        if: always()
        run: doc-audit
      - name: Dump this run's step record
        id: dump-the-step-record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: printf '%s' "$STEPS_JSON" > ci-steps.json
