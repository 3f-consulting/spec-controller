# The fixture target's OWN workflow, standing in for another repository's pipeline — the
# scn-lnt-021 shape (@SCN-LNT-021). The check is an ordinary `run:` step stating the code of the
# row it answers, so the run's record of that step is the row's credit, retired key or no retired
# key.
name: fixture CI
jobs:
  quality:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Complexity
        id: SCN-CVT-001
        if: always()
        run: eslint
      - name: Dump this run's step record
        id: dump-the-step-record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: printf '%s' "$STEPS_JSON" > ci-steps.json
