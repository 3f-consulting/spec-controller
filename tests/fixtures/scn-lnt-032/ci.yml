name: fixture CI
jobs:
  quality:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Complexity
        continue-on-error: true
        run: pnpm lint:alpha
      - name: Anemic domain
        id: SCN-CVT-003
        run: pnpm lint:gamma
  advisory:
    continue-on-error: true
    steps:
      - name: Scenario sub-issue match
        id: SCN-CVT-002
        run: pnpm lint:beta
