name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - run: pnpm install --frozen-lockfile
      - name: Cucumber
        run: pnpm cucumber
      - name: Unused step definitions
        shell: bash
        run: |
          pnpm exec cucumber-js --dry-run --format usage-json | jq -r '.[] | select((.matches | length) == 0) | .pattern' | awk '{ print } END { exit NR > 0 }'
