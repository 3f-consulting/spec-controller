name: CI

# A FIXTURE CI config for the half-converted target repository (@SCN-LNT-020). It runs ONE check
# and states the @SCN of the scenario that check answers, as the step's `id:`. The second fitness
# scenario is cited by nothing this pipeline runs, which is what the scenario is about: its
# obligation is raised by its tag and answered by nothing, so it reconciles missing (3F-3582).
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: pnpm test
      - name: Lint
        id: SCN-HCV-001
        run: eslint
