name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep check
        run: pnpm lint:sweep
      - name: Dump this run's step record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: pnpm lint:dump
      - name: Self-reconciliation balance
        run: pnpm lint:reconcile
