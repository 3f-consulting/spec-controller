# The fixture target's OWN workflow, standing in for a repository that has adopted nothing. Every
# check is an ordinary `run:` step invoking that repository's own script, and not one of them
# states a code — which is the whole of what `new-client` is: a pipeline nobody has annotated.
#
# THE FOUR NON-CHECK STEPS ARE THE OTHER HALF OF THIS FIXTURE, and since 3F-3343 the target says
# so itself. The install and build steps are named in this manifest's `notChecks` — one line each,
# which is what the inverted rule asks of a consumer in place of a convention of ours. They used to
# be silent because the check heuristic did not reach them, and `pnpm build` was the sharp case: a
# real script really invoked that the heuristic missed. Nothing decides that by a name any more.
#
# THE `uses:` PAIR IS NAMED ON THE SAME TERMS (@SCN-USG-013). A quality check can BE an action, so
# nothing about a step's form answers this question for its author; the consumer answers it, once,
# about their own pipeline — which is why the checkout and the toolchain set-up carry an entry each.
name: fixture CI
jobs:
  quality:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Complexity
        run: pnpm lint:alpha
      - name: Traceability
        run: pnpm lint:beta
      - name: Types
        run: pnpm typecheck
