# The fixture target's OWN workflow, standing in for a repository that has adopted nothing. Every
# check is an ordinary `run:` step invoking that repository's own script, and not one of them
# states a code — which is the whole of what `new-client` is: a pipeline nobody has annotated.
#
# THE FOUR NON-CHECK STEPS ARE THE OTHER HALF OF THIS FIXTURE. Checkout and the toolchain set-up
# are not scripts at all; the install step runs a command the manifest holds no script for; and
# `pnpm build` runs a script the manifest DOES hold, under no guard prefix and named by no
# `staticChecks` entry. The last is the sharp one — it is a real script really invoked, and the
# heuristic must still not reach it.
name: fixture CI
jobs:
  quality:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Complexity
        run: pnpm lint:alpha
      - name: Traceability
        run: pnpm lint:beta
      - name: Types
        run: pnpm typecheck
