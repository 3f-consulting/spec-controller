# The fixture target's OWN workflow, standing in for another repository's pipeline — one whose
# author reached for `continue-on-error` deliberately. The check runs, its red is swallowed, and
# the job carries on. THIS FILE IS NOT THIS REPOSITORY'S PIPELINE: the attribute on a check step of
# .github/workflows/ci.yml reconciles as the watermelon on this repository's own books, measured at
# 3F-3475 by planting it on SCN-FIT-011 — the row came back "passing but fabricated" and the run
# went out of balance. What is modelled here is a consumer's choice, and what this axis owes them
# for it is that same honest ledger rather than a refusal.
#
# NO COMMAND HERE IS ONE OF THAT REPOSITORY'S SCRIPTS, which is realistic rather than load-bearing.
# What isolates the record's reading is that a run handed its own record is answered for its
# CONFIGURED rows by that record, so the derivation reader does not credit them a second time
# (3F-3360). Until the membership rule inverted, the isolation was the prefix set's accident —
# a command that is not a script matches no prefix — and an accident is not a guarantee.
name: fixture CI
jobs:
  quality:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Complexity
        id: SCN-CVT-001
        continue-on-error: true
        run: eslint
      - name: Dump this run's step record
        id: dump-the-step-record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: printf '%s' "$STEPS_JSON" > ci-steps.json
