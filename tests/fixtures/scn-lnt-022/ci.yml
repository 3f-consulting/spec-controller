# The fixture target's OWN workflow, standing in for another repository's pipeline. Both checks are
# ordinary `run:` steps of that pipeline, each stating the code of the row it answers and carrying
# the `if: always()` that keeps the record's own step running past a red.
#
# THE MEASURED CHECK HAS A STEP HERE EXACTLY LIKE THE STATIC ONE, and that is this fixture's whole
# point rather than an oversight. Its command prints the number; its step still succeeds, and its
# entry still lands in the record beside the other. Nothing in the DOCUMENT tells the two apart —
# only the row does.
#
# NO COMMAND HERE IS ONE OF THAT REPOSITORY'S SCRIPTS, which is realistic rather than load-bearing.
# What isolates the record's reading is that a run handed its own record is answered for its
# CONFIGURED rows by that record, so the derivation reader does not credit them a second time
# (3F-3360). Until the membership rule inverted, the isolation was the prefix set's accident —
# a command that is not a script matches no prefix — and an accident is not a guarantee.
name: fixture CI
jobs:
  quality:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Complexity
        id: SCN-CVT-001
        if: always()
        run: eslint
      - name: Mutation score
        id: SCN-CVT-003
        if: always()
        run: mutation-score
      - name: Dump this run's step record
        id: dump-the-step-record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: printf '%s' "$STEPS_JSON" > ci-steps.json
