name: CI

# A FIXTURE CI config for the external target repository (@SCN-LNT-005). It wires the
# test + typecheck steps but NOT `pnpm lint:vocab-check` — the check's command is absent
# from CI, so the check (which DOES exist in the external package.json) is present and
# enforced over nothing: the watermelon.
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
