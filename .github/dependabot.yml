version: 2

# THE SELF-PIN FOLLOWS THE REGISTRY BY BOT PR, AND NOTHING ELSE IS UPDATED HERE (3F-3529). The root
# `devDependencies["spec-controller"]` is the single declaration of which reader judges this tree
# (`doc/releasing.md` → "This repository pins spec-controller"). Every package-changing merge now
# publishes, so the pin would fall behind by hand. Dependabot moves it, keeps it EXACT, and
# `dependabot-auto-merge.yml` merges the PR when `ci` is green. `allow:` names the one dependency;
# every other dependency is out of this slice's scope.
#
# NO COOLDOWN FOR OUR OWN PACKAGE (operator, 2026-09-19, 3F-3530). `allow:` limits this bot to
# spec-controller, so a cooldown here only delays our own releases, and each of those was judged by
# this repository's own `ci` before `release.yml` published it. `exclude:` is how the cooldown is
# switched off: leaving `cooldown:` out would not do it, because GitHub then applies a DEFAULT of
# three days. Measured with the Dependabot CLI: exempted, the job targets the newest release, three
# hours old at the time (`0.1.0-alpha.12`), where a one-day cooldown held it to `0.1.0-alpha.4`.
#
# AND SO pnpm's RELEASE-AGE POLICY EXEMPTS THE SAME PACKAGES, BY NAME, IN `pnpm-workspace.yaml`.
# pnpm 11 refuses a lockfile entry younger than `minimumReleaseAge` — 1440 minutes by default,
# enforced in CI at `Install dependencies` — so a pin to a day-young release reds there with
# `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION`. The one-day cooldown this replaces existed only to stay
# outside that window; the exemption now lives where the policy does, and names only spec-controller
# and its core. Measured on the dry run's own lockfile; the numbers are beside the exemption.
#
# `exclude-paths` IS WHAT MAKES THE PR MOVE THE PIN AT ALL (3F-3530). Dependabot's npm parser drops
# every manifest requirement whose name is the name of a workspace package, and
# `packages/spec-controller` is named `spec-controller` — the very name the root pins from the
# registry. Without the exclusion the root requirement never exists; the dependency survives only
# through the lockfile, as a transitive one, and the bot's PR (#311) rewrote `pnpm-lock.yaml` and
# no `package.json`. Measured with the Dependabot CLI over this tree: the same job without the key
# reproduced #311's shape exactly; with it, the root pin moved one line, exactly, and core and the
# CLI moved together in the lockfile. The update still runs in the full clone, so every workspace
# importer stays in the lockfile. Do not remove it while the workspace package keeps that name.
#
# WHAT THE PR TOUCHES, AND WHAT IT CARRIES. The root `package.json` (the pin line, nothing else)
# and `pnpm-lock.yaml`. The lockfile also carries pnpm's in-range re-resolution of transitive
# packages, because Dependabot always runs `pnpm update <dep>@<version> --lockfile-only --no-save -r`
# and that command re-resolves more than the one package; no key here turns it off. The operator
# accepted that churn only on a PR whose pin really moves (2026-09-19), and
# `dependabot-auto-merge.yml` refuses every other PR.
#
# ONCE A DAY, EVERY DAY, WEEKENDS INCLUDED — NO HUMAN ACT IN THE PIN LOOP (operator, 2026-09-19,
# 3F-3557). `cron` at 22:00 UTC (the default zone) on all seven days of the week. `daily`, which this
# replaced, runs Monday to Friday only, so a release published on a Saturday waited for Monday or for
# a person pressing a button. Once a day is as often as GitHub allows: its config check rejected an
# hourly `cronjob` with "has a minimum interval of 1 hours which is less than the minimum allowed
# interval of 24 hours". So a pin lags a publish by up to 24 hours. The operator accepted that: only
# step 3 of an expand/contract waits on the pin, and an adopter's own Dependabot lags the same way.
# A merge to `main` that changes this file also starts a run at once. *Check for updates* under
# Insights → Dependency graph → Dependabot runs one early, but the loop never needs it.
#
# AND ITS MERGE CANNOT LOOP. The PR touches the root `package.json` and the lockfile, which are
# outside `release.yml`'s `paths:`, and the merge is made under the default token, which starts no
# workflow at all.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 22 * * *"
    allow:
      - dependency-name: spec-controller
    exclude-paths:
      - packages/spec-controller
    cooldown:
      exclude:
        - spec-controller
