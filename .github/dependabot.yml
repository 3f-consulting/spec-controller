version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "30 11 * * *"
    allow:
      - dependency-name: spec-controller
    exclude-paths:
      - packages/spec-controller
    cooldown:
      exclude:
        - spec-controller
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
