name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse a PR that moves no pin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::Not arming auto-merge: $1."
            gh pr merge --disable-auto "$PR_URL" || echo "(auto-merge was not armed on this PR)"
            exit 1
          }
          merge_base=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' | sort | paste -sd' ' -)
          before=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/package.json?ref=$merge_base")
          after=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/package.json?ref=$HEAD_SHA")
          from=$(jq -r '.devDependencies["spec-controller"] // ""' <<<"$before")
          to=$(jq -r '.devDependencies["spec-controller"] // ""' <<<"$after")
          rest=$(jq -n --argjson a "$before" --argjson b "$after" \
            '($a | del(.devDependencies["spec-controller"])) == ($b | del(.devDependencies["spec-controller"]))')
          echo "Changed files: $files"
          echo "Root spec-controller pin: '$from' -> '$to'"
          [ "$files" = "package.json pnpm-lock.yaml" ] || refuse "it changes [$files], not exactly the root package.json and pnpm-lock.yaml"
          [ "$from" != "$to" ] || refuse "the root spec-controller pin is unchanged at '$from'"
          [[ "$to" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || refuse "the new pin '$to' is not an exact version"
          [ "$rest" = true ] || refuse "the root package.json changes more than the spec-controller pin"
          echo "The pin moves from $from to $to."

      - name: Merge the pin PR once ci is green
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
