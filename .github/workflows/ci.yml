name: CI

on:
  push:
    branches: [main]
  pull_request:

# THE LADDER READS ONE THING IT DOES NOT OWN (3F-2765): the measurement a scheduled
# mutation sweep persisted, fetched off that workflow's own runs. `actions: read` is what
# lets it, and the block is written out rather than left to the repository default so that
# a default tightened elsewhere reds here, naming the permission, instead of reporting a
# schedule that had lapsed.
permissions:
  contents: read
  actions: read

# ONE RUN PER REF, AND A SUPERSEDED PULL-REQUEST RUN IS CANCELLED (3F-3457). Measured over
# 2026-09-01..16: 644 of this repository's 744 workflow runs were `CI | pull_request`, 2,330 of
# 2,738 billed minutes. The driver is the NUMBER of runs, not the length of one — every push to a
# branch with an open pull request started a full run, and the earlier one kept going.
#
# `cancel-in-progress` IS CONDITIONAL, AND THE CONDITION IS THE WHOLE CARE. A `push: main` run is
# NEVER cancelled: its verdict is what a merge was decided on, and it is the trunk control the next
# branch reads to tell an inherited red from its own. Cancelling those would save little and
# destroy the one run whose conclusion later work is compared against.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A RED ABORTS THIS JOB AND SKIPS EVERY STEP BEHIND IT — RULED, NOT OVERLOOKED (3F-3042).
# Measured over the 200 runs to 0ef9263: 72 failed, and every one of the 72 left at least one gate
# unreached — a median of three, as many as sixteen. Not one failed run ever completed the
# self-reconciliation: 55 never reached it, and the other 17 reached it and it was the red. This is
# not something that bites in a bad week. It bites on every red there has ever been.
#
# IT IS STILL ACCEPTABLE, AND THE REASON IS NOT RARITY. A merge is decided on a GREEN run, and a
# green job is exactly the state in which nothing was suspended: GitHub aborts at the first red, so
# `success` means every unconditional step ran. The run that turns a pull request green ran this
# whole ladder over the head being merged, and the squash puts that content on main. Suspension is
# confined to runs whose verdict is already "not ok" — where nothing is believed about the steps
# behind the red, because nothing is believed about the run.
#
# WHAT IT COSTS IS ROUND-TRIPS, AND THIS REPOSITORY ALREADY PAYS THAT PRICE TWICE. A red build names
# one failure where it could have named four. `scripts/verify.sh` chose the same trade in so many
# words — "the first red stops the ladder and the last line says which gate" — and `mutation.yml`
# chose it again for the sweep: "AND NO `if: always()`. A sweep that died left no verdict worth
# reaching" (3F-2957, @SCN-MUT-016). Splitting these steps into independent jobs buys N checkouts and
# N installs to make a RED build more talkative, and buys nothing where a decision is actually made.
#
# AND THE FITNESS CHECK STEPS BELOW CARRY `if: always()`, WHICH MAKES THE PREMISE STRONGER RATHER
# THAN NEEDING AN EXCEPTION FROM IT (3F-3271, under 3F-3252). A condition is not one thing. The
# condition that would falsify the paragraph above is a NARROWING one — a step that a green run
# skips, so `success` stops meaning it ran, which is exactly what `Lint scenario sub-issue match`
# used to do before 3F-3165 (it is @SCN-FIT-010 now, and the case its condition existed for is
# answered by the check itself with a third ending, absorbed in that step's own `run:` line). `always()` is the opposite: the DEFAULT is
# `if: success()`, so `always()` WIDENS — the step runs on a green build and also on a build that
# has already redded. There is no run in which an `always()` step is skipped and an unconditional
# one is not. `success` still means every step in this job ran, and now a red run means more of
# them ran too.
#
# WHAT IS DELIBERATELY REVERSED IS THE COST TRADE, AND ONLY FOR THE CHECK STEPS. 3F-3042's trade
# above — a red names one failure where it could have named four — stands everywhere else in this
# file, and stands in `scripts/verify.sh` and `mutation.yml` unchanged. It is reversed for the
# fitness check steps because those steps are INDEPENDENT of one another: eslint's red says nothing
# about typecheck's, so stopping at the first tells a reader nothing they could have inferred. The
# price is a slower red build; the ledger this file now feeds is the reason it is worth paying. A
# fitness row with no entry in the run record is BROKEN evidence and stamps the run unsound, so
# without `always()` one early red would report one `failing` and nine `broken` — a worse account
# from a correct mechanism.
#
# ONE ATTRIBUTE WOULD FALSIFY ALL OF THIS, AND IT IS FENCED RATHER THAN ASKED FOR POLITELY.
# `continue-on-error` severs job-green from step-ran: the step runs, reds, and the job ends green
# over a step that enforced nothing. It is also the cheap answer this ticket was tempted by, and it
# would have MANUFACTURED the invisibility it set out to close — the shared CI parse walked
# `jobs -> steps -> run` and discarded every other key of the step, so a swallowed step read as
# enforced and the ledger balanced it. Do not put it on a step or on this job: @SCN-LAD-008 reds
# the ladder if you do, before a single gate has run.

jobs:
  ci:
    runs-on: ubuntu-latest
    # A BOUND ON A HUNG JOB, NOT A PERFORMANCE BAR (3F-3457). Measured over 2026-09-01..16: 720
    # runs, mean 3.1 min, max 7.4 min — and ~6.6 min once this ticket's 50s of mutation steps left.
    # Fifteen is about twice the measured max, so an ordinarily slow run never trips it.
    #
    # WHAT IT IS FOR IS THE SIX-HOUR DEFAULT IT REPLACES. With no timeout a wedged job burns six
    # hours of a 3,000-minute monthly allowance before GitHub stops it — one hang costs more than
    # this whole ticket saves in a month. The repository's actual run-time gates are @SCN-FIT-012
    # and @SCN-FIT-013, at 75s and 150s; this number is not one of them and must not be read as one.
    timeout-minutes: 15
    steps:
      # EVERY `uses:` IN THIS REPOSITORY NAMES A COMMIT, AND THE TAG IS A COMMENT (3F-3445,
      # @SCN-FIT-021). A tag is a pointer its owner can move, so `@v7` says nothing about what this
      # runner will actually fetch tomorrow — the same three words can resolve to a different tree
      # on the next run, with no commit here and nothing to review. The audit step at the foot of
      # this ladder reports an unpinned `uses:` at its highest severity, and eight of them were what
      # it found the first time it read these three files. The SHA is what the runner resolves; the
      # `# vX.Y.Z` after it is the release that commit WAS when it was pinned, which is what a
      # reader needs to find the diff before bumping one.
      #
      # AND `persist-credentials: false`, WHICH COSTS THIS JOB NOTHING BECAUSE NOTHING IN IT TALKS
      # TO THE REMOTE AFTER THIS STEP. `actions/checkout` otherwise leaves the job's token in
      # `.git/config`, where every later step of this job can read it and anything a dependency of
      # this build starts can read it too. Every git command this ladder runs is local to the
      # checkout — `git diff`, `git merge-base`, `git log`, `git show` in `lintScnSubIssuesCli.ts`
      # — and `fetch-depth: 0` is exactly what makes them local: the history they need is already
      # on the disk. A step added later that fetches or pushes would fail loudly on a private
      # repository rather than quietly, which is the right way round.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scenario sub-issue guard can diff HEAD against
          # the PR base ref (github.event.pull_request.base.sha). The default
          # shallow checkout would not contain the base commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      # WHERE THIS RUN'S EVIDENCE LIVES, RESOLVED ONCE FOR EVERY STEP BELOW (3F-3099).
      #
      # spec-controller used to write its own output into its own source tree, and three pieces of
      # apparatus existed only because it did — a `.gitignore` block, a hygiene check, and that
      # check's own coverage gap. The suites' reports and the placed sweep record are this run's
      # OUTPUT, so they land on the runner's disk instead. `tests/checks/measurementArtefact.ts`
      # reads this same name, so every producer and reader in this job resolves to one base whether
      # it is reached through a command line here or through the resolver in TypeScript.
      #
      # ONE ENTRY, NOT FIVE, AND THAT IS THE POINT. The placement step places the sweep record, two suites
      # write their reports, the three measured rows' commands write the credit stream, the dump
      # step writes this run's step record, and the self-reconciliation reads all of them; a `$RUNNER_TEMP`
      # expression repeated at each of them is a path that agrees today and drifts on the first edit
      # that misses one.
      #
      # A STEP AND NOT A JOB-LEVEL `env:` KEY, WHICH IS GITHUB'S CONSTRAINT RATHER THAN A
      # PREFERENCE. `jobs.<id>.env` cannot read the `runner` context — a workflow naming
      # `${{ runner.temp }}` there fails to START, with no job and so no step conclusions to read.
      # `$RUNNER_TEMP` is an ordinary variable inside a `run:` shell, so the value is computed here
      # and handed to every later step through `$GITHUB_ENV`.
      #
      # AND IT SURVIVES BETWEEN THOSE STEPS BECAUSE THIS WORKFLOW STATES EXACTLY ONE JOB — verified
      # against the API rather than read off the indentation. One job is one runner filesystem.
      # Split it in two and nothing reds: the placement's measurement stops reaching the read, and the
      # ledger reports that in the vocabulary of a lapsed nightly sweep. That residual is named in
      # `measurementArtefact.ts` rather than guarded, because a check on this file's SHAPE is
      # exactly the control surface 3F-3099 exists to remove.
      #
      # IT ADDS NO GATE. `pnpm verify`'s ladder is derived from the `run:` steps of this file that
      # invoke a package.json script; this one invokes none, so the ladder is unchanged by it —
      # nine gates as this file now stands — and `scripts/verify.sh` exports the same base for
      # itself. (The number is not maintained here either: `pnpm ladder` prints it, and the closing
      # line of `scripts/verify.sh` counts what it just ran. It is in this sentence only because a
      # reader asking "unchanged from what?" deserves the figure.)
      - name: Resolve the evidence root
        run: echo "SPEC_CONTROLLER_EVIDENCE_DIR=$RUNNER_TEMP/spec-controller-evidence" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BUILT SO THE PUBLISHED SURFACE IS COMPILED ON A PULL REQUEST AT ALL (3F-2765). Nothing else
      # in this ladder reads the built form, so before this step existed a `tsc -p` failure in
      # either package's build config reached main and was found by whoever next ran `pnpm build`.
      # That is now the whole of this step's reason, and the `pnpm rebuild` that used to follow it
      # is gone with the other half (3F-2841): the bins existed for a measurement action that
      # reached its CLI by name, and this workflow calls no such action any more.
      # `build` carries no observed prefix and is not among the static checks package.json names,
      # so it joins the local ladder (which is derived from this file) without joining the ledger
      # — it is a step the checks need, not a check.
      - name: Build
        run: pnpm build

      # STEP 0 OF THE SELF-RECONCILIATION CHAIN — THE MEASUREMENT THIS PUSH DID NOT TAKE
      # (@SCN-FIT-002, 3F-2765). A mutation sweep costs 8-12 minutes against this ladder's ~2
      # minutes, so it runs nightly (mutation.yml) and its score is last night's. Refusing to read
      # it would leave SCN-FIT-002 reconciling `missing` on every push — a build redding over a
      # cadence rather than over the code — and reading it unconditionally would settle this tree's
      # bar with a number measured about a different tree. So it is placed only while it is still
      # young enough to be about this code: 26 hours — a 24 hour cadence plus 2 hours of margin —
      # leaves a 03:17 UTC nightly its own slot and one late start's worth of slack, and ONE missed
      # sweep ages the number out, places nothing, and reds the gate below. A sweep that quietly
      # stops running cannot stay quiet.
      #
      # IT LANDS A SWEEP RECORD, NOT A ROW OF THIS RUN'S CREDIT STREAM (3F-3152). It used to copy
      # the nightly's file straight into `measurements.json` — the artefact
      # the self-reconciliation reads as what THIS run credited — and the merge argument that placement
      # needed (land it first, let the two suite producers post beside it) went with it. Under a
      # CONVERTED @SCN-FIT-002 the row's own command posts the credit, from the number this record
      # holds, so a placed row sitting in the credit stream would be a second credit for one
      # Evidence Obligation. Two files, two questions: what a sweep MEASURED, and what this run
      # CREDITED. Nothing else reads or writes the path below, so there is no merge here at all.
      #
      # IT STILL RUNS FIRST, AND NOW FOR A PLAINER REASON. The `Mutation score` step below IS the
      # row's command and it reads this file; a placement made after it would leave that step with
      # nothing to print, and nothing to write, on every push.
      #
      # THE RECORD THIS PLACES MAY STILL SAY `SCN-MUT-011` — A TRANSITION WITH AN END (3F-3168,
      # 3F-3174). The row was minted `SCN-FIT-002`, and the producer that stamps the record moved
      # with it in the same commit; but the producer runs nightly on the gated branch, so the newest
      # placeable record was written by the PREVIOUS night's code and carries the old code. The
      # row's command therefore states `--supersedes SCN-MUT-011`, and the reader answers a row
      # from a measurement stamped with the code that row supersedes (@SCN-MUT-019). Once one
      # nightly has run on the renamed tree, no record carries the old code and the flag comes off
      # (3F-3174) — otherwise the transition becomes the resting state.
      #
      # WRITTEN HERE RATHER THAN SHIPPED (3F-2841). This was a composite action over a CLI
      # (3F-2766, 3F-2810). Every piece of it is a native GitHub operation or a `date` subtraction
      # — upload a file, download it, check its age — so it is glue, and glue is written at the
      # edge that needs it. The window is not a manifest field for the same reason it never was: a
      # manifest is about BARS, which are facts about the code, and a window is a fact about the
      # pipeline reading them. It no longer lives in THIS step either — it is written once in
      # `scripts/freshness-window.sh`, which every placed row asks (3F-3200).
      #
      # AND IT IS NOT AN ARBITER. Every branch below places nothing, says why on stderr, and exits
      # 0. Having no measurement to place — no finished sweep, no artefact, a number past its
      # window, a payload that is not one — is the ordinary reading of a cadence, and the place it
      # is reported is downstream: the `Mutation score` step reds, because the row's command has
      # nothing to print, and the self-reconciliation reds on the row that owed the measurement, which
      # reconciles `missing`. Both sentences are true and both are reached; a step that
      # redded HERE as well would make a green build depend on arbiters agreeing, which is the
      # argument features/mutation-score.feature already settles for the bar itself.
      - name: Place the scheduled sweep's measurement
        env:
          GH_TOKEN: ${{ github.token }}
          # The three terms that are the whole of which measurement crosses: which workflow took
          # it, which LINE it was taken on (3F-2955), and what it left the measurement under. HOW
          # LONG that number stays close enough to true about this code is no longer among them —
          # 26 hours, a 24 hour cadence plus 2 hours of margin, is written once in
          # `scripts/freshness-window.sh` and asked by every placed row (3F-3200).
          #
          # BRANCH IS WRITTEN OUT RATHER THAN DERIVED FROM `github.ref_name`, WHICH IS THE ACCEPTED
          # COST STATED (@SCN-MUT-017). This ladder also runs on `pull_request`, and nothing sweeps
          # a feature branch — so placing from the branch UNDER TEST would find no run and read
          # `missing` on every pull request. A pull request's mutation row is therefore a statement
          # about the line it is merging into, not about itself, and that is deliberate. The value
          # is held to `on.push.branches` by a scenario, so a default-branch rename that moves one
          # and not the other reds rather than leaving the placement reading a line nobody gates.
          WORKFLOW: mutation.yml
          BRANCH: main
          ARTEFACT: mutation-measurement
        run: |
          # ERREXIT ARRIVES FROM THE SHELL AND IS CLEARED HERE, OUT LOUD (3F-2960). GitHub invokes a
          # bare `run:` as `bash -e {0}` and this step names no `shell:`, so `-e` is ON unless it is
          # switched off — `set -uo pipefail` sets nounset and pipefail and does not clear it. It was
          # not cleared, and the comment that used to stand here said it was: every command outside
          # an `if` condition could red the one step that must never manufacture a red. What guarded
          # the branches was `if !`, never this comment.
          #
          # GUARDING EACH COMMAND WAS RULED OUT ON CORRECTNESS, NOT ON SIZE. Three attentive readings
          # of this script produced three different lists of the commands that could red it, so a
          # guarantee resting on such a list rests on the artefact that moved under all three. These
          # two lines are correct over every command here whether or not anybody enumerated it, and
          # over the one a later edit adds.
          #
          # `-u` IS KEPT, AND IS THE ONE RED ROUTE LEFT. An unbound expansion exits 127 whatever
          # errexit says. That red says THIS SCRIPT IS BROKEN rather than YOUR CODE LOST A KILL, and
          # dropping `-u` to close it would buy `cp "" mutation-measurements.json` — a
          # silent wrong placement, which is the fail-open this whole line of work exists to close.
          set +e
          set -uo pipefail

          # THE WINDOW AND THE COMPARISON AGAINST IT COME FROM ONE FILE, WHICH EVERY PLACED ROW
          # ASKS (3F-3200). What is left here is this row's TRANSPORT — which run to select, how to
          # read its clock, how to fetch and place what it left. Three sources, three transports,
          # one rule.
          . scripts/freshness-window.sh

          # THIS STEP LEAVES THIS RUN'S MEASUREMENT IN THE EVIDENCE ROOT OR IT LEAVES NOTHING, AND
          # THAT IS ONE RULE RATHER THAN A BRANCH (3F-3431). Every path below that does not place
          # says "nothing is placed" on stderr and exits 0 — and on a root that OUTLIVES the run,
          # that sentence had no effect at all: an earlier run's copy was still sitting here, and
          # the row's own command read it and answered with a number this run had already refused.
          # Two outcomes on paper, one effect. It reads as airtight on this pipeline solely because
          # `$RUNNER_TEMP` is discarded between jobs, which is luck rather than mechanism — the same
          # complaint this axis makes about the timings, one level down. A consumer will not have it.
          #
          # REMOVED HERE RATHER THAN AT EACH REFUSAL, FOR THE REASON `set +e` IS SET ONCE ABOVE.
          # Eight paths out of this script place nothing and a ninth is one edit away; a guarantee
          # resting on a hand-derived list of them rests on the artefact that moved under all three
          # of the readings that produced three different lists. This line is correct over every
          # branch whether or not anybody enumerated it, and over the one a later edit adds.
          #
          # AND IT REMOVES THIS ROW, NEVER THE ROOT. Clearing the evidence root before the producers
          # run was rejected and this is not that (3F-3200, AMENDED 2026-09-16): what goes is
          # exactly the record this step answers for, and the age test below still decides whether
          # it comes back. The other placements' records, the per-mutant record that is deliberately
          # under no window, and this run's credit stream are not this step's to touch.
          #
          # `no source -> remove` IS STRICTER THAN THE WINDOW ON PURPOSE, AND IS A DECISION. A copy
          # placed two hours ago may still be inside the window, so removing it on an absent source
          # can make SCN-FIT-002 read `missing` where evidence arguably existed — a false RED. The
          # alternative, ageing the placed copy on its own account, needs the measurement's time to
          # survive a copy that carries the COPY's time instead; get that wrong and the failure is a
          # satisfied row on a stale number. In a product whose subject is false greens, take the
          # rule that fails loudly.
          rm -f "${SPEC_CONTROLLER_EVIDENCE_DIR}/mutation-measurements.json"

          into="${RUNNER_TEMP}/placed-measurement"
          rm -rf "${into}"
          mkdir -p "${into}"

          # THE NEWEST FINISHED RUN, NEVER THE NEWEST SUCCESSFUL ONE (3F-2947, @SCN-MUT-015). A
          # run's conclusion answers whether the nightly's own VERDICT passed; this is asking what
          # that night's sweep MEASURED, and the night that finds a regression is exactly the night
          # whose conclusion is `failure`. Filtering on it reached back past that run to the last
          # green one and placed ITS number — settling this tree's bar with a measurement about an
          # older tree, and reconciling SCN-FIT-002 satisfied over a regression the sweep had
          # already detected and already said out loud. `gh` reads both a run's status and its
          # conclusion off this one flag; `completed` is the status, so it selects on having
          # FINISHED and on nothing else. It excludes `queued` and `in_progress` on purpose: a
          # sweep still running has nothing to hand across yet, and selecting it would download
          # nothing and read `missing` for the ten minutes each night the sweep is live.
          #
          # AND THE NEWEST RUN ON THE LINE THIS LADDER GATES, NEVER THE NEWEST ANYWHERE (3F-2955,
          # @SCN-MUT-017). `mutation.yml` enables `workflow_dispatch`, so a sweep hand-dispatched on
          # a feature branch entered this list and, being newest, won it — and its number was placed
          # and reconciled a MAIN push's row. Measured on this repository on 2026-08-30: four
          # dispatches on a feature branch sat newer than that day's nightly for ten hours, each
          # inside the window, none distinguishable downstream from the nightly they displaced. It
          # fails OPEN: a branch that adds tests sweeps to a higher kill count, and placed onto
          # main that number reconciles `satisfied` over a main whose own kills had fallen.
          #
          # THE TERM IS THE BRANCH AND DELIBERATELY NOT THE EVENT. `--event schedule` excludes the
          # same dispatches and is the wrong instrument three times over: it refuses a hand-dispatch
          # ON this branch — a measurement of the very tree being judged, forced to read `missing`,
          # which is the mislabelled red @SCN-MUT-015 spent a slice removing; it reaches the right
          # answer only because GitHub resolves cron against the default branch, so a second
          # schedule or a change in that resolution silently selects a different set with nothing
          # redding; and it names PROVENANCE where the claim is about the ARTEFACT — which tree was
          # mutated. The scenario asserts the absence of an event filter for that reason, because a
          # term nobody wrote down is the term a later tidy-up adds for symmetry.
          #
          # AND IT BUYS THE LINE, NOT THE TREE. `main` at 03:17 and `main` at 14:00 are different
          # trees; the window above is the only thing bounding that drift. Ancestry of the run's
          # head commit is the tighter instrument and is not built here — it owes a fence for the
          # shallow checkout, and its own @SCN.
          if ! latest="$(gh run list --workflow "${WORKFLOW}" --branch "${BRANCH}" --status completed --limit 1 --json databaseId,createdAt)"; then
            echo "place: could not list runs of ${WORKFLOW} on ${BRANCH}; nothing is placed." >&2
            exit 0
          fi

          id="$(printf '%s' "${latest}" | jq -r '.[0].databaseId // empty')"
          when="$(printf '%s' "${latest}" | jq -r '.[0].createdAt // empty')"
          if [ -z "${id}" ] || [ -z "${when}" ]; then
            echo "place: ${WORKFLOW} names no finished run on ${BRANCH} carrying both an id and a createdAt; nothing is placed." >&2
            exit 0
          fi

          # THE RUN'S OWN CLOCK, NEVER THE PAYLOAD'S (3F-2841). The retired persist stamped a
          # `measuredAt` into the artefact for this arithmetic to read — a fact GitHub already
          # records, and one written by the very run being judged. A measurement cannot outlive the
          # run that took it, so the run's own clock bounds the payload's — and unlike the payload's
          # it is not the judged run's to write.
          if ! measured_at="$(date -u -d "${when}" +%s 2>/dev/null)"; then
            echo "place: run ${id} of ${WORKFLOW} reports createdAt ${when}, which is not a moment this runner can read; nothing is placed." >&2
            exit 0
          fi

          # AND THE WINDOW IS CLEARED BEFORE THE PAYLOAD IS FETCHED AND BEFORE ANYTHING IS PLACED
          # (@SCN-MUT-019). A run past the window is never downloaded and never placed, so the
          # reader downstream meets no record at all — which is what makes stale and absent the
          # same observable. The shared rule refuses a negative age too, and says why on stderr;
          # this step's business is only that the refusal happens HERE, ahead of the fetch.
          if ! inside_the_freshness_window "${measured_at}" "run ${id} of ${WORKFLOW}"; then
            exit 0
          fi

          if ! gh run download "${id}" --name "${ARTEFACT}" --dir "${into}"; then
            echo "place: run ${id} of ${WORKFLOW} left no ${ARTEFACT} to download; nothing is placed." >&2
            exit 0
          fi

          # Found by name wherever the upload put it: an artefact holding one file and an artefact
          # holding a tree flatten differently.
          #
          # EITHER NAME, BECAUSE THIS IS A TRANSITION WITH AN END (3F-3320) — the same shape, and
          # for the same structural reason, as `--supersedes SCN-MUT-011` on the row's command
          # below. 3F-3320 renamed the sweep record `measurements.json` -> `mutation-measurements.json`
          # so that flattening the evidence root could not collide it with the credit stream. But
          # `mutation.yml` runs NIGHTLY ON THE GATED BRANCH, so the newest artefact this step can
          # reach was uploaded by the PREVIOUS night's code and still holds the OLD basename. A
          # `find` matching only the new one therefore places nothing on every push until a nightly
          # has run on the renamed tree — measured, not predicted: the first CI run of this change
          # said "holds no measurements.json; nothing is placed" and reconciled SCN-FIT-002 missing.
          #
          # IT FAILS IN THE ONE DIRECTION THAT IS SAFE TO WIDEN. This artefact is the sweep's alone
          # and holds exactly one payload, so there is no second file either name could select by
          # mistake; and whatever is found is still read by the `jq` below before it is placed, and
          # still lands under the NEW name, so nothing downstream sees the old spelling.
          #
          # WHEN THE OLD ARM COMES OUT: once one nightly has run on main carrying this change, no
          # reachable artefact holds `measurements.json` and the `-o` clause is dead. Take it out
          # then — otherwise the transition becomes the resting state, which is the failure 3F-3174
          # names for the superseded `@SCN` beside it.
          found="$(find "${into}" -type f \( -name mutation-measurements.json -o -name measurements.json \) -print -quit)"
          if [ -z "${found}" ]; then
            echo "place: ${ARTEFACT} from run ${id} holds neither mutation-measurements.json nor measurements.json; nothing is placed." >&2
            exit 0
          fi

          # WHAT ARRIVED IS READ BEFORE IT IS PLACED. An empty or malformed payload copied into the
          # tree would settle nothing and read exactly like a payload that was never fetched, so the
          # two are told apart here rather than left to be told apart by their absence. `.measurements`
          # is the only key asked for, which is what makes the dated artefacts a previous nightly
          # already uploaded readable without a migration: `measuredAt` sits beside it, unread.
          if ! jq -e '(.measurements | type) == "array" and (.measurements | length) > 0' "${found}" >/dev/null 2>&1; then
            echo "place: the payload at ${found} from run ${id} carries no measurements to place; nothing is placed." >&2
            exit 0
          fi

          # A PLAIN COPY, BECAUSE NOTHING ELSE WRITES THIS FILE. The sweep record is the placement's
          # alone — no producer of this run posts into it — so there is nothing here to merge with
          # and nothing for a copy to overwrite. The evidence root is a directory on the runner
          # that nothing else creates, so this is also what brings it into being (3F-3099).
          #
          # AND IT IS GUARDED BECAUSE THE LINE UNDER IT MAKES A CLAIM (3F-2962, @SCN-MUT-018).
          # Clearing errexit above is a guarantee about whether this step REDS; it says nothing
          # about whether what the step SAYS is true, and the two used to be held by one mechanism.
          # Unguarded, a failed `mkdir` or `cp` fell straight through to that sentence, which
          # asserted a placement that had not happened; the `jq` then failed against a file that was
          # not there and the terminal `exit 0` reported success. This is the ONE branch here whose
          # purpose is what is said rather than whether the step reds, and it counts nothing: the
          # not-redding guarantee is still `set +e` plus the last line, over every command in this
          # script whether or not anybody enumerated it.
          #
          # THE TWO COMMANDS ARE ONE CONDITION ON PURPOSE. The claim is that THE PLACEMENT
          # succeeded, and the placement is the `mkdir` AND the `cp`. Guarding them separately
          # would be two claims, and would rebuild at the scale of two the hand-derived list ruled
          # out at the scale of nine.
          #
          # AND THE SENTENCE CONTRADICTS THE LAPSE READING RATHER THAN INHERITING IT. The window
          # branch above has already taught this log that `missing` means the sweep has stopped
          # running. Left generic, this branch would inherit that reading and send the reader to
          # mutation.yml's schedule over a fault in this runner — the defect moved, not closed.
          if ! { mkdir -p "${SPEC_CONTROLLER_EVIDENCE_DIR}" && cp "${found}" "${SPEC_CONTROLLER_EVIDENCE_DIR}/mutation-measurements.json"; }; then
            # AND A HALF-WRITTEN COPY IS NOT A PLACEMENT EITHER. The removal above ran before this
            # `cp` began, so what a failure here can leave behind is this run's own partial file —
            # which the row's command would read as a measurement. The one branch that can put
            # something there without placing it is the one branch that takes it away again.
            rm -f "${SPEC_CONTROLLER_EVIDENCE_DIR}/mutation-measurements.json"
            echo "place: could not place ${ARTEFACT} from run ${id} of ${WORKFLOW} into the evidence root; nothing is placed. SCN-FIT-002 will read missing, and this is NOT the lapsed sweep that sentence usually reports: the measurement arrived and this runner could not put it where the check that reports it reads it." >&2
            exit 0
          fi
          echo "place: placed ${ARTEFACT} from run ${id} of ${WORKFLOW}, measured ${FRESHNESS_AGE}s ago, inside the ${MAX_AGE}s window:"
          jq -r '.measurements[] | "place:   \(.scnId) \(.checkTag) = \(.measured)"' "${SPEC_CONTROLLER_EVIDENCE_DIR}/mutation-measurements.json"

          # THE LAST ACT, BECAUSE A SCRIPT'S STATUS IS ITS LAST COMMAND'S. `set +e` stops a failure
          # mid-script from killing the step; it does NOT stop the render above from REPORTING one.
          # Two routes, two lines.
          exit 0

      # STEP 1 OF THE SELF-RECONCILIATION CHAIN — the observed @unit stream. The run is
      # unchanged; it now also writes the machine-readable report the gate below reads.
      # It lands under the job's evidence root, on the runner's own disk, because a
      # reconciliation report enumerates this codebase's gaps and is this run's OUTPUT — writing
      # it into the source tree it is about is the defect 3F-3099 closes. The default reporter is
      # kept alongside so a failure is still readable in the log rather than only in JSON.
      - name: Test
        run: pnpm test --reporter=default --reporter=json --outputFile.json="$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json"

      # STEP 2 — the observed @integration / @e2e stream. `--format json:` adds a
      # file formatter; the progress formatter stays on stdout.
      - name: Cucumber
        run: pnpm cucumber --format json:"$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json"

      # STEP 2b — THE TWO SUITES' TIMINGS, CARRIED INTO THIS RUN'S EVIDENCE ONLY WHILE THEY ARE
      # STILL ABOUT THIS CODE (@SCN-PLC-001, 3F-3200).
      #
      # THE TWO PRODUCERS ABOVE NO LONGER WRITE INTO THE EVIDENCE ROOT. They write under its
      # staging stage, and this step is what carries a record across — only while the record is
      # inside the freshness window, which it asks the same shared rule the sweep's placement asks.
      # The root therefore holds only what has been PLACED, so a lapsed timing is not there to be
      # read and its row reconciles `missing`: stale and absent are one observable for a timed row,
      # as they already were for the sweep.
      #
      # WHICH IS A MECHANISM WHERE THERE USED TO BE LUCK. Both timed rows behaved as though they had
      # a window because `$RUNNER_TEMP` happens to be fresh on every CI job here — so on a runner
      # with a persistent evidence root, a job where one suite did not run would read yesterday's
      # number for that suite and settle its bar with it. A consumer copying this axis copies the
      # arrangement, and they will not have `$RUNNER_TEMP`.
      #
      # THE MEASURED-AT IS THE STAGED FILE'S MODIFICATION TIME, AND THE `stat` IS THIS STEP'S OWN.
      # `scripts/freshness-window.sh` takes an epoch second and never anything else — a file's mtime
      # is `stat`, which spells its flags differently on either platform, exactly as parsing a run's
      # `createdAt` is GNU `date` syntax. Both are the CALLER's transport problem and both stay at
      # the caller, so no portability term sits in the one path every placed row goes through.
      #
      # ONE STEP PLACING TWO ROWS, NOT TWO STEPS PLACING ONE EACH. Two would move the declared
      # ledger delta twice for no reading anyone can take, and `notChecks` — which this step is
      # named in, in the same commit that added it — is the surface where an extra entry costs
      # most. The rows are a term of this step rather than a loop over the manifest because a
      # placement is glue at the edge: it knows which files this pipeline's producers stage, and
      # nothing about which rows a manifest holds.
      #
      # AND IT IS NOT AN ARBITER. Every branch places nothing, says why on stderr, and exits 0 —
      # having nothing to place is the ordinary reading of a cadence, and the place it is reported
      # is downstream, on the row that owed the measurement. A step that redded here as well would
      # make a green build depend on two arbiters agreeing.
      #
      # `if: always()` FOR THE REASON THE READERS BELOW CARRY IT, and the sweep's placement does not
      # need it: that one runs ahead of everything that can red, and this one runs behind two
      # suites. A failing suite is still a suite that ran and still took its wall-clock — the
      # wrapper posts its measurement whatever the child exited with (@SCN-CIP-010) — so a
      # placement skipped by a red would leave `Behavioural suite run time` reading `missing` over
      # a suite that plainly ran. `always()` WIDENS: there is no run in which it is skipped and an
      # unconditional step is not.
      - name: Place the suites' timings
        if: always()
        env:
          # The two rows this pipeline stages a timing for, written out rather than derived from
          # the manifest: this step is glue at the edge and knows its own producers.
          ROWS: SCN-FIT-012 SCN-FIT-013
        run: |
          # ERREXIT ARRIVES FROM THE SHELL AND IS CLEARED HERE, OUT LOUD, exactly as it is in the
          # sweep's placement (3F-2960): GitHub invokes a bare `run:` as `bash -e {0}` and this
          # step names no `shell:`. `-u` is kept, and is the one red route left — an unbound
          # expansion exits 127, which says THIS SCRIPT IS BROKEN rather than YOUR CODE LOST A
          # KILL, and dropping it would buy a `cp` of the empty string.
          set +e
          set -uo pipefail

          # THE WINDOW AND THE COMPARISON AGAINST IT COME FROM ONE FILE, WHICH EVERY PLACED ROW
          # ASKS (3F-3200). What is left here is these rows' transport: where the producer staged
          # the record, how to read its clock, and where a placed one goes.
          . scripts/freshness-window.sh

          for scn in ${ROWS}; do
            record="timings-${scn}-measurements.json"
            staged="${SPEC_CONTROLLER_EVIDENCE_DIR}/staged/${record}"

            # THIS ROW ENDS THIS STEP HOLDING THIS RUN'S TIMING OR HOLDING NOTHING (3F-3431), which
            # is the sweep's rule above applied to a row whose source is a staged file rather than
            # another workflow's run. Every `continue` below places nothing and says so, and on a
            # root that outlives the run that sentence used to leave yesterday's number exactly
            # where this row's command reads it. Written once per row for the reason it is written
            # once there: four paths out of this loop place nothing, and a list of them is the
            # artefact that goes stale.
            #
            # THE STAGED RECORD IS NOT WHAT GOES. It is left exactly where the wrapper put it, and
            # its age is the test — clearing the root up front, before the producers run, is the
            # shape that was rejected (3F-3200). What is removed is the PLACED copy, the one this
            # step is answering for.
            rm -f "${SPEC_CONTROLLER_EVIDENCE_DIR}/${record}"

            # NOTHING STAGED IS THE ORDINARY CASE, NOT A FAULT. A job in which one suite did not
            # run stages nothing for that row, and the sentence that reports it is the row's own:
            # it reconciles `missing`, which is true.
            if [ ! -f "${staged}" ]; then
              echo "place: ${scn} staged no timings record at ${staged}; nothing is placed. The row will read missing, which is the true sentence: no measurement arrived." >&2
              continue
            fi

            if ! measured_at="$(stat -c %Y "${staged}")"; then
              echo "place: ${scn} staged a timings record at ${staged} whose modification time this runner cannot read; nothing is placed." >&2
              continue
            fi

            # THE SHARED RULE, AND NOTHING OF THE WINDOW IS RESTATED HERE. It refuses an age past
            # the window and an age in the future, says which and why on stderr, and leaves the age
            # it computed in `FRESHNESS_AGE` for the sentence below — one subtraction, read twice.
            if ! inside_the_freshness_window "${measured_at}" "the ${scn} timings record"; then
              continue
            fi

            # GUARDED BECAUSE THE LINE UNDER IT MAKES A CLAIM (3F-2962). Clearing errexit above is a
            # guarantee about whether this step REDS; it says nothing about whether what the step
            # SAYS is true. Unguarded, a failed `cp` would fall through to a sentence asserting a
            # placement that had not happened. The `mkdir` is in the same condition because the
            # claim is that THE PLACEMENT succeeded, and the placement is both commands.
            #
            # A PLAIN COPY, AND THE STAGED RECORD IS LEFT WHERE IT IS. A staged record surviving
            # from an earlier run is not tidied away, it is aged out — which is the operator's
            # ruling on this ticket kept as a mechanism. What the refusal takes away is the PLACED
            # copy and never the source it was placed from (3F-3431).
            if ! { mkdir -p "${SPEC_CONTROLLER_EVIDENCE_DIR}" && cp "${staged}" "${SPEC_CONTROLLER_EVIDENCE_DIR}/${record}"; }; then
              # A HALF-WRITTEN COPY IS NOT A PLACEMENT, and it is the one thing a failure here can
              # leave where this row's command reads a measurement.
              rm -f "${SPEC_CONTROLLER_EVIDENCE_DIR}/${record}"
              echo "place: could not place ${scn}'s staged timings record into the evidence root; nothing is placed. The row will read missing, and this is NOT the lapsed measurement that sentence usually reports: the suite ran, its number was taken, and this runner could not put it where the check that reports it reads it." >&2
              continue
            fi
            echo "place: placed ${scn}'s timings record, measured ${FRESHNESS_AGE}s ago, inside the ${MAX_AGE}s window."
          done

          # THE LAST ACT, BECAUSE A SCRIPT'S STATUS IS ITS LAST COMMAND'S. `set +e` stops a failure
          # mid-script from killing the step; it does not stop the loop above from REPORTING one.
          exit 0

      # STEP 2b — THE FITNESS ROWS, AS ONE CI STEP EACH THAT CITES THEM (3F-3271, under
      # 3F-3252; the second cucumber call they replaced was deleted at 3F-3272).
      #
      # THERE USED TO BE A `Cucumber (fitness)` STEP HERE, and what it did is now done by these
      # ten. It was a SECOND cucumber call over its own profile: it ran every converted check's
      # command and wrote a report the ledger read as their credit stream. That is a second evidence
      # stream manufactured beside one that already existed — the run record this job's own dump
      # step writes — so it went with the pass.
      #
      # AND THE GATES CAME BACK UP THE LADDER WITH THE SPLIT, WHICH IS THE COST THE CONVERSION PAID
      # BEING REFUNDED. `Lint complexity` and its siblings used to run near the top; converting them
      # put every one behind the whole test and cucumber ladder, inside one pass. They are steps
      # again, and `pnpm verify`'s ladder is derived from this file, so each is a local gate in its
      # own right once more.
      #
      # THE CONSUMER'S CI IS THE CREDIT JOURNAL, AND `balance` EXECUTES NOTHING. A quality check is
      # already a command in a pipeline; a run of that pipeline is already a record of what each
      # command did, written by the provider for its own purposes. So the fitness axis reads that
      # record instead of manufacturing a second one — which is what the cucumber fitness pass was,
      # and why it is deleted. What a consumer writes is an `id:` per check step and one dump step;
      # `doc/converting-a-fitness-check.md` is the whole of it.
      #
      # THE `id:` IS THE `@SCN` ITSELF, AND IT CITES THE ROW RATHER THAN RESTATING IT. The
      # obligation stays in the `@fitness` scenario, the command stays in the row of
      # `specController.fitnessChecks`, and this step produces the observation. Three books, three
      # authors, none of them able to answer for another. An arbitrary handle would need a fourth
      # artefact mapping it back, which is the roster this repository keeps deleting.
      #
      # AND ONLY A STEP CARRYING AN `id:` IS IN THE `steps` CONTEXT AT ALL — GitHub's own rule, not
      # a filter written here. `checkout`, `setup-node` and `Install dependencies` are not checks
      # and do not appear, so the dump below needs no discriminator of its own.
      #
      # EVERY ONE CARRIES `if: always()`, AND THAT IS THE HALT OBJECTION ANSWERED RATHER THAN
      # INHERITED. Without it the first red check aborts the job and every later check step is
      # skipped, so the ledger would read one `failing` and N `broken` — a worse report from a
      # correct mechanism. The checks are INDEPENDENT: eslint's red says nothing about typecheck's,
      # so naming four failures beats naming one here. See the header for what that reverses and
      # what it does not.
      #
      # THEY INVOKE THE package.json HANDLE AND NOT THE CLI BEHIND IT, WHICH IS WHAT PUTS THEM BACK
      # IN THE LOCAL LADDER. `pnpm verify` is derived from the `run:` steps of THIS file that invoke
      # a package.json script (@SCN-LAD-001..006), so these steps take it from four gates to nine —
      # the three `lint:` checks and `typecheck` return to the local green-check that the
      # conversion into the fitness pass had taken them out of, and the corpus-tags step arrives
      # there with them. Writing the boundary gate's two tools out by hand here — `pnpm exec
      # depcruise packages && pnpm exec eslint --config eslint.boundaries.mjs packages` — would run
      # the same check and hold the ledger equally still, and now that the pass is gone `pnpm
      # verify` would have silently dropped to one. A green-check that narrows without saying so is
      # the fault @SCN-LAD-001..006 exist to make impossible; a step spelt to dodge them is the
      # same fault wearing a longer command.
      #
      # THE `pnpm --silent` ROWS ARE NOT GATES, AND THAT IS THE DERIVATION BEING EXACT RATHER THAN
      # A GAP. `--silent` sits where the script name would be, so the ladder does not match them;
      # each reads an artefact an earlier step of THIS run wrote, so a local ladder running them out
      # of that context would red on a missing record rather than on the code. How many there are is
      # read off the rows and is deliberately not counted here — a number in this prose is a second
      # reading of the manifest, kept in step by whoever remembers.
      - name: Complexity — eslint's complexity, max-lines and max-lines-per-function
        id: SCN-FIT-001
        if: always()
        # `pnpm exec` rather than the row's bare `eslint`, because a `run:` shell has no
        # `node_modules/.bin` on its PATH. The row states the bare command a consumer would type;
        # what a pipeline needs to put it on the PATH is the pipeline's business.
        run: pnpm exec eslint

      - name: Complexity exceptions
        id: SCN-FIT-003
        if: always()
        run: pnpm lint:complexity-exceptions

      # THE ONE STEP HERE THAT IS THE PRODUCT RATHER THAN A CHECK WE WROTE (3F-3311), AND IT IS NOW
      # THE ONLY ONE POLICING THE CORPUS. It stood beside two private copies of itself —
      # `lint:scn-tags` (620 lines over a hand-rolled line parser, left at 3F-3312) and
      # `lint:feature-codes` (417 lines over a second corpus walk and a hand-kept table of feature
      # codes, left at 3F-3313) — both under `tests/checks/`, which is in neither package's
      # published `files` and so unreachable from any other repository by construction. An adopter
      # got `@SCN` codes and inherited nothing that policed them. This step runs the WORKSPACE CLI
      # DIRECTLY, the way an adopter runs the command they installed, which is the whole of what
      # acceptance item 2 asks: a private copy ships nothing. `3F-3296` de-wrappered the
      # self-reconciliation step below for the same reason, and the two steps now differ only in
      # which command they hand the binary.
      #
      # ITS HANDLE IS OUTSIDE THE OBSERVED SET, AND THAT IS WHY NO PHANTOM CHECK ARRIVES WITH IT.
      # `runningStaticChecks` counts a `package.json` script as a running static check when its
      # name carries an observed prefix (`lint:` / `guard:`) and a CI `run:` step invokes it;
      # `spec-controller` is the workspace CLI and carries neither, so this step adds an
      # observation for SCN-FIT-014 and nothing to the static-check census.
      #
      # SO THE `id:` IS THE WHOLE CITATION. The obligation is the `@fitness` scenario, the
      # command is the row in `specController.fitnessChecks`, and this step is the observation that
      # answers them — cited by `id:` alone (@SCN-LNT-031). Misspell it and the credit posts to the
      # suspense row while the scenario reads unobserved.
      - name: Corpus tags
        id: SCN-FIT-014
        if: always()
        run: pnpm spec-controller tags

      - name: Import boundaries
        id: SCN-FIT-009
        if: always()
        run: pnpm lint:boundaries

      # THE THREE KEYS ARE THIS STEP'S OWN, AND THEY ARE THE ONLY COPY. `Cucumber (fitness)` used
      # to carry the same block because the pass ran this check too; the pass is gone and this is
      # what the check runs under. Without them it runs over an empty pull-request context, answers
      # "I examined nothing" on every build, and is credited as having run — a check that stopped
      # checking looks identical to a green. They are named on the STEP because `jobs.<id>.env`
      # cannot reach the `github` context's pull_request fields on a push.
      - name: Scenario sub-issue match
        id: SCN-FIT-010
        if: always()
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # THE THIRD ENDING IS ABSORBED HERE, IN OUR OWN `run:` LINE, AND THAT IS THE WHOLE OF IT
        # (3F-3252). This check answers "no pull request, so nothing to diff" with exit 3 rather
        # than by skipping the step. A step record carries a STATUS and no exit code, so nothing
        # downstream can tell that 3 from a real failure — and a row that DECLARED the code could
        # only be read for whether it was named, which would forgive every skip and hatch a
        # switched-off check into a green ledger. So the ledger learns nothing about endings, and
        # exit 3 becomes an honest `success` the runner records. Change the code here and in
        # `scnSubIssueGate.ts`'s NOT_EXAMINED_EXIT_CODE together; they are one decision.
        run: pnpm lint:scn-subissues || [ $? -eq 3 ]

      - name: Typecheck
        id: SCN-FIT-011
        if: always()
        run: pnpm typecheck

      # `--pack pnpm` IS FIDELITY, NOT THE CHECK — AND THIS COMMENT CLAIMED THE OPPOSITE FOR TWO
      # COMMITS (3F-3440, corrected after 3F-3443 measured it). It read "`--pack pnpm` IS THE WHOLE
      # CHECK": pnpm's pack applies `publishConfig` wholesale and npm's does not, so pointed npm's
      # way the linter would answer about the WORKSPACE map and its green would be true of a
      # document the registry never sees.
      #
      # THE PREMISE ABOUT THE TWO PACKERS IS RIGHT. THE CONCLUSION ABOUT THIS TOOL IS NOT. `publint`
      # reads `publishConfig` ITSELF, whichever packer it is handed. Measured both ways under one
      # plant — `publishConfig.exports["."].default` pointed at a file the tarball does not carry —
      # and `--pack npm` returned the identical `pkg.publishConfig.exports["."].default is
      # ./dist/nope.js but the file does not exist`, exit 1, with `All good!` at control on both.
      #
      # SO THE FLAG STAYS, FOR A SMALLER AND STILL SUFFICIENT REASON: `release.yml` packs with pnpm,
      # and a check run over a tarball the release does not send is a check of something nobody
      # ships.
      #
      # AND THE RULE IS PER-TOOL, WHICH IS THE HALF WORTH CARRYING. It DOES hold for the step below:
      # `attw` has no `publishConfig` reading of its own, so the packer decides what it sees and the
      # wrong one manufactures a red that means nothing. Two tools, the same two packers, opposite
      # consequences — a rule read off one of them does not transfer to the other, and reading it
      # across is how this comment came to state a mechanism its own tool does not have.
      - name: Published packages
        id: SCN-FIT-018
        if: always()
        run: pnpm lint:publint

      # THE PACKER IS THE CHECK HERE, AND THE WRONG ONE GIVES A RED THAT MEANS NOTHING (3F-3443).
      # `attw`'s own `--pack` runs `npm pack`, which does not apply `publishConfig` — so pointed at
      # the workspace directory it answers about `"." : "./src/index.ts"` and an `./internal`
      # subpath the published package does not have, and reports 💀 on every resolution. That red
      # names TypeScript sources no consumer receives, so clearing it would be work on a document
      # the registry never sees. So the script packs with pnpm — which DOES apply `publishConfig`,
      # verified by reading the manifest back out of the .tgz — and hands attw the TARBALL, which is
      # also the artefact `release.yml` actually stages.
      #
      # AND THE PACKER RULE DOES NOT GENERALISE TO THE STEP ABOVE (3F-3442). `publint` reads
      # `publishConfig` itself whichever packer it is given, so there the flag is fidelity. `attw`
      # 0.18.5 reads only the manifest in front of it. The rule is per-tool; do not carry either
      # half across.
      #
      # `--profile esm-only` IS WHAT `"type": "module"` EARNS, NOT A SUPPRESSION. The default
      # profile adds one `cjs-resolves-to-esm` warning, which says a `require()` of this package
      # resolves to ESM — the package's own declared design, clearable only by shipping a CommonJS
      # build this project has decided not to ship. The profile ignores exactly the two resolutions
      # that presume a CJS consumer and leaves every other finding able to red this gate.
      - name: Published types
        id: SCN-FIT-019
        if: always()
        run: pnpm lint:published-types

      # THE FIRST CHECK IN THIS FILE THAT IS NOT A COMMAND, AND THE `id:` IS WHAT KEEPS IT ON THE
      # BOOKS (3F-3444, @SCN-USG-013). A `uses:` step states no command at all, so discovery names
      # it by the identity GitHub displays — this step's `name:` — and has no manifest handle to
      # reach a row through. The `id:` is the citation and the only one available to an action
      # step: without it this step is a candidate fitness check nothing cites, posts to the
      # suspense row, and reds the self-reconciliation on itself.
      #
      # AND IT IS DELIBERATELY NOT A `pnpm verify` RUNG. That ladder is derived from the `run:`
      # steps of this file that invoke a `package.json` script, so an action step is simply not one
      # — the same shape `pnpm exec eslint` already has. @SCN-LAD-006's gate count is unmoved at
      # eleven by this commit, which is the derivation being exact rather than a gap: a handle
      # minted here to force this check onto the local ladder would be a convention invented to
      # satisfy an arithmetic, and the tool ships no Node entry point to hang one on.
      #
      # THE DOCKER IMAGE IS THE TOOL'S OWN DOCUMENTED FORM, PINNED TO AN EXACT VERSION. The npm
      # package spelled `actionlint` is a third-party wasm wrapper on an unrelated version line and
      # exposes no executable (`npx -y actionlint@2.0.6` → "could not determine executable to
      # run"). The other documented form is `curl ... | bash`, which pipes a network fetch into a
      # shell inside the very job whose security the audit step beside it exists to read.
      #
      # WHAT IT FOUND THE FIRST TIME IT RAN OVER THIS TREE, AND WHAT WAS DONE ABOUT IT, IS IN
      # `.github/actionlint.yaml` — two findings, one construct, one named suppression with the
      # reason and the residual written out.
      - name: Workflow correctness
        id: SCN-FIT-020
        if: always()
        uses: docker://rhysd/actionlint:1.7.12

      # THE AUDIT THIS FILE IS ITSELF A SUBJECT OF (3F-3445, @SCN-FIT-021). `actionlint` above asks
      # whether Actions can RUN these three files; this asks whether running them is safe. Fifteen
      # findings answered "not entirely" the first time it read them, and they were cleared rather
      # than filtered: eight `uses:` references pinned to commits, `persist-credentials: false` on
      # all three checkouts, a `permissions:` block written out on the nightly sweep, and
      # `package-manager-cache: false` on the release's `setup-node` — each one argued at the line
      # it changed.
      #
      # THE MAINTAINERS' OWN ACTION, WITH `advanced-security: false`, AND THE CONFIGURATION IS THE
      # WHOLE OF WHY (3F-3445, operator ruling 2026-09-16). The action's DEFAULT is
      # `advanced-security: true`, which switches zizmor to SARIF and uploads the result to code
      # scanning; this repository is private with no Advanced Security, so the default is a step
      # that runs, finds, and leaves the job green — the watermelon this product exists to name.
      # That is a reason to configure the action, not to write the call ourselves.
      #
      # WHAT `advanced-security: false` ACTUALLY DOES WAS MEASURED, NOT READ OFF THE README. The
      # action is a composite whose script ends `exit "${exitcode}"` — zizmor's own exit code,
      # unconditionally — and that was confirmed by running `action.sh` at `cc914d7` end to end
      # against this tree twice: clean, **exit 0**, printing `No findings to report. Good job!`;
      # with one `uses:` un-pinned in `mutation.yml`, **exit 14**, printing the finding. So the
      # action gates in this configuration, and the earlier register here — which dismissed it on
      # the behaviour of a mode we would never enable — was answering a question nobody asked.
      #
      # `annotations:` IS LEFT AT ITS DEFAULT OF FALSE, AND THAT IS A TRADE THIS FILE HAS ALREADY
      # MADE ELSEWHERE. Setting it swaps zizmor's human output for `--format=github`, which emits
      # one `::error` per finding and NO summary line — measured, same two runs. The summary line
      # is where this step's suppressions are counted out loud, which the paragraph below is about,
      # and a silent suppression is worth more to a reader here than an inline marker.
      #
      # `online-audits: false` IS STATED, AND UNDER THIS ACTION IT IS THE ONLY THING KEEPING THE
      # AUDIT SET DECIDED. zizmor is offline when it finds no token in its environment, so a bare
      # CLI call here would be offline by accident; the action is not that — it passes
      # `${{ github.token }}` into the container on every run by default, so the audit set would be
      # decided by a token nobody in this file chose. The narrow input rather than `--offline`:
      # `--offline` also forbids auditing remote repositories, which is a capability this step does
      # not use and has no reason to withdraw.
      #
      # WHAT THAT COSTS, MEASURED ON THIS TREE RATHER THAN ASSUMED: the online audits — the ones
      # that resolve a pinned commit against its repository, and the ones that read an advisory
      # feed — do not run. Run WITH a token over these same three files, zizmor reports exactly
      # what it reports without one: `No findings to report. Good job!`. So nothing is being hidden
      # today. What is given up is a FUTURE finding about the world rather than about this tree —
      # an advisory published against an action this file pins would red a build over a commit that
      # changed nothing, which is the same trade `ci.yml` already makes by reading the nightly
      # sweep's number instead of taking one.
      #
      # A BLANKET `--min-severity` IS BANNED AND IS NOT WHAT THE NAMED SUPPRESSIONS IN `release.yml`
      # ARE. That flag would have cleared all fifteen findings in one character and left the eight
      # High ones in the tree — the gate satisfied in form and defeated in substance. What
      # `release.yml` carries instead is `# zizmor: ignore[<audit>]` comments, each naming ONE audit,
      # each on the one line it excuses, each with the reason written above it. The count line above
      # reports how many were ignored on every run, so a suppression is a number a reader meets
      # rather than a silence.
      #
      # AND IT IS DELIBERATELY NOT A `pnpm verify` RUNG, the same as the step above it. The local
      # ladder is derived from the `run:` steps of this file that invoke a `package.json` script,
      # and this step has no `run:` at all — @SCN-LAD-006's count is unmoved by this commit.
      # Minting a manifest handle to force it on would be a convention invented to satisfy an
      # arithmetic.
      #
      # THE ACTION IS PINNED TO A COMMIT AND THE TOOL IS PINNED TO A VERSION, WHICH ARE TWO PINS
      # AND NOT ONE. `version:` defaults to `latest`; left alone, this step would audit this tree
      # with whatever the maintainers released this morning, which is the same unpinned-tool
      # complaint zizmor itself raises about a `uses:` on a tag. The action resolves the version it
      # is given to a DIGEST from a table it ships, so the image that runs is content-addressed.
      - name: Workflow security
        id: SCN-FIT-021
        if: always()
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          inputs: .github/workflows/
          advanced-security: false
          online-audits: false

      # THE THREE MEASURED ROWS PRINT A NUMBER THEY DID NOT TAKE, WHICH IS WHY THEY ARE READERS AND
      # NOT SWEEPS. A step's outcome is an exit code and an exit code cannot carry a measurement, so
      # the measured half keeps exactly what it has: the command writes the number into the
      # measurement artefact (@SCN-LNT-024) and published core reads it through `--measurements`.
      # Their STEPS are still what says the check ran (@SCN-LNT-027) — a number arriving for a row
      # the run recorded no step for is a number from a route that enumerates nothing. These steps run
      # behind the producers they read — `Test` for SCN-FIT-012, `Cucumber` for SCN-FIT-013, and the
      # placement for SCN-FIT-002 — because a reader ahead of its producer has nothing to print.
      - name: Unit suite run time
        id: SCN-FIT-012
        if: always()
        run: pnpm --silent timing:score --scn SCN-FIT-012

      - name: Behavioural suite run time
        id: SCN-FIT-013
        if: always()
        run: pnpm --silent timing:score --scn SCN-FIT-013

      - name: Mutation score
        id: SCN-FIT-002
        if: always()
        run: pnpm --silent mutation:score --supersedes SCN-MUT-011

      # THE DUMP — THE ONLY PLACE `outcome` AND `id` ARE CARRIED TOGETHER (3F-3252).
      #
      # `outcome` IS PRE-`continue-on-error`; `conclusion` IS POST. A step marked
      # `continue-on-error: true` that actually failed reports `conclusion: success`, so a reader
      # taking `conclusion` is green over a masked failure — a one-line watermelon in the watermelon
      # product. The jobs API cannot see through that mask at all: its step object carries
      # `[completed_at, conclusion, name, number, started_at, status]` and no `outcome` and no `id`.
      # This dump is not one source among two. It is the only one.
      #
      # `if: always()` BECAUSE ITS WHOLE VALUE IS THE RED RUN. A dump that only runs on a green
      # build records the one case nobody needed a record of.
      #
      # THE JSON CROSSES THROUGH `env:` RATHER THAN INTO THE COMMAND LINE. A `${{ }}` expansion
      # inside `run:` is substituted into the script before bash sees it, so a step name carrying a
      # quote would end the string and the rest would be shell. As an `env:` value it is data, and
      # `printf '%s'` never re-reads it.
      - name: Dump this run's step record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        #
        # AND IT SAYS HOW BIG THE RECORD IS, BECAUSE `printf` EXITS 0 OVER AN EMPTY VARIABLE. A step
        # that wrote nothing and a step that wrote the run both end `success`, so a green step is
        # not on its own a signal that anything crossed. The byte count and the step count are that
        # signal, and the `jq` length is what would notice an expansion that resolved to `{}`. The
        # gate below now reads this file as the whole fitness axis's credit stream, so an empty one
        # is ten broken rows and an unsound run rather than a quiet nothing.
        run: |
          mkdir -p "$SPEC_CONTROLLER_EVIDENCE_DIR"
          record="$SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json"
          printf '%s' "$STEPS_JSON" > "$record"
          printf 'step record: %s bytes, %s step(s) with an id:\n' \
            "$(wc -c < "$record" | tr -d ' ')" "$(jq 'length' "$record")"

      # STEP 3 — THE SELF-RECONCILIATION GATE (3F-2351). spec-controller's
      # own tree, put through spec-controller: the evidence obligations raised in features/
      # reconciled against the two streams above plus this file and package.json, with the
      # build depending on the verdict.
      #
      # This closes a gap the tool itself is built to name. The reconciler could always
      # report this repository's own one-way evidence claims — a tier named and never
      # observed, an observation citing nothing, a guard running that no scenario names —
      # and no step ever ran it, so that defect class had to be found twice by accident,
      # here. A report nobody is obliged to read is not a check.
      #
      # It EXITS on the verdict rather than printing one (@SCN-CLI-004 / 3F-1414: 0
      # balanced, 1 out-of-balance, 2 usage). Report mode was the pre-agreed first rung and
      # is deliberately not where this stops: a step that exits 0 regardless is the
      # watermelon it exists to detect.
      #
      # It runs AFTER both suites because it consumes their output — a gate over reports
      # that were never emitted reports every obligation unobserved, which means "the suite
      # did not run", not "the code is wrong", so the CLI reds a supplied-but-absent
      # `--vitest` or `--cucumber` as a usage fault (exit 2, @SCN-CLI-002) instead of
      # dressing it as a verdict. That rule is the product's own and is asserted where it
      # lives; nothing here restates it.
      #
      # IT IS NOT ON THE LEDGER IT COMPUTES, AND THE HANDLE IS HOW (3F-3113). This step used
      # to carry a `lint:` prefix, cited by a stepless fitness scenario, so the run
      # that produced the ledger also posted a row asserting that ledger balanced — a second
      # arbiter for a fact that already has one, this step's own exit code. The scenario and
      # its registry entry are retired, and the handle moved OUT of the observed set to match:
      # runningStaticChecks observes a `package.json` script as a running static check only
      # when its name carries an observed prefix (`lint:` / `guard:`) and a CI `run:` step
      # invokes it, so `spec-controller` is deliberately outside it. Spelled `lint:` this step
      # would cite nothing, post to the suspense row, and red on itself.
      #
      # AND IT IS THE PRODUCT'S OWN BINARY, INVOKED THE WAY AN ADOPTER INVOKES IT (3F-3293).
      # It used to be a wrapper — a repository-local script, 325 lines of TypeScript resolving
      # seven scan surfaces before handing the argv on. No adopter can write that and none should,
      # so the exemplar stopped teaching it: the surfaces are flags on this line, the `spec-controller`
      # script is the workspace CLI and nothing else, and what this repository dogfoods is the
      # command a consumer types. The wrapper's evidence-report precondition went with it, because
      # the CLI already holds that rule (@SCN-CLI-002) and a second implementation one level up is
      # the shape this repository keeps deleting.
      #
      # THE TWO OPTIONAL EVIDENCE FLAGS ARE PASSED ONLY WHERE THE FILE EXISTS, AND THAT CONDITIONAL
      # IS THE WHOLE OF WHAT THE WRAPPER DID HERE. A `--measurements` or `--ci-steps` path the CLI
      # is handed and cannot find is a usage fault to it and exits 2 — the wrong verdict. Absent,
      # each leaves exactly its own rows unanswered, and those reconciling `missing` is the honest
      # reading: a step that never ran is never balanced (@SCN-CIP-006). `ci-steps.json` is written
      # by the dump step above, so a developer's machine never has one and a local run must not be
      # called broken over it. The `$(...)` is unquoted on purpose — the two tokens have to split.
      #
      # ONE LINE, AND ONE `package.json` SCRIPT. `pnpm verify`'s ladder is DERIVED from this file
      # (`localLadder.ts`), and that derivation reports a multi-line `run:` or a step invoking two
      # scripts as `unsupported`, which reds the local green-check outright rather than running
      # half a gate. `commandInvokesScript` matches the token straight after `pnpm`, so
      # `spec-controller` is the one hit and the `balance` word behind it is an argument. The
      # command string is carried verbatim into the local ladder, which is why the evidence paths
      # are written against `SPEC_CONTROLLER_EVIDENCE_DIR`: `scripts/verify.sh` exports the same
      # variable, so one string resolves in both environments.
      - name: Self-reconciliation balance
        run: pnpm spec-controller balance --features features --vitest "$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json" --cucumber "$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json" $([ -f "$SPEC_CONTROLLER_EVIDENCE_DIR/measurements.json" ] && echo "--measurements $SPEC_CONTROLLER_EVIDENCE_DIR/measurements.json") $([ -f "$SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json" ] && echo "--ci-steps $SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json") --ci .github/workflows/ci.yml --package-json package.json --target spec-controller
