name: CI

on:
  push:
    branches: [main]
  pull_request:

# THE LADDER READS ONE THING IT DOES NOT OWN (3F-2765, 3F-3483): the verdict of the nightly
# mutation sweep, which the `Mutation score` step lists off `mutation.yml`'s own runs.
# `actions: read` is what lets it, and the block is written out rather than left to the
# repository default so that a default tightened elsewhere cannot reach this ladder: without the
# permission that step fails, and its `failing` would read exactly like a schedule that had lapsed.
permissions:
  contents: read
  actions: read

# ONE RUN PER REF, AND A SUPERSEDED PULL-REQUEST RUN IS CANCELLED (3F-3457). Measured over
# 2026-09-01..16: 644 of this repository's 744 workflow runs were `CI | pull_request`, 2,330 of
# 2,738 billed minutes. The driver is the NUMBER of runs, not the length of one — every push to a
# branch with an open pull request started a full run, and the earlier one kept going.
#
# `cancel-in-progress` IS CONDITIONAL, AND THE CONDITION IS THE WHOLE CARE. A `push: main` run is
# NEVER cancelled: its verdict is what a merge was decided on, and it is the trunk control the next
# branch reads to tell an inherited red from its own. Cancelling those would save little and
# destroy the one run whose conclusion later work is compared against.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A RED ABORTS THIS JOB AND SKIPS EVERY STEP BEHIND IT — RULED, NOT OVERLOOKED (3F-3042).
# Measured over the 200 runs to 0ef9263: 72 failed, and every one of the 72 left at least one gate
# unreached — a median of three, as many as sixteen. Not one failed run ever completed the
# self-reconciliation: 55 never reached it, and the other 17 reached it and it was the red. This is
# not something that bites in a bad week. It bites on every red there has ever been.
#
# IT IS STILL ACCEPTABLE, AND THE REASON IS NOT RARITY. A merge is decided on a GREEN run, and a
# green job is exactly the state in which nothing was suspended: GitHub aborts at the first red, so
# `success` means every unconditional step ran. The run that turns a pull request green ran this
# whole ladder over the head being merged, and the squash puts that content on main. Suspension is
# confined to runs whose verdict is already "not ok" — where nothing is believed about the steps
# behind the red, because nothing is believed about the run.
#
# WHAT IT COSTS IS ROUND-TRIPS. A red build names one failure where it could have named four.
# `mutation.yml` used to make the same trade for the sweep, leaving its measurement upload unguarded
# so that a sweep that died left no number worth reaching (3F-2957); that upload left with the
# producer that wrote it (3F-3505). Splitting these steps into independent jobs buys N checkouts and
# N installs to make a RED build more talkative, and buys nothing where a decision is actually made.
#
# AND THE FITNESS CHECK STEPS BELOW CARRY `if: always()`, WHICH MAKES THE PREMISE STRONGER RATHER
# THAN NEEDING AN EXCEPTION FROM IT (3F-3271, under 3F-3252). A condition is not one thing. The
# condition that would falsify the paragraph above is a NARROWING one — a step that a green run
# skips, so `success` stops meaning it ran, which is exactly what `Lint scenario sub-issue match`
# used to do before 3F-3165 (it is @SCN-FIT-010 now, and the case its condition existed for is
# answered by the check itself with a third ending, absorbed in that step's own `run:` line). `always()` is the opposite: the DEFAULT is
# `if: success()`, so `always()` WIDENS — the step runs on a green build and also on a build that
# has already redded. There is no run in which an `always()` step is skipped and an unconditional
# one is not. `success` still means every step in this job ran, and now a red run means more of
# them ran too.
#
# WHAT IS DELIBERATELY REVERSED IS THE COST TRADE, AND ONLY FOR THE CHECK STEPS. 3F-3042's trade
# above — a red names one failure where it could have named four — stands everywhere else in this
# file. It is reversed for the fitness check steps because those steps are INDEPENDENT of one
# another: eslint's red says nothing about typecheck's, so stopping at the first tells a reader
# nothing they could have inferred. The price is a slower red build; the ledger this file now feeds
# is the reason it is worth paying. A fitness row with no entry in the run record is BROKEN evidence
# and stamps the run unsound, so without `always()` one early red would report one `failing` and
# nine `broken` — a worse account from a correct mechanism. The exceptions are the two runners,
# `Test` and `Cucumber`: each is a suite's run-time check (SCN-FIT-012, SCN-FIT-013) and that
# suite's runner at once, and each keeps a runner's unconditional place at the head of the ladder.
#
# ONE ATTRIBUTE WOULD FALSIFY ALL OF THIS, AND IT IS FENCED RATHER THAN ASKED FOR POLITELY.
# `continue-on-error` severs job-green from step-ran: the step runs, reds, and the job ends green
# over a step that enforced nothing. It is also the cheap answer this ticket was tempted by, and it
# would have MANUFACTURED the invisibility it set out to close — the shared CI parse walked
# `jobs -> steps -> run` and discarded every other key of the step, so a swallowed step read as
# enforced and the ledger balanced it. Do not put it on a step or on this job. A derived local
# green-check used to refuse the attribute outright over this file; it left at 3F-3475, and what
# enforces the rule now is the product's own reconciliation of this repository — measured there by
# planting `continue-on-error: true` on SCN-FIT-011, which came back as the watermelon ("passing
# but fabricated") and took the run out of balance. The fence is the ledger's, not a check of ours.

jobs:
  ci:
    runs-on: ubuntu-latest
    # A BOUND ON A HUNG JOB, NOT A PERFORMANCE BAR (3F-3457). Measured over 2026-09-01..16: 720
    # runs, mean 3.1 min, max 7.4 min — and ~6.6 min once this ticket's 50s of mutation steps left.
    # Fifteen is about twice the measured max, so an ordinarily slow run never trips it.
    #
    # WHAT IT IS FOR IS THE SIX-HOUR DEFAULT IT REPLACES. With no timeout a wedged job burns six
    # hours of a 3,000-minute monthly allowance before GitHub stops it — one hang costs more than
    # this whole ticket saves in a month. The repository's actual run-time gates are @SCN-FIT-012
    # and @SCN-FIT-013, the `timeout 75` and `timeout 150` the `Test` and `Cucumber` steps run their
    # suites under; this number is not one of them and must not be read as one.
    timeout-minutes: 15
    steps:
      # EVERY `uses:` IN THIS REPOSITORY NAMES A COMMIT, AND THE TAG IS A COMMENT (3F-3445,
      # @SCN-FIT-021). A tag is a pointer its owner can move, so `@v7` says nothing about what this
      # runner will actually fetch tomorrow — the same three words can resolve to a different tree
      # on the next run, with no commit here and nothing to review. The audit step at the foot of
      # this ladder reports an unpinned `uses:` at its highest severity, and eight of them were what
      # it found the first time it read these three files. The SHA is what the runner resolves; the
      # `# vX.Y.Z` after it is the release that commit WAS when it was pinned, which is what a
      # reader needs to find the diff before bumping one.
      #
      # AND `persist-credentials: false`, WHICH COSTS THIS JOB NOTHING BECAUSE NOTHING IN IT TALKS
      # TO THE REMOTE AFTER THIS STEP. `actions/checkout` otherwise leaves the job's token in
      # `.git/config`, where every later step of this job can read it and anything a dependency of
      # this build starts can read it too. Every git command this ladder runs is local to the
      # checkout — `git diff`, `git merge-base`, `git log`, `git show` in `lintScnSubIssuesCli.ts`
      # — and `fetch-depth: 0` is exactly what makes them local: the history they need is already
      # on the disk. A step added later that fetches or pushes would fail loudly on a private
      # repository rather than quietly, which is the right way round.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scenario sub-issue guard can diff HEAD against
          # the PR base ref (github.event.pull_request.base.sha). The default
          # shallow checkout would not contain the base commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      # WHERE THIS RUN'S EVIDENCE LIVES, RESOLVED ONCE FOR EVERY STEP BELOW (3F-3099).
      #
      # spec-controller used to write its own output into its own source tree, and three pieces of
      # apparatus existed only because it did — a `.gitignore` block, a hygiene check, and that
      # check's own coverage gap. The suites' reports and the step record are this run's OUTPUT, so
      # they land on the runner's disk instead.
      #
      # ONE ENTRY, NOT FOUR, AND THAT IS THE POINT. Two suites write their reports, the dump step
      # writes this run's step record, and the self-reconciliation reads all of them; a `$RUNNER_TEMP`
      # expression repeated at each of them is a path that agrees today and drifts on the first edit
      # that misses one.
      #
      # A STEP AND NOT A JOB-LEVEL `env:` KEY, WHICH IS GITHUB'S CONSTRAINT RATHER THAN A
      # PREFERENCE. `jobs.<id>.env` cannot read the `runner` context — a workflow naming
      # `${{ runner.temp }}` there fails to START, with no job and so no step conclusions to read.
      # `$RUNNER_TEMP` is an ordinary variable inside a `run:` shell, so the value is computed here
      # and handed to every later step through `$GITHUB_ENV`.
      #
      # AND IT SURVIVES BETWEEN THOSE STEPS BECAUSE THIS WORKFLOW STATES EXACTLY ONE JOB — verified
      # against the API rather than read off the indentation. One job is one runner filesystem.
      # Split it in two and the suites' reports stop reaching the read, which `balance` reds as a
      # supplied-but-absent path (@SCN-CLI-002). The split that used to red NOTHING was the sweep
      # record a placement step carried across, which read as a lapsed nightly; it left with that
      # step (3F-3504), and no check on this file's SHAPE was ever added for it, because that is
      # exactly the control surface 3F-3099 exists to remove.
      #
      # IT IS NOT A CHECK, AND THE PRODUCT'S OWN DISCOVERY IS TOLD SO RATHER THAN LEFT TO GUESS.
      # Every `run:` step of this file is a candidate fitness check; this one is excused by name in
      # `specController.notChecks`, which is the one place that excuse is written. A derived local
      # green-check used to have to be reasoned about here as well; it left at 3F-3475.
      - name: Resolve the evidence root
        run: echo "SPEC_CONTROLLER_EVIDENCE_DIR=$RUNNER_TEMP/spec-controller-evidence" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BUILT SO THE PUBLISHED SURFACE IS COMPILED ON A PULL REQUEST AT ALL (3F-2765). Nothing else
      # in this ladder reads the built form, so before this step existed a `tsc -p` failure in
      # either package's build config reached main and was found by whoever next ran `pnpm build`.
      # That is now the whole of this step's reason, and the `pnpm rebuild` that used to follow it
      # is gone with the other half (3F-2841): the bins existed for a measurement action that
      # reached its CLI by name, and this workflow calls no such action any more.
      # `build` carries no observed prefix and is not among the static checks package.json names,
      # so it joins the local ladder (which is derived from this file) without joining the ledger
      # — it is a step the checks need, not a check.
      - name: Build
        run: pnpm build

      # STEP 1 OF THE SELF-RECONCILIATION CHAIN — the observed @unit stream. The run is
      # unchanged; it now also writes the machine-readable report the gate below reads.
      # It lands under the job's evidence root, on the runner's own disk, because a
      # reconciliation report enumerates this codebase's gaps and is this run's OUTPUT — writing
      # it into the source tree it is about is the defect 3F-3099 closes. The default reporter is
      # kept alongside so a failure is still readable in the log rather than only in JSON.
      #
      # AND IT IS SCN-FIT-012'S CHECK AS WELL AS THE UNIT RUNNER, WHICH IS WHY IT CARRIES `timeout`
      # AND AN `id:`. The row's bar is the limit this step runs the suite under, in seconds: past it
      # GNU `timeout` exits 124, the step's `outcome` is `failure`, and the dump below carries that
      # to `balance` under this `id:`, which is the row's `@SCN`. No `if: always()`: a runner keeps
      # its place at the head of the ladder.
      - name: Test
        id: SCN-FIT-012
        run: timeout 75 pnpm test --reporter=default --reporter=json --outputFile.json="$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json"

      # STEP 2 — the observed @integration / @e2e stream. `--format json:` adds a
      # file formatter; the progress formatter stays on stdout.
      #
      # AND IT IS SCN-FIT-013'S CHECK AS WELL AS THE BEHAVIOURAL RUNNER, for the reason `Test` is
      # SCN-FIT-012's: the row's bar is the limit this step runs the suite under, in seconds; past
      # it GNU `timeout` exits 124, the step's `outcome` is `failure`, and the dump below carries
      # that to `balance` under this `id:`. No `if: always()`, for the same reason as `Test`.
      - name: Cucumber
        id: SCN-FIT-013
        run: timeout 150 pnpm cucumber --format json:"$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json"

      # STEP 2b — THE FITNESS ROWS, AS ONE CI STEP EACH THAT CITES THEM (3F-3271, under
      # 3F-3252; the second cucumber call they replaced was deleted at 3F-3272).
      #
      # THERE USED TO BE A `Cucumber (fitness)` STEP HERE, and what it did is now done by these
      # ten. It was a SECOND cucumber call over its own profile: it ran every converted check's
      # command and wrote a report the ledger read as their credit stream. That is a second evidence
      # stream manufactured beside one that already existed — the run record this job's own dump
      # step writes — so it went with the pass.
      #
      # AND THE GATES CAME BACK UP THE LADDER WITH THE SPLIT, WHICH IS THE COST THE CONVERSION PAID
      # BEING REFUNDED. `Lint complexity` and its siblings used to run near the top; converting them
      # put every one behind the whole test and cucumber ladder, inside one pass. They are steps
      # again, each reached in its own right and each reporting on its own.
      #
      # THE CONSUMER'S CI IS THE CREDIT JOURNAL, AND `balance` EXECUTES NOTHING. A quality check is
      # already a command in a pipeline; a run of that pipeline is already a record of what each
      # command did, written by the provider for its own purposes. So the fitness axis reads that
      # record instead of manufacturing a second one — which is what the cucumber fitness pass was,
      # and why it is deleted. What a consumer writes is an `id:` per check step and one dump step;
      # `doc/adopting-fitness-checks.md` is the whole of it.
      #
      # THE `id:` IS THE `@SCN` ITSELF, AND IT CITES THE ROW RATHER THAN RESTATING IT. The
      # obligation stays in the `@fitness` scenario, the command stays in the row of
      # `specController.fitnessChecks`, and this step produces the observation. Three books, three
      # authors, none of them able to answer for another. An arbitrary handle would need a fourth
      # artefact mapping it back, which is the roster this repository keeps deleting.
      #
      # AND ONLY A STEP CARRYING AN `id:` IS IN THE `steps` CONTEXT AT ALL — GitHub's own rule, not
      # a filter written here. `checkout`, `setup-node` and `Install dependencies` are not checks
      # and do not appear, so the dump below needs no discriminator of its own.
      #
      # EVERY ONE CARRIES `if: always()`, AND THAT IS THE HALT OBJECTION ANSWERED RATHER THAN
      # INHERITED. Without it the first red check aborts the job and every later check step is
      # skipped, so the ledger would read one `failing` and N `broken` — a worse report from a
      # correct mechanism. The checks are INDEPENDENT: eslint's red says nothing about typecheck's,
      # so naming four failures beats naming one here. See the header for what that reverses and
      # what it does not.
      #
      # THEY INVOKE THE package.json HANDLE AND NOT THE CLI BEHIND IT, AND THE REASON IS NOW ONLY
      # THAT THE ROW SAYS SO. Each of these steps cites a row of `specController.fitnessChecks`
      # through its `id:`, and that row's `command` is the handle — `pnpm lint:boundaries`, not
      # `pnpm exec depcruise packages && pnpm exec eslint --config eslint.boundaries.mjs packages`,
      # which would run the identical check. A reader matching the pipeline against the manifest
      # reads the two spellings side by side, so keeping them the same is what makes that reading
      # possible. Where the pipeline genuinely needs a different spelling it says so at the step, as
      # `Complexity` does for `pnpm exec`.
      #
      # THE SECOND REASON WAS MECHANICAL AND HAS GONE. A derived local green-check took its gate
      # list from the `run:` steps of this file that invoked a package.json script, so a step spelt
      # around the handle silently dropped out of it. That derivation was deleted at 3F-3475, and
      # nothing mechanical now notices the difference — which is stated here rather than left for a
      # reader to discover by changing one.
      - name: Complexity — eslint's cognitive-complexity and max-lines-per-function
        id: SCN-FIT-001
        if: always()
        # `pnpm exec` rather than the row's bare `eslint`, because a `run:` shell has no
        # `node_modules/.bin` on its PATH. The row states the bare command a consumer would type;
        # what a pipeline needs to put it on the PATH is the pipeline's business.
        run: pnpm exec eslint

      # THE ONE STEP HERE THAT IS THE PRODUCT RATHER THAN A CHECK WE WROTE (3F-3311), AND IT IS NOW
      # THE ONLY ONE POLICING THE CORPUS. It stood beside two private copies of itself —
      # `lint:scn-tags` (620 lines over a hand-rolled line parser, left at 3F-3312) and
      # `lint:feature-codes` (417 lines over a second corpus walk and a hand-kept table of feature
      # codes, left at 3F-3313) — both under `tests/checks/`, which is in neither package's
      # published `files` and so unreachable from any other repository by construction. An adopter
      # got `@SCN` codes and inherited nothing that policed them. This step runs the WORKSPACE CLI
      # DIRECTLY, the way an adopter runs the command they installed, which is the whole of what
      # acceptance item 2 asks: a private copy ships nothing. `3F-3296` de-wrappered the
      # self-reconciliation step below for the same reason, and the two steps now differ only in
      # which command they hand the binary.
      #
      # IT INVOKES NO `package.json` SCRIPT, AND THAT IS WHY NO PHANTOM CHECK ARRIVES WITH IT.
      # `runningStaticChecks` counts a `package.json` script as a running static check when its
      # name carries an observed prefix (`lint:` / `guard:`) and a CI `run:` step invokes it. This
      # tree has no `spec-controller` script at all since 3F-3476 — `pnpm` falls through to the
      # pinned binary in `node_modules/.bin` — so there is no manifest entry for the rule to reach,
      # and this step adds an observation for SCN-FIT-014 and nothing to the static-check census.
      #
      # SO THE `id:` IS THE WHOLE CITATION. The obligation is the `@fitness` scenario, the
      # command is the row in `specController.fitnessChecks`, and this step is the observation that
      # answers them — cited by `id:` alone (@SCN-LNT-031). Misspell it and the credit posts to the
      # suspense row while the scenario reads unobserved.
      - name: Corpus tags
        id: SCN-FIT-014
        if: always()
        run: pnpm spec-controller tags

      - name: Import boundaries
        id: SCN-FIT-009
        if: always()
        run: pnpm lint:boundaries

      # THE THREE KEYS ARE THIS STEP'S OWN, AND THEY ARE THE ONLY COPY. `Cucumber (fitness)` used
      # to carry the same block because the pass ran this check too; the pass is gone and this is
      # what the check runs under. Without them it runs over an empty pull-request context, answers
      # "I examined nothing" on every build, and is credited as having run — a check that stopped
      # checking looks identical to a green. They are named on the STEP because `jobs.<id>.env`
      # cannot reach the `github` context's pull_request fields on a push.
      - name: Scenario sub-issue match
        id: SCN-FIT-010
        if: always()
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # THE THIRD ENDING IS ABSORBED HERE, IN OUR OWN `run:` LINE, AND THAT IS THE WHOLE OF IT
        # (3F-3252). This check answers "no pull request, so nothing to diff" with exit 3 rather
        # than by skipping the step. A step record carries a STATUS and no exit code, so nothing
        # downstream can tell that 3 from a real failure — and a row that DECLARED the code could
        # only be read for whether it was named, which would forgive every skip and hatch a
        # switched-off check into a green ledger. So the ledger learns nothing about endings, and
        # exit 3 becomes an honest `success` the runner records. Change the code here and in
        # `scnSubIssueGate.ts`'s NOT_EXAMINED_EXIT_CODE together; they are one decision.
        run: pnpm lint:scn-subissues || [ $? -eq 3 ]

      - name: Typecheck
        id: SCN-FIT-011
        if: always()
        run: pnpm typecheck

      # `--pack pnpm` IS FIDELITY, NOT THE CHECK — AND THIS COMMENT CLAIMED THE OPPOSITE FOR TWO
      # COMMITS (3F-3440, corrected after 3F-3443 measured it). It read "`--pack pnpm` IS THE WHOLE
      # CHECK": pnpm's pack applies `publishConfig` wholesale and npm's does not, so pointed npm's
      # way the linter would answer about the WORKSPACE map and its green would be true of a
      # document the registry never sees.
      #
      # THE PREMISE ABOUT THE TWO PACKERS IS RIGHT. THE CONCLUSION ABOUT THIS TOOL IS NOT. `publint`
      # reads `publishConfig` ITSELF, whichever packer it is handed. Measured both ways under one
      # plant — `publishConfig.exports["."].default` pointed at a file the tarball does not carry —
      # and `--pack npm` returned the identical `pkg.publishConfig.exports["."].default is
      # ./dist/nope.js but the file does not exist`, exit 1, with `All good!` at control on both.
      #
      # SO THE FLAG STAYS, FOR A SMALLER AND STILL SUFFICIENT REASON: `release.yml` packs with pnpm,
      # and a check run over a tarball the release does not send is a check of something nobody
      # ships.
      #
      # AND THE RULE IS PER-TOOL, WHICH IS THE HALF WORTH CARRYING. It DOES hold for the step below:
      # `attw` has no `publishConfig` reading of its own, so the packer decides what it sees and the
      # wrong one manufactures a red that means nothing. Two tools, the same two packers, opposite
      # consequences — a rule read off one of them does not transfer to the other, and reading it
      # across is how this comment came to state a mechanism its own tool does not have.
      - name: Published packages
        id: SCN-FIT-018
        if: always()
        run: pnpm lint:publint

      # THE PACKER IS THE CHECK HERE, AND THE WRONG ONE GIVES A RED THAT MEANS NOTHING (3F-3443).
      # `attw`'s own `--pack` runs `npm pack`, which does not apply `publishConfig` — so pointed at
      # the workspace directory it answers about `"." : "./src/index.ts"` and an `./internal`
      # subpath the published package does not have, and reports 💀 on every resolution. That red
      # names TypeScript sources no consumer receives, so clearing it would be work on a document
      # the registry never sees. So the script packs with pnpm — which DOES apply `publishConfig`,
      # verified by reading the manifest back out of the .tgz — and hands attw the TARBALL, which is
      # also the artefact `release.yml` actually stages.
      #
      # AND THE PACKER RULE DOES NOT GENERALISE TO THE STEP ABOVE (3F-3442). `publint` reads
      # `publishConfig` itself whichever packer it is given, so there the flag is fidelity. `attw`
      # 0.18.5 reads only the manifest in front of it. The rule is per-tool; do not carry either
      # half across.
      #
      # `--profile esm-only` IS WHAT `"type": "module"` EARNS, NOT A SUPPRESSION. The default
      # profile adds one `cjs-resolves-to-esm` warning, which says a `require()` of this package
      # resolves to ESM — the package's own declared design, clearable only by shipping a CommonJS
      # build this project has decided not to ship. The profile ignores exactly the two resolutions
      # that presume a CJS consumer and leaves every other finding able to red this gate.
      - name: Published types
        id: SCN-FIT-019
        if: always()
        run: pnpm lint:published-types

      # THE FIRST CHECK IN THIS FILE THAT IS NOT A COMMAND, AND THE `id:` IS WHAT KEEPS IT ON THE
      # BOOKS (3F-3444, @SCN-USG-013). A `uses:` step states no command at all, so discovery names
      # it by the identity GitHub displays — this step's `name:` — and has no manifest handle to
      # reach a row through. The `id:` is the citation and the only one available to an action
      # step: without it this step is a candidate fitness check nothing cites, posts to the
      # suspense row, and reds the self-reconciliation on itself.
      #
      # AND IT GETS NO `package.json` HANDLE MINTED FOR IT. The tool ships no Node entry point to
      # hang one on, and a handle invented so that an action step could be counted alongside `run:`
      # ones would be a convention invented to satisfy an arithmetic. (A derived local green-check
      # used to do that counting; it left at 3F-3475, so there is not even an arithmetic now.)
      #
      # THE DOCKER IMAGE IS THE TOOL'S OWN DOCUMENTED FORM, PINNED TO AN EXACT VERSION. The npm
      # package spelled `actionlint` is a third-party wasm wrapper on an unrelated version line and
      # exposes no executable (`npx -y actionlint@2.0.6` → "could not determine executable to
      # run"). The other documented form is `curl ... | bash`, which pipes a network fetch into a
      # shell inside the very job whose security the audit step beside it exists to read.
      #
      # WHAT IT FOUND THE FIRST TIME IT RAN OVER THIS TREE, AND WHAT WAS DONE ABOUT IT, IS IN
      # `.github/actionlint.yaml` — two findings, one construct, one named suppression with the
      # reason and the residual written out.
      - name: Workflow correctness
        id: SCN-FIT-020
        if: always()
        uses: docker://rhysd/actionlint:1.7.12

      # THE AUDIT THIS FILE IS ITSELF A SUBJECT OF (3F-3445, @SCN-FIT-021). `actionlint` above asks
      # whether Actions can RUN these three files; this asks whether running them is safe. Fifteen
      # findings answered "not entirely" the first time it read them, and they were cleared rather
      # than filtered: eight `uses:` references pinned to commits, `persist-credentials: false` on
      # all three checkouts, a `permissions:` block written out on the nightly sweep, and
      # `package-manager-cache: false` on the release's `setup-node` — each one argued at the line
      # it changed.
      #
      # THE MAINTAINERS' OWN ACTION, WITH `advanced-security: false`, AND THE CONFIGURATION IS THE
      # WHOLE OF WHY (3F-3445, operator ruling 2026-09-16). The action's DEFAULT is
      # `advanced-security: true`, which switches zizmor to SARIF and uploads the result to code
      # scanning; this repository is private with no Advanced Security, so the default is a step
      # that runs, finds, and leaves the job green — the watermelon this product exists to name.
      # That is a reason to configure the action, not to write the call ourselves.
      #
      # WHAT `advanced-security: false` ACTUALLY DOES WAS MEASURED, NOT READ OFF THE README. The
      # action is a composite whose script ends `exit "${exitcode}"` — zizmor's own exit code,
      # unconditionally — and that was confirmed by running `action.sh` at `cc914d7` end to end
      # against this tree twice: clean, **exit 0**, printing `No findings to report. Good job!`;
      # with one `uses:` un-pinned in `mutation.yml`, **exit 14**, printing the finding. So the
      # action gates in this configuration, and the earlier register here — which dismissed it on
      # the behaviour of a mode we would never enable — was answering a question nobody asked.
      #
      # `annotations:` IS LEFT AT ITS DEFAULT OF FALSE, AND THAT IS A TRADE THIS FILE HAS ALREADY
      # MADE ELSEWHERE. Setting it swaps zizmor's human output for `--format=github`, which emits
      # one `::error` per finding and NO summary line — measured, same two runs. The summary line
      # is where this step's suppressions are counted out loud, which the paragraph below is about,
      # and a silent suppression is worth more to a reader here than an inline marker.
      #
      # `online-audits: false` IS STATED, AND UNDER THIS ACTION IT IS THE ONLY THING KEEPING THE
      # AUDIT SET DECIDED. zizmor is offline when it finds no token in its environment, so a bare
      # CLI call here would be offline by accident; the action is not that — it passes
      # `${{ github.token }}` into the container on every run by default, so the audit set would be
      # decided by a token nobody in this file chose. The narrow input rather than `--offline`:
      # `--offline` also forbids auditing remote repositories, which is a capability this step does
      # not use and has no reason to withdraw.
      #
      # WHAT THAT COSTS, MEASURED ON THIS TREE RATHER THAN ASSUMED: the online audits — the ones
      # that resolve a pinned commit against its repository, and the ones that read an advisory
      # feed — do not run. Run WITH a token over these same three files, zizmor reports exactly
      # what it reports without one: `No findings to report. Good job!`. So nothing is being hidden
      # today. What is given up is a FUTURE finding about the world rather than about this tree —
      # an advisory published against an action this file pins would red a build over a commit that
      # changed nothing, which is the same trade `ci.yml` already makes by reading the nightly
      # sweep's verdict instead of taking one.
      #
      # A BLANKET `--min-severity` IS BANNED AND IS NOT WHAT THE NAMED SUPPRESSIONS IN `release.yml`
      # ARE. That flag would have cleared all fifteen findings in one character and left the eight
      # High ones in the tree — the gate satisfied in form and defeated in substance. What
      # `release.yml` carries instead is `# zizmor: ignore[<audit>]` comments, each naming ONE audit,
      # each on the one line it excuses, each with the reason written above it. The count line above
      # reports how many were ignored on every run, so a suppression is a number a reader meets
      # rather than a silence.
      #
      # AND IT GETS NO `package.json` HANDLE EITHER, the same as the step above it: this step has
      # no `run:` at all, and minting a handle to force one would be a convention invented to
      # satisfy an arithmetic.
      #
      # THE ACTION IS PINNED TO A COMMIT AND THE TOOL IS PINNED TO A VERSION, WHICH ARE TWO PINS
      # AND NOT ONE. `version:` defaults to `latest`; left alone, this step would audit this tree
      # with whatever the maintainers released this morning, which is the same unpinned-tool
      # complaint zizmor itself raises about a `uses:` on a tag. The action resolves the version it
      # is given to a DIGEST from a table it ships, so the image that runs is content-addressed.
      - name: Workflow security
        id: SCN-FIT-021
        if: always()
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          inputs: .github/workflows/
          advanced-security: false
          online-audits: false

      # THE MUTATION ROW IS ANSWERED BY THE NIGHTLY SWEEP'S OWN VERDICT, NOT BY A NUMBER (3F-3483,
      # proven in 3F-3484). A sweep costs 8-12 minutes against this ladder's ~2, so it runs nightly in
      # `mutation.yml`, and Stryker ends that run in failure when the score falls below the break
      # threshold its own config states. This step asks stock `gh` for the newest completed
      # `mutation.yml` run on `main` created inside the last 26 hours, and passes only if that run
      # concluded `success`. Like every row since 3F-3506, it names no bar, so the ledger reads it as
      # it reads SCN-FIT-001: this step's outcome is the evidence, and no code of ours
      # stands between the sweep and the books. `--branch main` is the branch this ladder gates, so a
      # hand-dispatched sweep of another branch is never the one read.
      #
      # WHAT THAT GIVES UP, NAMED HERE RATHER THAN LEFT TO BE FOUND. (1) The ledger no longer shows
      # the score: the row reads satisfied or failing, and the number stays in the nightly's Stryker
      # report. (2) A lapsed schedule, a crashed sweep and a below-bar sweep all read `failing` — no
      # run inside the window yields no conclusion, and no conclusion is not `success`. (3) The
      # verdict is the whole nightly job's conclusion, so a failed report upload reads as a mutation
      # failure. (4) The window's headroom is unchanged, about 1.4 h measured over six nights.
      #
      # `GH_TOKEN` is the run's own token; the workflow-wide `actions: read` is what lets it list runs.
      - name: Mutation score
        id: SCN-FIT-002
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh run list --workflow mutation.yml --branch main --status completed --created ">=$(date -u -d '26 hours ago' +%FT%TZ)" --limit 1 --json conclusion --jq '.[0].conclusion')" = success

      # THE DUMP — THE ONLY PLACE `outcome` AND `id` ARE CARRIED TOGETHER (3F-3252).
      #
      # `outcome` IS PRE-`continue-on-error`; `conclusion` IS POST. A step marked
      # `continue-on-error: true` that actually failed reports `conclusion: success`, so a reader
      # taking `conclusion` is green over a masked failure — a one-line watermelon in the watermelon
      # product. The jobs API cannot see through that mask at all: its step object carries
      # `[completed_at, conclusion, name, number, started_at, status]` and no `outcome` and no `id`.
      # This dump is not one source among two. It is the only one.
      #
      # `if: always()` BECAUSE ITS WHOLE VALUE IS THE RED RUN. A dump that only runs on a green
      # build records the one case nobody needed a record of.
      #
      # THE JSON CROSSES THROUGH `env:` RATHER THAN INTO THE COMMAND LINE. A `${{ }}` expansion
      # inside `run:` is substituted into the script before bash sees it, so a step name carrying a
      # quote would end the string and the rest would be shell. As an `env:` value it is data, and
      # `printf '%s'` never re-reads it.
      - name: Dump this run's step record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        #
        # AND IT SAYS HOW BIG THE RECORD IS, BECAUSE `printf` EXITS 0 OVER AN EMPTY VARIABLE. A step
        # that wrote nothing and a step that wrote the run both end `success`, so a green step is
        # not on its own a signal that anything crossed. The byte count and the step count are that
        # signal, and the `jq` length is what would notice an expansion that resolved to `{}`. The
        # gate below now reads this file as the whole fitness axis's credit stream, so an empty one
        # is every configured row broken and an unsound run rather than a quiet nothing.
        run: |
          mkdir -p "$SPEC_CONTROLLER_EVIDENCE_DIR"
          record="$SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json"
          printf '%s' "$STEPS_JSON" > "$record"
          printf 'step record: %s bytes, %s step(s) with an id:\n' \
            "$(wc -c < "$record" | tr -d ' ')" "$(jq 'length' "$record")"

      # STEP 3 — THE SELF-RECONCILIATION GATE (3F-2351). spec-controller's
      # own tree, put through spec-controller: the evidence obligations raised in features/
      # reconciled against the two streams above plus this file and package.json, with the
      # build depending on the verdict.
      #
      # This closes a gap the tool itself is built to name. The reconciler could always
      # report this repository's own one-way evidence claims — a tier named and never
      # observed, an observation citing nothing, a guard running that no scenario names —
      # and no step ever ran it, so that defect class had to be found twice by accident,
      # here. A report nobody is obliged to read is not a check.
      #
      # It EXITS on the verdict rather than printing one (@SCN-CLI-004 / 3F-1414: 0
      # balanced, 1 out-of-balance, 2 usage). Report mode was the pre-agreed first rung and
      # is deliberately not where this stops: a step that exits 0 regardless is the
      # watermelon it exists to detect.
      #
      # It runs AFTER both suites because it consumes their output — a gate over reports
      # that were never emitted reports every obligation unobserved, which means "the suite
      # did not run", not "the code is wrong", so the CLI reds a supplied-but-absent
      # `--vitest` or `--cucumber` as a usage fault (exit 2, @SCN-CLI-002) instead of
      # dressing it as a verdict. That rule is the product's own and is asserted where it
      # lives; nothing here restates it.
      #
      # IT IS NOT ON THE LEDGER IT COMPUTES, AND THE HANDLE IS HOW (3F-3113). This step used
      # to carry a `lint:` prefix, cited by a stepless fitness scenario, so the run
      # that produced the ledger also posted a row asserting that ledger balanced — a second
      # arbiter for a fact that already has one, this step's own exit code. The scenario and
      # its registry entry are retired, and the handle moved OUT of the observed set to match:
      # runningStaticChecks observes a `package.json` script as a running static check only
      # when its name carries an observed prefix (`lint:` / `guard:`) and a CI `run:` step
      # invokes it, and this command invokes no manifest script at all (3F-3476). Given one,
      # spelled `lint:`, this step would cite nothing, post to the suspense row, and red on itself.
      #
      # AND IT IS THE PRODUCT'S OWN BINARY, INVOKED THE WAY AN ADOPTER INVOKES IT (3F-3293).
      # It used to be a wrapper — a repository-local script, 325 lines of TypeScript resolving
      # seven scan surfaces before handing the argv on. No adopter can write that and none should,
      # so the exemplar stopped teaching it: the surfaces are flags on this line, `spec-controller`
      # is the pinned published binary and nothing else, and what this repository dogfoods is the
      # command a consumer types. The wrapper's evidence-report precondition went with it, because
      # the CLI already holds that rule (@SCN-CLI-002) and a second implementation one level up is
      # the shape this repository keeps deleting.
      #
      # THE ONE OPTIONAL EVIDENCE FLAG IS PASSED ONLY WHERE THE FILE EXISTS, AND THAT CONDITIONAL
      # IS THE WHOLE OF WHAT THE WRAPPER DID HERE. A `--ci-steps` path the CLI is handed and cannot
      # find is a usage fault to it and exits 2 — the wrong verdict. Absent, the run reconciles as it
      # did before there was a record (@SCN-LNT-027): a row whose step discovery reads as a check is
      # credited from this file's text, a runner's row reconciles `missing`, and the run is out of
      # balance rather than unsound. `ci-steps.json` is written by the dump step above, so a
      # developer's machine never has one and a local run must not be called broken over it. The
      # `$(...)` is unquoted on purpose — the two tokens have to split.
      #
      # THERE USED TO BE TWO. A `--measurements` expansion beside this one passed the credit stream
      # a row's own command wrote, and the one writer of that file was the mutation row's reader,
      # which left with the placement it read (3F-3504). An expansion over a file nothing writes can
      # never fire, so it went too.
      #
      # ONE LINE, AND NO `package.json` SCRIPT BEHIND IT. Nothing here is discovered from a script
      # name: 3F-3476 deleted the root `spec-controller` script and this command still reconciles.
      # `reconcilerSteps` recognises this step by comparing `spec-controller balance` — the
      # invocation `ingest/ingestQualityChecks.ts` injects — as WHOLE ADJACENT shell tokens against
      # the command, following manifest scripts where a step invokes one and matching the command
      # directly where it does not. Adjacency is what keeps `Corpus tags` above on the books: the
      # same binary, a different second token, an ordinary reconciled step.
      #
      # THE ONE-LINE PART USED TO BE ENFORCED AND IS NOW A CONVENTION WITH ONE REMAINING STAKE.
      # A derived local green-check reported a multi-line `run:` as `unsupported` and redded
      # outright; it left at 3F-3475, and the engine's own walk reads a multi-line block scalar on
      # purpose. What still depends on this being one line is `.github/actionlint.yaml`, whose
      # SC2046 suppression is pinned to one character column of this very command — move it and
      # that pattern stops matching and the gate REDS, which is the intended behaviour and is
      # written up there. Whether to take shellcheck's idiomatic array instead was asked and
      # answered NO on 2026-09-17 — the suppression's word-splitting reason stands alone, so
      # nothing is owed and no ticket is open. The reasoning is in `.github/actionlint.yaml`.
      - name: Self-reconciliation balance
        run: pnpm spec-controller balance --features features --vitest "$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json" --cucumber "$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json" $([ -f "$SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json" ] && echo "--ci-steps $SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json") --ci .github/workflows/ci.yml --package-json package.json --target spec-controller
