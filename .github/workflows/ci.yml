name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Resolve the evidence root
        run: echo "SPEC_CONTROLLER_EVIDENCE_DIR=$RUNNER_TEMP/spec-controller-evidence" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        id: SCN-FIT-012
        run: timeout 75 pnpm test --reporter=default --reporter=json --outputFile.json="$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json" --coverage.enabled

      - name: Cucumber
        id: SCN-FIT-013
        if: ${{ !cancelled() && steps.SCN-FIT-012.outcome != 'skipped' }}
        run: timeout 150 pnpm cucumber --format json:"$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json"

      - name: Complexity — eslint's cognitive-complexity and max-lines-per-function
        id: SCN-FIT-001
        if: always()
        shell: bash
        run: |
          pnpm exec eslint
          git diff -z --name-only --diff-filter=d "$(git merge-base origin/main HEAD)" | xargs -0 -r pnpm exec eslint --max-warnings 0 --no-warn-ignored

      - name: CRAP — complex code must be tested
        id: SCN-FIT-022
        if: ${{ !cancelled() && steps.SCN-FIT-012.outcome != 'skipped' }}
        shell: bash
        run: |
          pnpm exec crap-typescript --format text --threshold 29.999999999999996 packages || [ $? -eq 2 ]
          git diff -z --name-only --diff-filter=d "$(git merge-base origin/main HEAD)" -- 'packages/*/src/*' | xargs -0 -r pnpm exec crap-typescript --format text --threshold 29.999999999999996

      - name: Import boundaries
        id: SCN-FIT-009
        if: always()
        run: pnpm lint:boundaries

      - name: Evidence layers cross a seam
        id: SCN-FIT-027
        if: always()
        run: pnpm lint:seam

      - name: No step on a scenario Cucumber does not run
        id: SCN-FIT-028
        if: always()
        shell: bash
        run: |
          pnpm exec cucumber-js --profile outside --dry-run --format message | jq -rn '[inputs] | (map(.testCase.pickleId // empty)) as $run | .[] | .pickle // empty | select((.steps | length) > 0 and (.id | IN($run[]))) | "\(.uri): \(.name) carries \(.steps | length) step(s)"' | awk '{ print } END { exit NR > 0 }'

      - name: No unused step definition
        id: SCN-FIT-029
        if: always()
        shell: bash
        run: |
          pnpm exec cucumber-js --dry-run --format usage-json | jq -r '.[] | select((.matches | length) == 0) | "\(.uri):\(.line): \(.pattern) matches no step Cucumber runs"' | awk '{ print } END { exit NR > 0 }'

      - name: Typecheck
        id: SCN-FIT-011
        if: always()
        run: pnpm typecheck

      - name: Published packages
        id: SCN-FIT-018
        if: always()
        run: pnpm lint:publint

      - name: Published types
        id: SCN-FIT-019
        if: always()
        run: pnpm lint:published-types

      - name: Workflow correctness
        id: SCN-FIT-020
        if: always()
        uses: docker://rhysd/actionlint:1.7.12

      - name: Workflow security
        id: SCN-FIT-021
        if: always()
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          inputs: .github/workflows/
          advanced-security: false
          online-audits: false

      - name: Mutation score
        id: SCN-FIT-002
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh run list --workflow mutation.yml --branch main --status completed --created ">=$(date -u -d '26 hours ago' +%FT%TZ)" --limit 1 --json conclusion --jq '.[0].conclusion')" = success

      - name: Comment share — no file over 15% comment lines
        id: SCN-FIT-023
        if: always()
        shell: bash
        # Alternative: cloc counts each file's comment and code lines but applies no ceiling, so this awk is the ceiling.
        run: |
          pnpm exec cloc --vcs=git --fullpath --not-match-d='(^|/)tests/fixtures(/|$)' --not-match-f='(^|/)pnpm-lock\.yaml$' --exclude-lang=Markdown --skip-uniqueness --strip-str-comments --by-file --csv --quiet | awk -F, 'NR > 1 && $1 != "SUM" && $4 + $5 > 0 && $4 / ($4 + $5) > 0.15 { printf "%s: %d of %d non-blank lines are comment\n", $2, $4, $4 + $5; over = 1 } END { exit over }'

      - name: No ticket ID in a comment, description or document
        id: SCN-FIT-024
        if: always()
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: "3.23.0"
          filter: '.Name == "Identifiers.TicketId"'
          glob: "!{**/node_modules/**,**/dist/**,.stryker-tmp/**,coverage/**,reports/**,build/**}"
          filter_mode: nofilter
          fail_on_error: true
          reporter: github-annotations

      - name: No scenario code in a comment, description or document
        id: SCN-FIT-025
        if: always()
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: "3.23.0"
          filter: '.Name == "Identifiers.ScenarioCode"'
          glob: "!{**/node_modules/**,**/dist/**,.stryker-tmp/**,coverage/**,reports/**,build/**}"
          filter_mode: nofilter
          fail_on_error: true
          reporter: github-annotations

      - name: No narrated history in a comment, description or document
        id: SCN-FIT-026
        if: always()
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: "3.23.0"
          filter: '.Name == "History.Narrated"'
          glob: "!{**/node_modules/**,**/dist/**,.stryker-tmp/**,coverage/**,reports/**,build/**}"
          filter_mode: nofilter
          fail_on_error: true
          reporter: github-annotations

      - name: Dump this run's step record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$SPEC_CONTROLLER_EVIDENCE_DIR"
          record="$SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json"
          printf '%s' "$STEPS_JSON" > "$record"
          printf 'step record: %s bytes, %s step(s) with an id:\n' \
            "$(wc -c < "$record" | tr -d ' ')" "$(jq 'length' "$record")"

      - name: Self-reconciliation balance
        run: pnpm spec-controller balance --features features --vitest "$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json" --cucumber "$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json" $([ -f "$SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json" ] && echo "--ci-steps $SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json") --ci .github/workflows/ci.yml --package-json package.json --target spec-controller
