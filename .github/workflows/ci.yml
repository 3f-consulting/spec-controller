name: CI

on:
  push:
    branches: [main]
  pull_request:

# THE LADDER READS ONE THING IT DOES NOT OWN (3F-2765): the measurement a scheduled
# mutation sweep persisted, fetched off that workflow's own runs. `actions: read` is what
# lets it, and the block is written out rather than left to the repository default so that
# a default tightened elsewhere reds here, naming the permission, instead of reporting a
# schedule that had lapsed.
permissions:
  contents: read
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scenario sub-issue guard can diff HEAD against
          # the PR base ref (github.event.pull_request.base.sha). The default
          # shallow checkout would not contain the base commit.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BUILT SO THE PUBLISHED SURFACE IS COMPILED ON A PULL REQUEST AT ALL (3F-2765). Nothing else
      # in this ladder reads the built form, so before this step existed a `tsc -p` failure in
      # either package's build config reached main and was found by whoever next ran `pnpm build`.
      # That is now the whole of this step's reason: it originally also existed because
      # `.github/actions/restore-measurements` reached the restore by its bin name and pnpm's
      # `node_modules/.bin` entry points into the package's `dist/`, and since 3F-2810 no action
      # reaches a bin at all — each runs the bundle committed beside it, which nothing here builds.
      # `build` carries no observed prefix and is not among the static checks package.json names,
      # so it joins the local ladder (which is derived from this file) without joining the ledger
      # — it is a step the checks need, not a check.
      - name: Build
        run: pnpm build

      # LINKED AFTERWARDS, BECAUSE pnpm LINKS BINS BEFORE ANYTHING IS BUILT. On a fresh checkout
      # `packages/spec-controller/dist` does not exist yet, so the install above cannot create the
      # `.bin` entries that point into it and says so rather than failing:
      #
      #   [WARN] Failed to create bin at .../node_modules/.bin/restore-measurements.
      #   ENOENT: no such file or directory, open '.../dist/measurements/restoreCli.js'
      #
      # The build then writes the file the entry would have pointed at, and nothing goes back to
      # make the entry — a second `pnpm install` reports "Already up to date" and relinks nothing,
      # with or without `--force` (measured, both). `pnpm rebuild` is the command that does.
      #
      # WHAT THIS STEP GUARDED IS GONE, AND THE STEP IS NOT (3F-2810). It existed because an action
      # here reached a bin with no local entry and fell through to the registry, where no such
      # package exists; since 3F-2810 every action runs the bundle committed beside it and nothing
      # in this workflow reaches a bin at all. It is kept because removing a CI step is a decision
      # about the pipeline rather than about this slice, and it is written down here rather than
      # left to be rediscovered: a step whose reason has been removed is licence for the next one.
      # Filed for the slice to rule on.
      - name: Link the bins the build just produced
        run: pnpm rebuild

      # The feature-code lint over the REAL feature set — a pure function of the
      # checked-out tree. Asserts every @<FFF> header code is unique and registered.
      - name: Lint feature codes
        run: pnpm lint:feature-codes

      # The no-committed-reports guard over the REAL tree — a pure function of the
      # checked-out repo: fails if any report artefact is TRACKED under runs/ (the
      # in-repo leak vector). Reconciliation reports are more sensitive than the code,
      # so they live OUTSIDE the repo, never committed. CITED by the stepless
      # fitness scenario @SCN-NCR-002 (@no-committed-reports) so the tool's own ledger
      # reconciles it.
      - name: Lint no committed reports
        run: pnpm lint:no-committed-reports

      # The tier-tag floor over spec-controller's OWN scenarios (the cobbler's
      # shoes) — a pure property of the committed source: every scenario under
      # features/ carrying an @SCN must name an evidence tier
      # (@unit/@integration/@e2e/@performance, a <tier>pending variant, bare @lint,
      # or — on a stepless scenario — a registered bare check tag) unless it is @wip.
      # Fails naming each tier-less offender. A full gate on every push (no GitHub
      # API). CITED by @SCN-STG-006 (@scn-tags) so the tool's own ledger reconciles it.
      - name: Lint scn-tags
        run: pnpm lint:scn-tags

      # The complexity + module-size thresholds over the REAL tree (@SCN-CPX-001/002, 3F-2286
      # superseding 3F-2177) — eslint's complexity / max-lines / max-lines-per-function held to
      # an EXTERNAL standard: 10 (NIST/McCabe), 40 (Google), 400 (a reasoned chosen ceiling),
      # in static-checks/complexityThresholds.mjs. Never seeded at what this tree measures —
      # that was 3F-2177's rule, and it certified whatever the code already did. Today's
      # exceedances are dated per-file debt in static-checks/complexityExceptions.mjs, each
      # entry FREEZING its file at the recorded value: an exemption excuses existing debt and
      # buys no headroom. Blocking on every push: cheap and deterministic, so it earns a
      # per-push slot. A red means refactor, or record a dated exception at the measured value
      # — never disable the step, and never add slack in advance. CITED by @SCN-CPX-005
      # (@complexity) so the tool's own ledger reconciles it rather than reporting it as an
      # uncited static check.
      - name: Lint complexity
        run: pnpm lint:complexity

      # THE RATCHET (@SCN-CPX-003, 3F-2318) — reconciles static-checks/complexityExceptions.mjs
      # against the tree it describes. The step above freezes each exempt file at its recorded
      # value, which stops the debt growing; it cannot notice the list going stale downward,
      # because eslint only reds on value > max. So this step measures the tree with eslint at
      # the BARE standard (no exception blocks) and reds when the list no longer states what
      # that measurement found: ABOVE the recorded value is a regression, BELOW it is an
      # improvement nobody banked (the half that makes the list a ratchet rather than a ceiling
      # that quietly stops descending), and no longer over the standard at all is a stale entry
      # to delete. Each red names the file, the rule, the recorded value and the measured value.
      # The `lint:` prefix is required, not cosmetic: runningStaticChecks observes a CI script
      # only when its name carries an observed prefix, so a name outside that set would run here
      # while being invisible to spec-controller's own ledger — a real quality check kept off the
      # books. CITED by @SCN-CPX-006 (@complexity-exceptions) so the tool's own ledger
      # reconciles it rather than reporting it as an uncited static check.
      - name: Lint complexity exceptions
        run: pnpm lint:complexity-exceptions

      # The vendored canon table's TRIAGE RECORD (@SCN-VOC-011, 3F-2331) — reds when a row of
      # static-checks/blockedVocabulary.md does not say what this repository decided about it.
      # @SCN-VOC-010 made the enforced word set a DERIVATION of that table and gave each row an
      # adoption status, which is what lets this repository ship green against a canon table
      # whose unadopted rows carry 2,272 occurrences — and is also the obvious way to smuggle a
      # row past everybody: leave the status cell out and the row enforces nothing, in silence.
      # So every row must carry exactly one of adopted / deferred / not-applicable, and a
      # deferred row must name the ticket that pays it and the date it was taken: a deferral
      # without a ticket is an intention, not a decision. Each red names WHICH row and WHAT is
      # missing from it, never "the table is invalid". The `lint:` prefix is required, not
      # cosmetic: runningStaticChecks observes a CI script only when its name carries an observed
      # prefix, so a name outside that set would run here while being invisible to
      # spec-controller's own ledger. CITED by @SCN-VOC-019 (@blocked-vocabulary) so the
      # tool's own ledger reconciles it rather than reporting it as an uncited static check.
      - name: Lint blocked vocabulary
        run: pnpm lint:blocked-vocabulary

      - name: Type-check
        run: pnpm typecheck

      # THE TREE-ENFORCEMENT HALF OF THE VOCABULARY ARC (@SCN-VOC-014, 3F-2343). The third
      # vocabulary check, and the one with teeth over the TREE. `audit:vocab` reports and
      # exits 0 however much it finds — its one non-zero exit is reserved for "I could not
      # scan" (@SCN-VOC-009) and must not be shared with a finding. `lint:blocked-vocabulary`
      # above judges the vendored TABLE's triage. Neither says the tree obeys that triage, so
      # until this step existed an adopted retired word could silently regrow — and one
      # nearly did, caught by a hand-run manifest diff rather than by CI.
      #
      # It reds ONLY on rows the table marks `adopted`. A `deferred` row is dated, ticketed
      # debt carrying 2,272 occurrences in this tree (@SCN-VOC-015 pins that green out loud);
      # enforcing those would red main permanently on work the operator has chosen not to pay
      # yet. The code-side rejected aliases are 3F-2369's, which canon-sources them first.
      #
      # CITED by @SCN-VOC-020 (@adopted-vocabulary) so the tool's own
      # ledger reconciles this step rather than reporting it as an uncited static check. The
      # `lint:` prefix is required, not cosmetic: runningStaticChecks observes a CI script
      # only when its name carries an observed prefix.
      - name: Lint adopted vocabulary
        run: pnpm lint:adopted-vocabulary

      # THE DATA FLOOR (@SCN-VOC-016 / @SCN-VOC-017, 3F-2378). An exemption makes a file
      # wholly invisible to the vocabulary audit; that is honest for a PURE-DATA file, where
      # every banned word is a MENTION, and dishonest for a MIXED file, where the same
      # exemption hides a USE behind a mention. That is what hid 3F-2300 — a renamed handle
      # survived as an identifier in files nobody could see into.
      #
      # So every entry states its KIND. `pure-data` is permanent; `residual` is temporary
      # debt that must NAME THE TICKET that removes it, the same shape a deferred canon row
      # has. A code file claiming pure-data reds. So does an entry covering no banned word at
      # all — an exemption covering nothing reds nothing by construction, so without the
      # stale check it sits on as licence for the next file that matches the path.
      #
      # CITED by @SCN-VOC-021 (@exempt-data-floor) so the tool's own
      # ledger reconciles this step rather than reporting it as an uncited static check.
      - name: Lint exempt data floor
        run: pnpm lint:exempt-data-floor

      # THE ANEMIC-DOMAIN CHECK (@SCN-ANM-001, 3F-2417) — the counterpart to 3F-2416's
      # module-size scope exclusion. That slice removed the one force actively PUSHING a rich
      # aggregate's behaviour out of its concept module (under the ceiling, hiving the
      # operations into a second module was the cheapest route to green); this reds the module
      # that would receive them. A concept owns its own behaviour — canon,
      # technical-design/functional-domain-modelling.md, and the fitness-functions.md ruling of
      # 2026-08-05, which asks for exactly this much mechanism.
      #
      # The scope is a DOMAIN DIRECTORY, not the word: a renderService under render/ is
      # ordinary and legitimate. And what a green here does NOT establish is written down —
      # it reds a NAME, so behaviour can still drain into a module called anything at all.
      # It fences the obvious case and no more.
      #
      # CITED by @SCN-ANM-002 (@anemic-domain) so the tool's own ledger
      # reconciles this step rather than reporting it as an uncited static check. The `lint:`
      # prefix is required, not cosmetic: runningStaticChecks observes a CI script only when
      # its name carries an observed prefix, so a name outside that set would run here while
      # being invisible to spec-controller's own ledger.
      - name: Lint anemic domain
        run: pnpm lint:anemic-domain

      # THE ACTION BUNDLES (@SCN-ACT-004, 3F-2810) — this repository's own composite actions held
      # against the rule that a step runs a file which TRAVELS with it. The three under
      # `.github/actions/` were each written to be imported by another repository and each reached
      # its CLI as `npx --no -- spec-controller-<name>`, which resolves a bin out of the CALLER's
      # node_modules, from a `dist/` that is build output and is not committed. A cross-repo `uses:`
      # checks the action out into a workspace that has neither. All three were well-formed. None of
      # them ran, and no check in this ladder could see it, because nothing here read an action.
      #
      # TWO RULES IN ONE STEP, BECAUSE THEY ARE ONE CLAIM: the step reaches only inside
      # ${{ github.action_path }}, and each committed bundle is what building its source produces.
      # Split apart, a tree could sit half-green — a step correctly reaching for a bundle that had
      # rotted six weeks ago.
      #
      # THE SECOND RULE IS WHY THE `dist/` CARVE-OUT IS SAFE. A committed build output is the one
      # sanctioned exception to this repository's no-committed-build-output discipline, and every JS
      # action in the world that ships one can rot the same way. The exception is mechanised here
      # rather than honoured: the red says `pnpm build:action-bundles`, because a byte diff of a
      # 280 kb bundle is not a message.
      #
      # AND IT IS NOT THE ONLY WITNESS, because it structurally cannot see the route that broke.
      # Everything it does reads FILES. Nothing here exercises a real `uses:`, which is precisely
      # where the defect lived, and that is the no-install consumer job's job.
      #
      # The `lint:` prefix is required, not cosmetic: runningStaticChecks observes a CI script only
      # when its name carries an observed prefix, so a name outside that set would run here while
      # being invisible to spec-controller's own ledger. CITED by @SCN-ACT-004 (@action-bundles) so
      # the tool's own ledger reconciles it rather than reporting it as an uncited static check.
      - name: Lint action bundles
        run: pnpm lint:action-bundles

      # STEP 1 OF THE SELF-RECONCILIATION CHAIN — the observed @unit stream. The run is
      # unchanged; it now also writes the machine-readable report the gate below reads.
      # runs/ is gitignored with no re-includes and lint:no-committed-reports enforces it,
      # so the artefact exists for the length of the job and is never committed: a
      # reconciliation report enumerates this codebase's gaps and is more sensitive than
      # the code. The default reporter is kept alongside so a failure is still readable in
      # the log rather than only in JSON.
      - name: Test
        run: pnpm test --reporter=default --reporter=json --outputFile.json=runs/self-balance/vitest.json

      # STEP 2 — the observed @integration / @e2e stream. `--format json:<path>` adds a
      # file formatter; the progress formatter stays on stdout.
      - name: Cucumber
        run: pnpm cucumber --format json:runs/self-balance/cucumber.json

      # STEP 3 — THE SELF-RECONCILIATION GATE (@SCN-SLF-001, 3F-2351). spec-controller's
      # own tree, put through spec-controller: the evidence obligations raised in features/
      # reconciled against the two streams above plus this file and package.json, with the
      # build depending on the verdict.
      #
      # This closes a gap the tool itself is built to name. The reconciler could always
      # report this repository's own one-way evidence claims — a tier named and never
      # observed, an observation citing nothing, a guard running that no scenario names —
      # and no step ever ran it, so that defect class had to be found twice by accident,
      # here. A report nobody is obliged to read is not a check.
      #
      # It EXITS on the verdict rather than printing one (@SCN-CLI-004 / 3F-1414: 0
      # balanced, 1 out-of-balance, 2 usage). Report mode was the pre-agreed first rung and
      # is deliberately not where this stops: a step that exits 0 regardless is the
      # watermelon it exists to detect.
      #
      # It runs AFTER both suites because it consumes their output — a gate over reports
      # that were never emitted reports every obligation unobserved, which means "the suite
      # did not run", not "the code is wrong", so the script reds that as a usage fault
      # (exit 2) instead of dressing it as a verdict.
      #
      # CITED by @SCN-SLF-003 (@self-balance) so the tool's own ledger
      # reconciles this step rather than reporting it as an uncited static check — which it
      # would otherwise be, on its own books, on its own introduction. The `lint:` prefix is
      # required, not cosmetic: runningStaticChecks observes a CI script only when its name
      # carries an observed prefix, so a name outside that set would run here while being
      # invisible to spec-controller's own ledger.
      # STEP 2b — THE MEASUREMENT THIS PUSH DID NOT TAKE (@SCN-MUT-011, 3F-2765). A mutation
      # sweep costs 8-12 minutes against this ladder's ~2 minutes, so it runs nightly and its
      # score is last night's. Refusing to read it would leave SCN-MUT-011 reconciling `missing`
      # on every push — a build redding over a cadence rather than over the code — and reading it
      # unconditionally would settle this tree's bar with a number measured about a different
      # tree. So it is posted only while it is still young enough to be about this code: 36 hours
      # against a 03:17 UTC nightly leaves ~12 hours of slack in a healthy cadence, and ONE
      # missed sweep ages the number out, posts nothing, and reds the gate below. A sweep that
      # quietly stops running cannot stay quiet.
      #
      # The window is an input here and not a manifest field, and that is the split: a manifest
      # is about BARS, which are facts about the code, and a window is a fact about the pipeline
      # reading them. Nothing in the action or the CLI it calls names mutation, Stryker or this
      # repository — this step is the caller, and the caller is the only place those words
      # belong.
      - name: Restore the scheduled measurements
        uses: ./.github/actions/restore-measurements
        with:
          artefact-name: mutation-measurement
          workflow: mutation.yml
          # 36 hours, in seconds.
          max-age: 129600

      - name: Self-reconciliation balance
        run: pnpm lint:self-balance

      # The hermetic scenario ⟷ sub-issue gate (ported from an earlier internal tool / an adopter's repository
      # 3F-834), wired over spec-controller's REAL source on every PR. Every
      # behaviour-bearing @SCN change must carry its @SCN cite AND be on a ticketed
      # PR (the Linear-auto-named branch / [3F-NNN] commit prefix) — verified from
      # the diff + CI metadata ALONE, with NO live Linear call. Wiring it here (not
      # only over synthetic fixtures) is what makes the guard see real-source drift.
      # PR-only: it needs the PR diff + base context; on push-to-main there is no PR
      # base, so it is skipped (parent 3F-1137; @SCN-SSM-001, 3F-1489).
      - name: Lint scenario sub-issue match
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The PR's source branch — Linear auto-names it "steven/3f-NNN-…", the
          # primary ticket-handle source.
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # The PR body is one of the two SCN-exempt trailer sources (the other is
          # the PR's commit messages); the parser scans both.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm lint:scn-subissues

  # THE ONE WITNESS THAT WATCHES AN ACTION ACTUALLY RUN (3F-2810).
  #
  # `lint:action-bundles`, above, reads FILES: each action's YAML, and the bundle committed beside
  # it. That is the right shape for a static check and it is structurally blind to the thing that
  # broke. The three actions were WELL-FORMED when they could not run — they parsed, they named
  # their inputs, they had a step — and a check reading them would have said so. What was wrong was
  # only visible at the moment a caller invoked one: `npx --no` resolved a bin out of a workspace
  # the caller did not have. A construction-level check that has never seen the thing run is the
  # arrangement that shipped the defect, so it is not the only evidence here.
  #
  # WHAT MAKES THIS JOB A WITNESS IS WHAT IT DOES NOT DO. There is no `pnpm install` and no
  # `pnpm build`, and that absence is the whole experiment: this is the workspace a cross-repository
  # `uses:` actually lands in — the CALLER's tree, with nothing of this package in it. Adding either
  # step would make the job green for the wrong reason and it would stay green through a
  # regression, which is worse than not having it. If a future edit needs one of them to pass, that
  # edit has reintroduced the defect.
  #
  # IT IS OFF THE LEDGER, AND THAT IS ACCURATE RATHER THAN UNFORTUNATE. `runningStaticChecks`
  # observes a package.json script a CI `run:` step invokes; every step below is a `uses:`, so
  # there is no script to observe and no Evidence Obligation for it to settle. It raises no row on
  # spec-controller's own reconciliation and adds no rung to the derived local ladder — a runtime
  # witness is not a static check, and the two are not the same evidence. @SCN-ACT-004 carries the
  # ledger half.
  #
  # NOTHING HERE IS ALLOWED TO FAIL QUIETLY. There is no `continue-on-error` on any step: a step
  # permitted to go red without redding the job is exactly the shape this whole slice removed.
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runtime the bundles are built for, pinned rather than inherited, so this job tests the
      # target rather than whatever the image happens to ship. Deliberately NOT followed by an
      # install: `setup-node` alone brings no dependency into the tree.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # NOTHING TO PERSIST IS THIS ACTION'S ORDINARY QUIET PATH, and here it is the assertion. The
      # workspace holds no `runs/self-balance/measurements.json` — no check has run — so the step
      # reports a run with nothing worth handing on and exits 0, and the upload collects nothing
      # under `if-no-files-found: ignore`. Reaching that sentence at all is the proof: it is printed
      # by the bundle, which means the bundle resolved, loaded and ran with nothing installed.
      #
      # It also leaves no artefact, which is what keeps the restore below deterministic.
      - name: Persist, from a workspace with nothing installed
        uses: ./.github/actions/persist-measurements
        with:
          artefact-name: action-consumer-probe

      # AND NOTHING TO RESTORE IS THE MIRROR OF IT. No run of this workflow has ever uploaded an
      # `action-consumer-probe` — the step above is the only thing that would, and it uploads
      # nothing — so the fetch finds no artefact, reports a lapsed cadence and exits 0. The window
      # is a minute because its value is irrelevant here: what is under test is that the step RAN,
      # not what it decided.
      - name: Restore, from a workspace with nothing installed
        uses: ./.github/actions/restore-measurements
        with:
          artefact-name: action-consumer-probe
          workflow: ci.yml
          max-age: "60"

      # THE RATCHET HAS NO QUIET PATH, SO IT IS GIVEN A RECORD. It exists to reach a verdict and
      # red the run on it, and every verdict reachable with no record in front of it is a red — so
      # unlike the two above, it cannot witness itself on an empty tree. The fixture beside this
      # repository's tests states a gate whose banked counts are exactly what the report beside it
      # measures, which reconciles ON THE RECORD and exits 0. The prop is the INPUT; the action is
      # what is under test.
      - name: Reconcile a gate, from a workspace with nothing installed
        uses: ./.github/actions/mutation-ratchet
        with:
          gate: probe
          report: tests/fixtures/action-consumer/mutation-report.json
          record-file: tests/fixtures/action-consumer/quality-thresholds.yml
