name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # Minutes: a ceiling against a hung job only, so a slow run still finishes.
    timeout-minutes: 20
    env:
      # Seconds: a one-minute CI ceiling for a unit suite, times its 1.25 variance margin.
      UNIT_SUITE_TIMEOUT_S: "75"
      # Seconds: a two-minute CI ceiling for the integration and end-to-end suite, times its 1.25 variance margin.
      CUCUMBER_SUITE_TIMEOUT_S: "150"
      # A function scoring CRAP 30 or more reds; crap-typescript reds only on a score strictly above its threshold, so the bar is 30 less one float step.
      CRAP_THRESHOLD: "29.999999999999996"
      # A file reds when its comment lines exceed this share of its non-blank lines: a fixed 15% ceiling, with no ratchet.
      COMMENT_SHARE_MAX: "0.15"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Resolve the evidence root
        run: |
          echo "SPEC_CONTROLLER_EVIDENCE_DIR=$RUNNER_TEMP/spec-controller-evidence" >> "$GITHUB_ENV"

      # The docs: package scripts run Vale. Its version and checksum move together; the checksum is the Linux_64-bit line of the release's vale_<version>_checksums.txt.
      - name: Install dependencies
        shell: bash
        env:
          VALE_VERSION: "3.23.0"
          VALE_SHA256: cc35445a45186b8f0b01e11c01359694cf941e72cf6ab0fc44774f0e54c9d5fc
        run: |
          pnpm install --frozen-lockfile
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/vale.tar.gz" "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      # A venv runs only on the interpreter that built it, so the Python version is part of the cache key.
      - name: Read the Python Semgrep runs on
        if: always()
        run: echo "SEMGREP_PYTHON=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_ENV"

      # A cache a pull request writes is scoped to that pull request, so only main's own runs fill the cache main restores.
      - name: Restore Semgrep
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/semgrep
          key: semgrep-${{ runner.os }}-python-${{ env.SEMGREP_PYTHON }}-${{ hashFiles('.semgrep/requirements.txt') }}

      # From a hash-checked lock, never an image: a registry pull can fail the job before any check runs.
      # A venv records its absolute path, so it is built and restored at the same fixed one.
      - name: Install Semgrep
        if: always()
        run: |
          if [ ! -x "$RUNNER_TEMP/semgrep/bin/semgrep" ]; then
            python3 -m venv "$RUNNER_TEMP/semgrep"
            "$RUNNER_TEMP/semgrep/bin/pip" install --quiet --require-hashes --no-deps -r .semgrep/requirements.txt
          fi
          "$RUNNER_TEMP/semgrep/bin/semgrep" --version
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      # Only content-keyed caches: each tool relints or rechecks a file whose content or config changed, so a warm entry never passes a file a cold run fails.
      # The lockfile is in the key because no tool's cache notices a plugin's own code changing. A key is written once, so each run saves its own and restores the newest.
      - name: Restore the tools' own caches
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tool-cache
          key: tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Test
        id: CLM-FIT-012
        # One worker per core: vitest's default leaves one core idle, which on a 2-core runner is half of it.
        # One module graph per worker, not one per file: re-importing it for every file was most of the step's time. Local runs and Stryker still isolate.
        # The suite's time is printed against its limit on every run, a killed run included, so headroom is read before it runs out.
        run: |
          start=$SECONDS
          status=0
          timeout "${UNIT_SUITE_TIMEOUT_S:?}" pnpm test --maxWorkers="$(nproc)" --no-isolate --reporter=default --reporter=json --outputFile.json="$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json" --coverage.enabled || status=$?
          echo "the unit suite took $((SECONDS - start)) s of its $UNIT_SUITE_TIMEOUT_S s limit"
          exit "$status"

      - name: Cucumber
        id: CLM-FIT-013
        if: ${{ !cancelled() && steps.CLM-FIT-012.outcome != 'skipped' }}
        # `pnpm cucumber` builds the packages first, the run's one build; the steps after it that pack or hand on dist use it.
        run: |
          start=$SECONDS
          status=0
          timeout "${CUCUMBER_SUITE_TIMEOUT_S:?}" pnpm cucumber --format json:"$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json" || status=$?
          echo "the behavioural suite took $((SECONDS - start)) s of its $CUCUMBER_SUITE_TIMEOUT_S s limit"
          exit "$status"

      - name: ESLint — every rule of eslint.config.js over the tree, and its warnings in the files the push touches
        id: CLM-FIT-073
        if: always()
        shell: bash
        # The loop reds, naming the population, when the configuration enforces no rule (none, or all off) on one file of each population the tree line lints; ESLint lints the tree green with none.
        # The tree line runs without --quiet: --quiet skips warn rules, and with them the dead-suppression reports for those rules and for a blanket directive.
        # So it reds on an error anywhere, a dead suppression included, and prints every warning, which exits 0, before an error ends the step.
        # The last line reds on a warning in a touched file. Both ESLint lines run every rule, so what either caches serves the other: one cache.
        run: |
          for sample in "core's source:packages/core/src/index.ts" "the app's source:packages/spec-controller/src/cli.ts" "the step files:tests/steps/runVerdict.steps.ts" "the scripts:scripts/docs-check.mjs"; do
            [ "$(node_modules/.bin/eslint --print-config "${sample#*:}" | jq '[.rules // {} | .[] | select(.[0] > 0)] | length')" -gt 0 ] || { echo "ESLint enforces no rule on ${sample%%:*} (${sample#*:})"; exit 1; }
          done
          node_modules/.bin/eslint --cache --cache-strategy content --cache-location "$RUNNER_TEMP/tool-cache/eslint/" .
          git diff -z --name-only --diff-filter=d "$(git merge-base origin/main HEAD)" | xargs -0 -r node_modules/.bin/eslint --max-warnings 0 --no-warn-ignored --cache --cache-strategy content --cache-location "$RUNNER_TEMP/tool-cache/eslint/"

      - name: CRAP — complex code must be tested
        id: CLM-FIT-022
        if: ${{ !cancelled() && steps.CLM-FIT-012.outcome != 'skipped' }}
        shell: bash
        run: |
          jq -e 'type == "object" and length > 0' coverage/coverage-final.json > /dev/null || { echo "CRAP refuses to run: coverage/coverage-final.json is not a readable coverage report, so no function can be scored."; exit 1; }
          node_modules/.bin/crap-typescript --format text --threshold "${CRAP_THRESHOLD:?}" packages || [ $? -eq 2 ]
          git diff -z --name-only --diff-filter=d "$(git merge-base origin/main HEAD)" -- 'packages/*/src/*' | xargs -0 -r node_modules/.bin/crap-typescript --format text --threshold "${CRAP_THRESHOLD:?}"

      - name: Duplication — no clone in production code
        id: CLM-FIT-032
        if: always()
        shell: bash
        # jscpd, pinned in package.json, reads its settings from .jscpd.json, named so that one it cannot parse stops the run rather than falling back to defaults; the file takes no comments, so their reasons are here.
        # It scans both packages' src as TypeScript, with tests, shared test helpers and fixtures ignored: production code only.
        # minTokens 50 and minLines 5 are jscpd's own default definition of a clone, stated in full so a copier inherits it.
        # The step reds on jscpd's own exit code, so a clone anywhere in that population reds it, whichever files the change touches.
        # --fail-on-empty reds an analysis of no file. jscpd does not count five files under the 50-token clone size, so none can hold a clone:
        # core's domain/outcome.ts, model.ts and parse/stepNames.ts, and spec-controller's cli.ts and defaultCorpus.ts.
        run: node_modules/.bin/jscpd --config .jscpd.json --exit-code --fail-on-empty

      - name: Unused code — no unused file, export or dependency outside the test code
        id: CLM-FIT-033
        if: always()
        shell: bash
        # knip, pinned in package.json and configured in knip.jsonc, where each setting carries its reason.
        # Default mode: an export a test imports is used, and exported types count as exports. A configuration hint reds the step, so a pattern or ignore entry matching nothing fails it.
        # The step reds on knip's own exit code, so an unused file, export or dependency reds it whichever files the change touches, outside what knip.jsonc ignores: the test code, three dependencies and one script.
        run: node_modules/.bin/knip --include files,exports,types,dependencies --treat-config-hints-as-errors

      - name: Import boundaries
        id: CLM-FIT-009
        if: always()
        run: node_modules/.bin/depcruise packages --cache "$RUNNER_TEMP/tool-cache/depcruise/boundaries" --cache-strategy content

      - name: Every production source file is in a mutation scope or on the recorded list
        id: CLM-FIT-040
        if: always()
        shell: bash
        run: |
          # A scope's own ! lines are not read: an exclude pathspec applies to the whole listing, never to one scope's matches.
          set -f
          excludes=()
          while IFS= read -r p; do
            if [ -n "$p" ]; then excludes+=(":(exclude,glob)$p"); fi
          done < <(yq -r '(.jobs.mutation.strategy.matrix.include[].mutate | split(",") | .[] | select(test("^!") | not)), .env.UNSCOPED' .github/workflows/mutation.yml)
          git ls-files -- ':(glob)packages/*/src/**/*.ts' ':(exclude,glob)packages/**/*.test.ts' ':(exclude,glob)packages/**/*.test-utils.ts' "${excludes[@]}" \
            | awk '{ print $0 ": in no mutation scope and not on the recorded list of files no scope mutates" } END { exit NR > 0 }'

      - name: Test code stays within the declared ceiling ratio to production code
        id: CLM-FIT-043
        if: always()
        run: node scripts/test-ratio.mjs

      # remark-validate-links checks each relative link and its anchor. The Vale rule refuses a backticked token naming a
      # repository file, so every such reference is a link remark checks.
      # The probe reds the step unless Vale raises on a line naming a repository file: exit 0 means the rule is gone, 2 that Vale failed.
      # Both scripts run whatever the first returns, so one run prints every broken reference.
      # A docs-only push to main skips this step and the Vale steps; pnpm docs:check runs them all before such a push.
      - name: Every reference in a current-state document resolves
        id: CLM-FIT-059
        if: always()
        shell: bash
        run: |
          probe=0
          printf '\x60CONTRIBUTING.md\x60\n' | vale --config=.vale/references.ini --ext=.md > /dev/null || probe=$?
          [ "$probe" -eq 1 ] || { echo "The reference rule did not fire on a line naming a repository file: Vale exited $probe"; exit 1; }
          status=0
          pnpm docs:references || status=1
          pnpm docs:file-links || status=1
          exit "$status"

      - name: No step on a scenario Cucumber does not run
        id: CLM-FIT-028
        if: always()
        shell: bash
        run: |
          node_modules/.bin/cucumber-js --profile outside --dry-run --format message | jq -rn '[inputs] | (map(.testCase.pickleId // empty)) as $run | .[] | .pickle // empty | select((.steps | length) > 0 and (.id | IN($run[]))) | "\(.uri): \(.name) carries \(.steps | length) step(s)"' | awk '{ print } END { exit NR > 0 }'

      - name: No unused step definition
        id: CLM-FIT-029
        if: always()
        shell: bash
        run: |
          node_modules/.bin/cucumber-js --dry-run --format usage-json | jq -r '.[] | select((.matches | length) == 0) | "\(.uri):\(.line): \(.pattern) matches no step Cucumber runs"' | awk '{ print } END { exit NR > 0 }'

      - name: Typecheck
        id: CLM-FIT-011
        if: always()
        run: pnpm typecheck --incremental --tsBuildInfoFile "$RUNNER_TEMP/tool-cache/tsc/typecheck.tsbuildinfo"

      - name: Published packages
        id: CLM-FIT-018
        if: always()
        run: pnpm lint:publint

      - name: Published types
        id: CLM-FIT-019
        if: always()
        run: pnpm lint:published-types

      - name: Workflow correctness
        id: CLM-FIT-020
        if: always()
        shell: bash
        # The version and checksum move together; the checksum is the linux_amd64 line of the
        # release's actionlint_<version>_checksums.txt.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - name: Workflow security
        id: CLM-FIT-021
        if: always()
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          inputs: .github/workflows/
          advanced-security: false
          online-audits: false

      # --verbose names each file Semgrep could not read in full; a one-entry log list folds its list of rule ids.
      - name: Semgrep — every rule under .semgrep/ over the packages
        id: CLM-FIT-074
        if: always()
        run: |
          semgrep scan --config .semgrep/ --error --strict --metrics=off --disable-version-check --verbose --max-log-list-entries 1 --json-output="$RUNNER_TEMP/semgrep.json" packages
          jq -e '.paths.scanned | length > 0' "$RUNNER_TEMP/semgrep.json" > /dev/null || { echo "Semgrep scanned no file under packages"; exit 1; }

      # The printer's other half is the type check: it refuses an error handed to the printer, or an input error entry, that no catalogue holds.
      - name: Semgrep — nothing in the packages writes to standard error but the printer
        id: CLM-FIT-076
        if: always()
        run: |
          semgrep scan --config .semgrep-errors/ --error --strict --metrics=off --disable-version-check --verbose --max-log-list-entries 1 --json-output="$RUNNER_TEMP/semgrep-errors.json" packages
          jq -e '.paths.scanned | length > 0' "$RUNNER_TEMP/semgrep-errors.json" > /dev/null || { echo "Semgrep scanned no file under packages"; exit 1; }

      - name: Comment share — no file cloc counts over its comment-line ceiling
        id: CLM-FIT-023
        if: always()
        shell: bash
        # Alternative: cloc counts each file's comment and code lines but applies no ceiling, so this awk is the ceiling.
        run: |
          node_modules/.bin/cloc --vcs=git --fullpath --not-match-d='(^|/)tests/fixtures(/|$)' --not-match-f='(^|/)pnpm-lock\.yaml$' --exclude-lang=Markdown --skip-uniqueness --strip-str-comments --by-file --csv --quiet | awk -F, -v max="${COMMENT_SHARE_MAX:?}" 'NR > 1 && $1 != "SUM" && $4 + $5 > 0 && $4 / ($4 + $5) > max { printf "%s: %d of %d non-blank lines are comment\n", $2, $4, $4 + $5; over = 1 } END { exit over }'

      # Each probe pipes one line that breaks one rule into Vale and reds the step unless Vale names that rule, so a dead
      # rule fails before the tree is read. The probe's tokens are built at run time, so this file holds none of them.
      # The runner's default bash has no pipefail, so the probe's verdict is grep's, not Vale's exit.
      - name: Vale — no ticket ID, claim code or narrated history in a comment, description or document it reads
        id: CLM-FIT-075
        if: always()
        run: |
          for probe in "Identifiers.TicketId:$(printf '%s-%s' 3F 1234)" "Identifiers.ClaimCode:$(printf '%s-%s-%s' CLM ABC 001)" "History.Narrated:$(printf '%s %s' used to)"; do
            rule=${probe%%:*}
            printf '%s\n' "${probe#*:}" | vale --ext=.md --output=line | grep -q ":$rule:" || { echo "Vale's $rule rule did not fire on a line that breaks it"; exit 1; }
          done
          pnpm docs:current-state

      - name: No title or description names a code identifier or a source file
        id: CLM-FIT-038
        if: always()
        run: pnpm docs:code-identifier

      - name: No Given, When or Then names an interface mechanic
        id: CLM-FIT-030
        if: always()
        run: pnpm docs:interface-mechanic

      - name: A lowercase step line in a scenario is held to the step rules
        id: CLM-FIT-077
        if: always()
        run: pnpm docs:lowercase-step

      - name: The description gates leave a lowercase step line in a scenario alone
        id: CLM-FIT-078
        if: always()
        run: pnpm docs:lowercase-description

      - name: A scenario Cucumber does not run, with lowercase lines, still has no step
        id: CLM-FIT-079
        if: always()
        shell: bash
        run: |
          plant="$RUNNER_TEMP/lowercase-lines/planted.feature"
          mkdir -p "${plant%/*}"
          printf '%s\n' \
            'Feature: a planted feature' \
            '' \
            '  @unit' \
            '  Scenario: lowercase lines only' \
            '    given a planted precondition' \
            '    and a second planted precondition' \
            '    when a planted action happens' \
            '    then a planted outcome holds' \
            '    but a planted outcome does not' \
            '' \
            '  @unit' \
            '  Scenario: a capitalised control' \
            '    Given a planted precondition' > "$plant"
          report=$(node_modules/.bin/cucumber-js --profile outside --dry-run --format message "$plant" | jq -rn '[inputs] | (map(.testCase.pickleId // empty)) as $run | .[] | .pickle // empty | select((.steps | length) > 0 and (.id | IN($run[]))) | "\(.uri): \(.name) carries \(.steps | length) step(s)"' | awk '{ print } END { exit NR > 0 }') || true
          printf '%s\n' "$report"
          grep -qF ': a capitalised control carries 1 step(s)' <<< "$report" || { echo "The step check did not report the planted scenario with a capitalised Given"; exit 1; }
          if grep -qF ': lowercase lines only carries' <<< "$report"; then echo "The step check reported the planted scenario with only lowercase lines"; exit 1; fi

      # The planted code is built at run time, so this file carries no claim code of its own.
      - name: A test citing a code from a domain concept's clm cell is refused outside core's domain
        id: CLM-FIT-080
        if: always()
        shell: bash
        run: |
          code=$(printf '%s-%s-%s' CLM ONE 001)
          feature=features/outcome.feature
          outside=packages/core/src/assemble/plantedCellCitation.test.ts
          inside=packages/core/src/domain/plantedCellCitation.test.ts
          for plant in "$feature" "$outside" "$inside"; do
            [ ! -e "$plant" ] || { echo "$plant already exists, so it cannot be planted"; exit 1; }
          done
          trap 'rm -f "$feature" "$outside" "$inside"' EXIT
          printf '%s\n' \
            '@ONE' \
            'Feature: a planted domain concept' \
            '' \
            '  Scenario Outline: a planted claim in a row' \
            '' \
            '    Examples:' \
            '      | clm | case |' \
            "      | $code | planted |" > "$feature"
          for test in "$outside" "$inside"; do
            printf '%s\n' 'import { it } from "vitest";' '' "it(\"[$code] a planted test\", () => {});" > "$test"
          done
          message="A test citing a domain concept's scenario tests a rule of core's domain."
          # ESLint reports as JSON here: its default lines would become an error annotation on a run that passes.
          for test in "$outside" "$inside"; do
            status=0
            report=$(node_modules/.bin/eslint --format json "$test" | jq -r '.[].messages[] | "\(.line):\(.column) \(.ruleId) \(.message)"') || status=$?
            printf '%s\n' "$report"
            [ "$status" -le 1 ] || { echo "ESLint could not lint $test"; exit 1; }
            if [ "$test" = "$outside" ]; then
              grep -qF "$message" <<< "$report" || { echo "The domain-tests rule did not refuse the planted test outside core's domain"; exit 1; }
            elif grep -qF "$message" <<< "$report"; then
              echo "The domain-tests rule refused the planted test inside core's domain"; exit 1
            fi
          done

      - name: Dump this run's step record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$SPEC_CONTROLLER_EVIDENCE_DIR"
          record="$SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json"
          printf '%s' "$STEPS_JSON" > "$record"
          printf 'step record: %s bytes, %s step(s) with an id:\n' \
            "$(wc -c < "$record" | tr -d ' ')" "$(jq 'length' "$record")"

      - name: Reconciliation
        if: always()
        # $(…) is unquoted, and .github/actionlint.yaml ignores SC2046 for it: it must split into --ci-steps and its path, or add nothing when no step record was written.
        run: pnpm spec-controller balance --features features --vitest "$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json" --cucumber "$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json" $([ -f "$SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json" ] && echo "--ci-steps $SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json") --ci .github/workflows/ci.yml --package-json package.json --target spec-controller

      - name: Hand the built packages to the release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-packages
          path: |
            packages/core/dist
            packages/spec-controller/dist
          if-no-files-found: error
          retention-days: 1
