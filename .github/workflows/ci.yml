name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # Minutes: a five-minute ceiling on the whole job.
    timeout-minutes: 5
    env:
      # Seconds: a one-minute CI ceiling for a unit suite, times its 1.25 variance margin.
      UNIT_SUITE_TIMEOUT_S: "75"
      # Seconds: a two-minute CI ceiling for the integration and end-to-end suite, times its 1.25 variance margin.
      CUCUMBER_SUITE_TIMEOUT_S: "150"
      # A function scoring CRAP 30 or more reds; crap-typescript reds only on a score strictly above its threshold, so the bar is 30 less one float step.
      CRAP_THRESHOLD: "29.999999999999996"
      # A file reds when its comment lines exceed this share of its non-blank lines: a fixed 15% ceiling, with no ratchet.
      COMMENT_SHARE_MAX: "0.15"
      # Hours: the nightly mutation sweep's 24-hour cadence, plus 4 hours for the longest a sweep may run (its 240-minute limit), plus 2 hours for the scheduler's delay, so one missed sweep ages its verdict out and the step records the schedule as lapsed.
      MUTATION_VERDICT_MAX_AGE_H: "30"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Resolve the evidence root
        run: |
          echo "SPEC_CONTROLLER_EVIDENCE_DIR=$RUNNER_TEMP/spec-controller-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/suite-tmp/vitest" "$RUNNER_TEMP/suite-tmp/cucumber" "$RUNNER_TEMP/lint-reports"

      # The docs: package scripts run Vale. Its version and checksum move together; the checksum is the Linux_64-bit line of the release's vale_<version>_checksums.txt.
      - name: Install dependencies
        shell: bash
        env:
          VALE_VERSION: "3.23.0"
          VALE_SHA256: cc35445a45186b8f0b01e11c01359694cf941e72cf6ab0fc44774f0e54c9d5fc
        run: |
          pnpm install --frozen-lockfile
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/vale.tar.gz" "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      - name: Build
        run: pnpm build

      # A venv runs only on the interpreter that built it, so the Python version is part of the cache key.
      - name: Read the Python Semgrep runs on
        if: always()
        run: echo "SEMGREP_PYTHON=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_ENV"

      # A cache a pull request writes is scoped to that pull request, so only main's own runs fill the cache main restores.
      - name: Restore Semgrep
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/semgrep
          key: semgrep-${{ runner.os }}-python-${{ env.SEMGREP_PYTHON }}-${{ hashFiles('.semgrep/requirements.txt') }}

      # From a hash-checked lock, never an image: a registry pull can fail the job before any check runs.
      # A venv records its absolute path, so it is built and restored at the same fixed one.
      - name: Install Semgrep
        if: always()
        run: |
          if [ ! -x "$RUNNER_TEMP/semgrep/bin/semgrep" ]; then
            python3 -m venv "$RUNNER_TEMP/semgrep"
            "$RUNNER_TEMP/semgrep/bin/pip" install --quiet --require-hashes --no-deps -r .semgrep/requirements.txt
          fi
          "$RUNNER_TEMP/semgrep/bin/semgrep" --version
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      # Only content-keyed caches: each tool relints or rechecks a file whose content or config changed, so a warm entry never passes a file a cold run fails.
      # The lockfile is in the key because no tool's cache notices a plugin's own code changing. A key is written once, so each run saves its own and restores the newest.
      - name: Restore the tools' own caches
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tool-cache
          key: tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # A report for review, not a check: it never reds, and package.json declares it a non-check.
      - name: New names this change introduces
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          NEW_NAMES_BASE: origin/${{ github.base_ref }}
        # Also into the log, which `gh run view --log` reads; the job summary has no API.
        run: node scripts/new-names.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test
        id: SCN-FIT-012
        env:
          TMPDIR: ${{ runner.temp }}/suite-tmp/vitest
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        # One worker per core: vitest's default leaves one core idle, which on a 2-core runner is half of it.
        # One module graph per worker, not one per file: re-importing it for every file was most of the step's time. Local runs and Stryker still isolate.
        # The suite's time is printed against its limit on every run, a killed run included, so headroom is read before it runs out.
        run: |
          start=$SECONDS
          status=0
          timeout "${UNIT_SUITE_TIMEOUT_S:?}" pnpm test --maxWorkers="$(nproc)" --no-isolate --reporter=default --reporter=json --outputFile.json="$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json" --coverage.enabled || status=$?
          echo "the unit suite took $((SECONDS - start)) s of its $UNIT_SUITE_TIMEOUT_S s limit"
          exit "$status"

      - name: Cucumber
        id: SCN-FIT-013
        if: ${{ !cancelled() && steps.SCN-FIT-012.outcome != 'skipped' }}
        env:
          TMPDIR: ${{ runner.temp }}/suite-tmp/cucumber
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          TSX_DISABLE_CACHE: "1"
        run: |
          start=$SECONDS
          status=0
          timeout "${CUCUMBER_SUITE_TIMEOUT_S:?}" pnpm cucumber --format json:"$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json" || status=$?
          echo "the behavioural suite took $((SECONDS - start)) s of its $CUCUMBER_SUITE_TIMEOUT_S s limit"
          exit "$status"

      - name: A red proof of a unit scenario runs exactly the tests whose titles carry its code
        id: SCN-FIT-034
        if: ${{ !cancelled() && steps.SCN-FIT-012.outcome != 'skipped' }}
        shell: bash
        # The probe is cited by tests in three files, so a selection that keeps one file's tests, or all of them, reds.
        # The expected set is read from the full Test run's report, never from the proof's own run.
        # The proof has a temporary directory of its own: a file whose tests are all filtered out still runs its top-level setup, but never its cleanup.
        env:
          PROBE: SCN-CFG-004
          RED_PROOF_DIR: ${{ runner.temp }}/red-proof
          TMPDIR: ${{ runner.temp }}/red-proof/tmp
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: |
          mkdir -p "$TMPDIR"
          scripts/red-proof.sh unit "$PROBE"
          expected="$(jq -r --arg bracket "[$PROBE]" '.testResults[] | .name as $file | .assertionResults[] | select(.fullName | contains($bracket)) | "\($file): \(.fullName)"' "$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json" | sort)"
          ran="$(jq -r '.testResults[] | .name as $file | .assertionResults[] | select(.status == "passed") | "\($file): \(.fullName)"' "$RED_PROOF_DIR/vitest.json" | sort)"
          [ -n "$expected" ] || { echo "no test in the full run carries [$PROBE]"; exit 1; }
          if [ "$ran" != "$expected" ]; then
            printf 'the proof passed %s test(s); the full run has %s carrying [%s]\n' "$(grep -c . <<< "$ran")" "$(grep -c . <<< "$expected")" "$PROBE"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$ran") | head -20 || true
            exit 1
          fi
          printf 'the proof passed exactly the %s test(s) carrying [%s]\n' "$(grep -c . <<< "$expected")" "$PROBE"

      - name: A red proof of an integration or e2e scenario runs exactly that scenario
        id: SCN-FIT-035
        if: ${{ !cancelled() && steps.SCN-FIT-012.outcome != 'skipped' }}
        shell: bash
        # One probe per layer. No @integration scenario is an Outline, so the e2e probe is one with three examples, and a selection that keeps one example, or every scenario, reds.
        # A scenario is identified by its file and line, since every example of an Outline shares the Outline's name.
        # The expected set is read from the full Cucumber run's report, never from the proof's own run.
        # The sets are compared before the empty check, so a selection that runs a scenario the full run never ran reds on the comparison.
        env:
          TMPDIR: ${{ runner.temp }}/red-proof/cucumber-tmp
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: |
          mkdir -p "$TMPDIR"
          prove() {
            local layer=$1 probe=$2 dir="$RUNNER_TEMP/red-proof/$2"
            RED_PROOF_DIR="$dir" scripts/red-proof.sh "$layer" "$probe"
            expected="$(jq -r --arg tag "@$probe" '.[] | .uri as $uri | .elements[] | select(any(.tags[]; .name == $tag)) | "\($uri):\(.line): \(.name)"' "$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json" | sort)"
            ran="$(jq -r '.[] | .uri as $uri | .elements[] | select(all(.steps[]; .result.status == "passed")) | "\($uri):\(.line): \(.name)"' "$dir/cucumber.json" | sort)"
            if [ "$ran" != "$expected" ]; then
              printf 'the proof passed %s scenario(s); the full run has %s carrying @%s\n' "$(grep -c . <<< "$ran")" "$(grep -c . <<< "$expected")" "$probe"
              diff <(printf '%s\n' "$expected") <(printf '%s\n' "$ran") | head -20 || true
              exit 1
            fi
            [ -n "$expected" ] || { echo "no scenario in the full run carries @$probe"; exit 1; }
            printf 'the proof passed exactly the %s scenario(s) carrying @%s\n' "$(grep -c . <<< "$expected")" "$probe"
          }
          prove integration SCN-USG-002
          prove e2e SCN-CLI-066

      - name: A red proof that selects no test fails, saying no test was selected
        id: SCN-FIT-036
        if: ${{ !cancelled() && steps.SCN-FIT-012.outcome != 'skipped' }}
        shell: bash
        # The unit probe is a code nothing carries. The integration probe has unit citers but no Cucumber layer, so the profile's tag filter is what leaves it nothing to select.
        # A refusal leaves no run report behind, which is how a refusal made after the run reds.
        env:
          TMPDIR: ${{ runner.temp }}/red-proof/refusal-tmp
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: |
          mkdir -p "$TMPDIR"
          refused() {
            local layer=$1 code=$2 dir="$RUNNER_TEMP/red-proof/refusal-$1-$2" status=0 said
            said="$(RED_PROOF_DIR="$dir" scripts/red-proof.sh "$layer" "$code" 2>&1)" || status=$?
            if [ "$status" -ne 3 ] || ! grep -qxF "no test selected: $code at $layer" <<< "$said"; then
              printf 'the proof of %s at %s exited %s, not refusing it as no test selected\n' "$code" "$layer" "$status"
              tail -20 <<< "$said"
              exit 1
            fi
            if [ -e "$dir/vitest.json" ] || [ -e "$dir/cucumber.json" ]; then
              printf 'the proof of %s at %s refused it only after running\n' "$code" "$layer"
              exit 1
            fi
            printf 'the proof of %s at %s was refused: no test selected\n' "$code" "$layer"
          }
          refused unit SCN-ZZZ-999
          refused integration SCN-CFG-004

      - name: A red proof in which no selected test reported a result fails as not a red
        id: SCN-FIT-037
        if: ${{ !cancelled() && steps.SCN-FIT-012.outcome != 'skipped' }}
        shell: bash
        # Each fixture is a report recorded from a run broken on purpose: a test file that throws at import, a setup hook that throws before any test, and the same two for Cucumber.
        # In two of them the selected tests are reported as skipped, so a judge that counts a skipped test as a result reds.
        # The full Test and Cucumber runs' own reports are the control: a judge that refuses every report reds on them.
        run: |
          judged() {
            local layer=$1 report=$2 status=0 said
            said="$(scripts/red-proof.sh judge "$layer" "$report" 2>&1)" || status=$?
            echo "$status"
            tail -20 <<< "$said"
          }
          failed=0
          for fixture in unit:vitest-test-file-throws-at-import unit:vitest-setup-throws-before-any-test integration:cucumber-setup-throws-before-any-scenario integration:cucumber-scenario-setup-throws-before-any-step; do
            layer=${fixture%%:*} report="tests/fixtures/red-proof/${fixture#*:}.json"
            verdict="$(judged "$layer" "$report")"
            if [ "$(head -1 <<< "$verdict")" != 4 ] || ! grep -qxF "not a red: no selected test reported a result" <<< "$verdict"; then
              printf 'the judge read %s at %s as exit %s, not as not a red\n%s\n' "$report" "$layer" "$(head -1 <<< "$verdict")" "$(tail -n +2 <<< "$verdict")"
              failed=1
            else
              printf 'the judge refused %s at %s: not a red\n' "$report" "$layer"
            fi
          done
          for control in unit:vitest integration:cucumber; do
            layer=${control%%:*} report="$SPEC_CONTROLLER_EVIDENCE_DIR/${control#*:}.json"
            verdict="$(judged "$layer" "$report")"
            if [ "$(head -1 <<< "$verdict")" = 4 ]; then
              printf 'the judge refused the full run report %s, in which every test reported a result\n' "$report"
              failed=1
            else
              printf 'the judge read the full run report %s as exit %s\n' "$report" "$(head -1 <<< "$verdict")"
            fi
          done
          exit "$failed"

      - name: No test leaves an entry in its temporary directory
        id: SCN-FIT-031
        if: ${{ !cancelled() && steps.SCN-FIT-012.outcome != 'skipped' }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP/suite-tmp"
          left="$(find . -mindepth 2 -maxdepth 2 | sed -E 's|^\./||; s/-?[0-9A-Za-z]{6}$//' | sort | uniq -c)"
          [ -z "$left" ] || { printf 'left behind, by suite and prefix:\n%s\n' "$left"; exit 1; }

      - name: The behavioural suite refuses a command bundle older than the lockfile
        id: SCN-FIT-068
        if: ${{ !cancelled() && steps.SCN-FIT-012.outcome != 'skipped' }}
        shell: bash
        # The Cucumber step's pass on the fresh tree is the control. The lockfile's time is put back however the step ends, so no later step sees a stale bundle.
        env:
          TMPDIR: ${{ runner.temp }}/freshness/tmp
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: |
          start=$SECONDS
          mkdir -p "$TMPDIR"
          kept="$TMPDIR/lockfile-time"
          touch -r pnpm-lock.yaml "$kept"
          trap 'touch -r "$kept" pnpm-lock.yaml' EXIT
          touch pnpm-lock.yaml
          status=0
          said="$(pnpm cucumber --tags @SCN-USG-002 2>&1)" || status=$?
          echo "the step took $((SECONDS - start)) s"
          if [ "$status" -eq 0 ] || ! grep -qF "OLDER than pnpm-lock.yaml" <<< "$said"; then
            printf 'the suite exited %s on a bundle older than the lockfile, without refusing it\n' "$status"
            tail -20 <<< "$said"
            exit 1
          fi
          echo "the suite refused to start: the bundle is older than pnpm-lock.yaml"

      # Every ESLint check lints in one process, which writes one report; each check's own step reads only its entry.
      - name: Lint every ESLint check into one report
        if: always()
        run: node scripts/eslint-report.mjs "$RUNNER_TEMP/lint-reports/eslint.json" "$RUNNER_TEMP/tool-cache/eslint"

      - name: Complexity — eslint's cognitive-complexity and max-lines-per-function
        id: SCN-FIT-001
        if: always()
        shell: bash
        # An error anywhere fails it; a warning fails it only in a file this change touches.
        run: git diff -z --name-only --diff-filter=d "$(git merge-base origin/main HEAD)" | jq -e -r --arg check complexity --rawfile warnIn /dev/stdin -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: CRAP — complex code must be tested
        id: SCN-FIT-022
        if: ${{ !cancelled() && steps.SCN-FIT-012.outcome != 'skipped' }}
        shell: bash
        run: |
          node_modules/.bin/crap-typescript --format text --threshold "${CRAP_THRESHOLD:?}" packages || [ $? -eq 2 ]
          git diff -z --name-only --diff-filter=d "$(git merge-base origin/main HEAD)" -- 'packages/*/src/*' | xargs -0 -r node_modules/.bin/crap-typescript --format text --threshold "${CRAP_THRESHOLD:?}"

      - name: Duplication — no clone touches a changed production file
        id: SCN-FIT-032
        if: always()
        shell: bash
        # jscpd, pinned in package.json, reads its settings from .jscpd.json, which takes no comments, so their reasons are here.
        # It scans both packages' src as TypeScript, with tests, shared test helpers and fixtures ignored: production code only.
        # minTokens 50 and minLines 5 are jscpd's own default definition of a clone, stated in full so a copier inherits it.
        # absolute names each file by its full path, so the report can be matched against the changed set.
        # The first command reports every production clone and exits 0; the second reds on a clone with a fragment in a changed file.
        run: |
          node_modules/.bin/jscpd --output "$RUNNER_TEMP/jscpd"
          git diff -z --name-only --diff-filter=d "$(git merge-base origin/main HEAD)" | tr '\0' '\n' | jq -R . | jq -s -r --arg root "$PWD/" --slurpfile report "$RUNNER_TEMP/jscpd/jscpd-report.json" '. as $changed | $report[0].duplicates[] | select([.firstFile.name, .secondFile.name] | map(ltrimstr($root)) | any(IN($changed[]))) | "\(.firstFile.name | ltrimstr($root)):\(.firstFile.start)-\(.firstFile.end) = \(.secondFile.name | ltrimstr($root)):\(.secondFile.start)-\(.secondFile.end)"' | awk '{ print } END { exit NR > 0 }'

      - name: Unused code — no changed file carries an unused file, export or dependency
        id: SCN-FIT-033
        if: always()
        shell: bash
        # knip, pinned in package.json and configured in knip.jsonc, where each setting carries its reason.
        # Default mode: an export a test imports is used. Exported types count as exports.
        # The first command reports every finding and exits 0; the second reds on a finding in a file the change touches.
        run: |
          node_modules/.bin/knip --include files,exports,types,dependencies --no-exit-code
          node_modules/.bin/knip --include files,exports,types,dependencies --reporter json --no-exit-code > "$RUNNER_TEMP/knip.json"
          git diff -z --name-only --diff-filter=d "$(git merge-base origin/main HEAD)" | tr '\0' '\n' | jq -R . | jq -s -r --slurpfile report "$RUNNER_TEMP/knip.json" '. as $changed | $report[0].issues[] | select(.file as $f | $changed | index($f)) | . as $i | ([(if (.files | length) > 0 then "unused file" else empty end)] + [.exports[]?, .types[]?, .dependencies[]?, .devDependencies[]?, .optionalPeerDependencies[]? | .name]) | map("\($i.file): \(.)")[]' | awk '{ print } END { exit NR > 0 }'

      - name: A test helper is written once, in a test-utils file
        id: SCN-FIT-062
        if: always()
        run: git diff -z --name-only --diff-filter=d "$(git merge-base origin/main HEAD)" | tr '\0' '\n' | node scripts/test-helpers-written-once.mjs

      - name: Import boundaries
        id: SCN-FIT-009
        if: always()
        run: |
          node_modules/.bin/depcruise --config config/.dependency-cruiser.js packages --cache "$RUNNER_TEMP/tool-cache/depcruise/boundaries" --cache-strategy content
          jq -e -r --arg check boundaries -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: Gherkin is parsed by one module
        id: SCN-FIT-060
        if: always()
        run: node_modules/.bin/depcruise --config config/.dependency-cruiser.gherkin.js packages --cache "$RUNNER_TEMP/tool-cache/depcruise/gherkin" --cache-strategy content

      - name: Workflow YAML is parsed by one module
        id: SCN-FIT-061
        if: always()
        run: node_modules/.bin/depcruise --config config/.dependency-cruiser.yaml.js packages --cache "$RUNNER_TEMP/tool-cache/depcruise/yaml" --cache-strategy content

      - name: Evidence layers cross a seam
        id: SCN-FIT-027
        if: always()
        run: jq -e -r --arg check seam -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: No comment disables a mutant
        id: SCN-FIT-039
        if: always()
        run: jq -e -r --arg check mutation -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: No production source file writes message prose outside its package's catalogue
        id: SCN-FIT-041
        if: always()
        run: jq -e -r --arg check messages -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: Every production source file is in a mutation scope or on the recorded list
        id: SCN-FIT-040
        if: always()
        shell: bash
        run: |
          # A scope's own ! lines are not read: an exclude pathspec applies to the whole listing, never to one scope's matches.
          set -f
          excludes=()
          while IFS= read -r p; do
            if [ -n "$p" ]; then excludes+=(":(exclude,glob)$p"); fi
          done < <(yq -r '(.jobs.mutation.strategy.matrix.include[].mutate | split(",") | .[] | select(test("^!") | not)), .env.UNSCOPED' .github/workflows/mutation.yml)
          git ls-files -- ':(glob)packages/*/src/**/*.ts' ':(exclude,glob)packages/**/*.test.ts' ':(exclude,glob)packages/**/*.test-utils.ts' "${excludes[@]}" \
            | awk '{ print $0 ": in no mutation scope and not on the recorded list of files no scope mutates" } END { exit NR > 0 }'

      - name: No unit test file runs code at collection time or in a hook that runs once for many tests
        id: SCN-FIT-042
        if: always()
        run: jq -e -r --arg check collection -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: No type, field, function, variable or parameter in core's domain is named for an external tool or format
        id: SCN-FIT-049
        if: always()
        run: jq -e -r --arg check domain -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: No string, template part or regular expression in core's domain names an external tool, format, flag or syntax
        id: SCN-FIT-064
        if: always()
        run: jq -e -r --arg check domainLiterals -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: No sentence for a reader is written in core's domain
        id: SCN-FIT-050
        if: always()
        run: jq -e -r --arg check domainProse -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: No number stands as a type in core's domain
        id: SCN-FIT-063
        if: always()
        run: jq -e -r --arg check domainNumbers -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: Only the exit-code module sets the process's exit code
        id: SCN-FIT-065
        if: always()
        run: jq -e -r --arg check exitCode -f scripts/eslint-findings.jq "$RUNNER_TEMP/lint-reports/eslint.json"

      - name: A unit test citing a domain concept's scenario lives in core's domain
        id: SCN-FIT-055
        if: always()
        run: node scripts/domain-tests-in-domain.mjs "$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json"

      # The ceiling and the sets it counts live in config/cloc.ratio.js.
      - name: Test code stays within the declared ceiling ratio to production code
        id: SCN-FIT-043
        if: always()
        run: node scripts/test-ratio.mjs

      # remark-validate-links checks each relative link and its anchor; scripts/doc-references.mjs checks what no tool reads.
      # A doc-only push to main skips this step and the Vale steps; pnpm docs:check runs them all before such a push.
      - name: Every reference in a current-state document resolves
        id: SCN-FIT-059
        if: always()
        run: pnpm docs:references

      - name: No step on a scenario Cucumber does not run
        id: SCN-FIT-028
        if: always()
        shell: bash
        run: |
          node_modules/.bin/cucumber-js --profile outside --dry-run --format message | jq -rn '[inputs] | (map(.testCase.pickleId // empty)) as $run | .[] | .pickle // empty | select((.steps | length) > 0 and (.id | IN($run[]))) | "\(.uri): \(.name) carries \(.steps | length) step(s)"' | awk '{ print } END { exit NR > 0 }'

      - name: No unused step definition
        id: SCN-FIT-029
        if: always()
        shell: bash
        run: |
          node_modules/.bin/cucumber-js --dry-run --format usage-json | jq -r '.[] | select((.matches | length) == 0) | "\(.uri):\(.line): \(.pattern) matches no step Cucumber runs"' | awk '{ print } END { exit NR > 0 }'

      - name: Every scenario takes its steps from one step-definition file
        id: SCN-FIT-044
        if: always()
        shell: bash
        run: |
          node_modules/.bin/cucumber-js --dry-run --format message | jq -rn '[inputs] | (map(.stepDefinition // empty | {key: .id, value: .sourceReference.uri}) | from_entries) as $file | (map(.pickle // empty | {key: .id, value: "\(.uri): \(.name)"}) | from_entries) as $name | .[] | .testCase // empty | ([.testSteps[].stepDefinitionIds[]? | $file[.]] | unique) as $files | select(($files | length) > 1) | "\($name[.pickleId]) takes steps from \($files | join(", "))"' | awk '{ print } END { exit NR > 0 }'

      - name: Typecheck
        id: SCN-FIT-011
        if: always()
        run: pnpm typecheck --incremental --tsBuildInfoFile "$RUNNER_TEMP/tool-cache/tsc/typecheck.tsbuildinfo"

      - name: Published packages
        id: SCN-FIT-018
        if: always()
        run: pnpm lint:publint

      - name: Published types
        id: SCN-FIT-019
        if: always()
        run: pnpm lint:published-types

      - name: A release compares each package's whole built dist with the last release's
        id: SCN-FIT-066
        if: always()
        shell: bash
        # The stand-in npm serves tarballs packed from this run's own build, so the control reads identical and each case changes one served file.
        # The script's output is indented when printed, so no workflow command in it reaches the run's annotations.
        env:
          FAKE_NPM_DIR: ${{ runner.temp }}/release-compare/registry
          STAGE: ${{ runner.temp }}/release-compare/stage
          RELEASE_COMPARE_TRIES: "1"
          RELEASE_COMPARE_WAIT_S: "0"
        run: |
          start=$SECONDS
          failed=0
          stage() {
            [ ! -d "$STAGE" ] || rm -r "$STAGE"
            mkdir -p "$FAKE_NPM_DIR"
            for package in core spec-controller; do
              mkdir -p "$STAGE/$package/package"
              cp -R "packages/$package/dist" "$STAGE/$package/package/dist"
            done
          }
          serve() {
            for package in core spec-controller; do
              tar -czf "$FAKE_NPM_DIR/$package.tgz" -C "$STAGE/$package" package
            done
          }
          expect() {
            local want=$1 case=$2 status=0 out line
            shift 2
            out=$(PATH="$PWD/tests/fixtures/release-compare:$PATH" scripts/release-changed.sh packages 0.0.0 2>&1) || status=$?
            local missing=()
            for line in "$@"; do grep -qxF -- "$line" <<< "$out" || missing+=("$line"); done
            if [ "$status" -eq "$want" ] && [ ${#missing[@]} -eq 0 ]; then
              echo "ok: $case"
            else
              echo "FAILED: $case: exit $status, wanted $want"
              for line in "${missing[@]}"; do echo "  no line: $line"; done
              failed=1
            fi
            while IFS= read -r line; do printf '    | %s\n' "$line"; done <<< "$out"
          }
          core='@3f-consulting/spec-controller-core'
          cli='spec-controller'

          stage; serve
          expect 1 "both served unchanged" \
            "$core: the built dist is identical to $core@0.0.0's" \
            "$cli: the built dist is identical to $cli@0.0.0's"

          stage; echo "export {};" >> "$STAGE/core/package/dist/index.d.ts"; serve
          expect 0 "a line appended to core's index.d.ts" \
            "$core: the built dist differs from $core@0.0.0's:" \
            "$cli: the built dist is identical to $cli@0.0.0's"

          stage; rm "$STAGE/core/package/dist/index.js.map"; serve
          expect 0 "a file removed from core's dist" \
            "$core: the built dist differs from $core@0.0.0's:"

          stage
          cli_js="$STAGE/spec-controller/package/dist/cli.js"
          [ "$(dd if="$cli_js" bs=1 skip=200 count=1 2> /dev/null)" = x ] && byte=y || byte=x
          printf '%s' "$byte" | dd of="$cli_js" bs=1 seek=200 conv=notrunc 2> /dev/null
          serve
          expect 0 "a byte changed in the CLI's cli.js" \
            "$core: the built dist is identical to $core@0.0.0's" \
            "$cli: the built dist differs from $cli@0.0.0's:"

          echo "the release comparison's cases took $((SECONDS - start)) s"
          exit "$failed"

      - name: A release whose comparison cannot read the last release publishes nothing and warns
        id: SCN-FIT-067
        if: always()
        shell: bash
        # Port 9 refuses connections, so the real npm fails as it does when the registry is down.
        # The script's output is indented when printed, so no workflow command in it reaches the run's annotations.
        env:
          FAKE_NPM_DIR: ${{ runner.temp }}/release-unread/registry
          STAGE: ${{ runner.temp }}/release-unread/stage
          RELEASE_COMPARE_TRIES: "3"
          RELEASE_COMPARE_WAIT_S: "0"
        run: |
          start=$SECONDS
          failed=0
          stage() {
            for path in "$STAGE" "$FAKE_NPM_DIR"; do [ ! -d "$path" ] || rm -r "$path"; done
            mkdir -p "$FAKE_NPM_DIR"
            for package in core spec-controller; do
              mkdir -p "$STAGE/$package/package"
              cp -R "packages/$package/dist" "$STAGE/$package/package/dist"
            done
          }
          serve() {
            for package in "$@"; do
              tar -czf "$FAKE_NPM_DIR/$package.tgz" -C "$STAGE/$package" package
            done
          }
          # Each wanted line is a prefix, since npm's own words end the could-not-compare lines.
          expect() {
            local want=$1 case=$2 status=0 out line wanted found
            shift 2
            out=$("${run[@]}" scripts/release-changed.sh packages 0.0.0 2>&1) || status=$?
            local missing=()
            for wanted in "$@"; do
              found=0
              while IFS= read -r line; do [[ $line == "$wanted"* ]] && found=1; done <<< "$out"
              [ "$found" -eq 1 ] || missing+=("$wanted")
            done
            if [ "$status" -eq "$want" ] && [ ${#missing[@]} -eq 0 ]; then
              echo "ok: $case"
            else
              echo "FAILED: $case: exit $status, wanted $want"
              for line in "${missing[@]}"; do echo "  no line: $line"; done
              failed=1
            fi
            while IFS= read -r line; do printf '    | %s\n' "$line"; done <<< "$out"
          }
          core='@3f-consulting/spec-controller-core'
          cli='spec-controller'
          stand_in=(env "PATH=$PWD/tests/fixtures/release-compare:$PATH")

          run=(env npm_config_registry=http://127.0.0.1:9/)
          expect 1 "the registry refuses every connection" \
            "::warning::could not compare $core@0.0.0: " \
            "::warning::could not compare $cli@0.0.0: "

          run=("${stand_in[@]}")
          stage; serve core spec-controller; echo 1 > "$FAKE_NPM_DIR/core.fail"
          expect 1 "core's first download fails, both unchanged" \
            "$core: try 1 of 3 could not download $core@0.0.0" \
            "$core: the built dist is identical to $core@0.0.0's" \
            "$cli: the built dist is identical to $cli@0.0.0's"

          stage
          cli_js="$STAGE/spec-controller/package/dist/cli.js"
          [ "$(dd if="$cli_js" bs=1 skip=200 count=1 2> /dev/null)" = x ] && byte=y || byte=x
          printf '%s' "$byte" | dd of="$cli_js" bs=1 seek=200 conv=notrunc 2> /dev/null
          serve spec-controller
          expect 0 "core cannot be read, the CLI changed" \
            "$core: could not download $core@0.0.0 in 3 tries: " \
            "$cli: the built dist differs from $cli@0.0.0's:"

          echo "the unreadable-release cases took $((SECONDS - start)) s"
          exit "$failed"

      - name: Workflow correctness
        id: SCN-FIT-020
        if: always()
        shell: bash
        # The version and checksum move together; the checksum is the linux_amd64 line of the
        # release's actionlint_<version>_checksums.txt.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - name: Workflow security
        id: SCN-FIT-021
        if: always()
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          inputs: .github/workflows/
          advanced-security: false
          online-audits: false

      # Every Semgrep rule runs in one scan, which writes one report; each rule's own step reads only its findings.
      - name: Scan every Semgrep rule into one report
        if: always()
        run: bash scripts/semgrep-report.sh "$RUNNER_TEMP/lint-reports/semgrep.json"

      - name: No child process runs through a shell
        id: SCN-FIT-051
        if: always()
        run: jq -e -r --arg rule no-shell-child-process -f scripts/semgrep-findings.jq "$RUNNER_TEMP/lint-reports/semgrep.json"

      - name: No code is built from a string while the program runs
        id: SCN-FIT-052
        if: always()
        run: jq -e -r --arg rule no-code-from-strings -f scripts/semgrep-findings.jq "$RUNNER_TEMP/lint-reports/semgrep.json"

      - name: No regular expression is built from a value the program receives
        id: SCN-FIT-053
        if: always()
        run: jq -e -r --arg rule no-regexp-from-an-argument -f scripts/semgrep-findings.jq "$RUNNER_TEMP/lint-reports/semgrep.json"

      - name: A file is written only where its location has been checked
        id: SCN-FIT-054
        if: always()
        run: jq -e -r --arg rule writes-only-where-the-location-is-checked -f scripts/semgrep-findings.jq "$RUNNER_TEMP/lint-reports/semgrep.json"

      - name: Mutation verdict recorded
        id: SCN-FIT-002
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # mutation.yml titles a full sweep "Mutation"; a scoped run carries another title. GitHub's API sometimes errors or answers empty, so ask tries each read three times: three errors fail the step as UNREAD, and only three empty answers are a state, LAPSED for the run list or NO SCOPE MEASURED for the jobs. A lapse and a sweep that ran no scope job are each recorded and pass.
        run: |
          ask() { ok=0; for try in 1 2 3; do if out=$("$@"); then ok=1; [ -n "$out" ] && { printf '%s\n' "$out"; return 0; }; fi; [ "$try" = 3 ] || sleep 10; done; [ "$ok" = 1 ]; }
          since=$(date -u -d "${MUTATION_VERDICT_MAX_AGE_H:?} hours ago" +%FT%TZ)
          main=$(ask gh run list --workflow mutation.yml --branch main --status completed --created ">=$since" --limit 50 --json databaseId,displayTitle --jq 'map(select(.displayTitle == "Mutation"))[0].databaseId // empty') || { echo "UNREAD: the run list could not be read after three tries"; exit 1; }
          [ -n "$main" ] || { echo "LAPSED: no full sweep on main inside the window — the line is stopped until one runs"; exit 0; }
          verdicts=$(ask gh run view "$main" --json jobs --jq '.jobs[] | select(.name | startswith("mutation")) | "\(.name): \(.conclusion)"') || { echo "UNREAD: sweep $main could not be read after three tries"; exit 1; }
          [ -n "$verdicts" ] || { echo "NO SCOPE MEASURED: sweep $main ran no scope job — the line is stopped until a sweep measures"; exit 0; }
          printf '%s\n' "$verdicts"

      - name: Comment share — no file over its comment-line ceiling
        id: SCN-FIT-023
        if: always()
        shell: bash
        # Alternative: cloc counts each file's comment and code lines but applies no ceiling, so this awk is the ceiling.
        run: |
          node_modules/.bin/cloc --vcs=git --fullpath --not-match-d='(^|/)tests/fixtures(/|$)' --not-match-f='(^|/)pnpm-lock\.yaml$' --exclude-lang=Markdown --skip-uniqueness --strip-str-comments --by-file --csv --quiet | awk -F, -v max="${COMMENT_SHARE_MAX:?}" 'NR > 1 && $1 != "SUM" && $4 + $5 > 0 && $4 / ($4 + $5) > max { printf "%s: %d of %d non-blank lines are comment\n", $2, $4, $4 + $5; over = 1 } END { exit over }'

      - name: No ticket ID in a comment, description or document
        id: SCN-FIT-024
        if: always()
        run: pnpm docs:ticket-id

      - name: No scenario code in a comment, description or document
        id: SCN-FIT-025
        if: always()
        run: pnpm docs:scenario-code

      - name: No narrated history in a comment, description or document
        id: SCN-FIT-026
        if: always()
        run: pnpm docs:narrated-history

      - name: No title or description names a code identifier or a source file
        id: SCN-FIT-038
        if: always()
        run: pnpm docs:code-identifier

      - name: No Given, When or Then names an interface mechanic
        id: SCN-FIT-030
        if: always()
        run: pnpm docs:interface-mechanic

      - name: Dump this run's step record
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$SPEC_CONTROLLER_EVIDENCE_DIR"
          record="$SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json"
          printf '%s' "$STEPS_JSON" > "$record"
          printf 'step record: %s bytes, %s step(s) with an id:\n' \
            "$(wc -c < "$record" | tr -d ' ')" "$(jq 'length' "$record")"

      - name: Reconciliation
        if: always()
        run: pnpm spec-controller balance --features features --vitest "$SPEC_CONTROLLER_EVIDENCE_DIR/vitest.json" --cucumber "$SPEC_CONTROLLER_EVIDENCE_DIR/cucumber.json" $([ -f "$SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json" ] && echo "--ci-steps $SPEC_CONTROLLER_EVIDENCE_DIR/ci-steps.json") --ci .github/workflows/ci.yml --package-json package.json --target spec-controller

      - name: Hand the built packages to the release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-packages
          path: |
            packages/core/dist
            packages/spec-controller/dist
          if-no-files-found: error
          retention-days: 1
