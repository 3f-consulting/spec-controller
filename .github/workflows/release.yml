name: Release

# Publishes only what CI built and passed: on a push to main whose CI run succeeded,
# when a published path changed since the last version tag. The tests are CI's alone.
on: # zizmor: ignore[dangerous-triggers] main only, a push run only, a successful run only, its own head commit on main, and its artifact from that push run, never a pull_request run
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  changes:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Did a published path change since the last version tag
        id: diff
        run: |
          tag="$(git describe --tags --match 'v*' --abbrev=0 HEAD)"
          if git diff --quiet "$tag" HEAD -- \
            ':(glob)packages/*/src/**' ':(exclude,glob)packages/*/src/**/*.test.ts' \
            ':(glob)packages/*/package.json' ':(glob)packages/*/README.md' \
            ':(glob)packages/*/tsconfig.build.json' tsconfig.json; then
            echo "no published path changed since $tag"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "published paths changed since $tag"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      version: ${{ steps.counter.outputs.version }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      # Packing resolves the CLI's workspace dependency on core, which needs node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Take the packages CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-packages
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Stamp the next counter version on both packages
        id: counter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(node -p "require('./packages/spec-controller/package.json').version")"
          prefix="${base%.*}."
          n="$(
            {
              npm view @3f-consulting/spec-controller-core versions --json &&
              npm view spec-controller versions --json &&
              gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '[.[].ref | ltrimstr("refs/tags/v")]'
            } | jq -r 'if type == "array" then .[] else . end' \
              | awk -v p="$prefix" 'index($0, p) == 1 { s = substr($0, length(p) + 1); if (s ~ /^[0-9]+$/) print s }' \
              | sort -n | tail -1
          )"
          if [ -n "$n" ]; then v="$prefix$((n + 1))"; else v="$base"; fi
          echo "line ${prefix}N, highest published ${n:-none}, releasing $v"
          (cd packages/core && npm pkg set version="$v")
          (cd packages/spec-controller && npm pkg set version="$v")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Pack both packages, once
        run: |
          rm -rf "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/release"
          pnpm --dir packages/core pack --pack-destination "$RUNNER_TEMP/release"
          pnpm --dir packages/spec-controller pack --pack-destination "$RUNNER_TEMP/release"

      - name: Smoke the packed artefacts in a clean room
        run: | # zizmor: ignore[adhoc-packages]
          room="$RUNNER_TEMP/clean-room"
          rm -rf "$room"
          mkdir -p "$room"
          cd "$room"
          npm install --prefer-offline --no-audit --no-fund --loglevel=error "$RUNNER_TEMP/release"/*.tgz
          ./node_modules/.bin/spec-controller balance --help

      - name: Publish core
        run: |
          v="$(node -p "require('./packages/core/package.json').version")"
          case "$v" in *-*) t="${v#*-}"; t="${t%%.*}" ;; *) t=latest ;; esac
          npm publish "$RUNNER_TEMP/release"/3f-consulting-spec-controller-core-*.tgz --tag "$t"

      - name: Publish the CLI
        run: |
          v="$(node -p "require('./packages/spec-controller/package.json').version")"
          case "$v" in *-*) t="${v#*-}"; t="${t%%.*}" ;; *) t=latest ;; esac
          npm publish "$RUNNER_TEMP/release"/spec-controller-*.tgz --tag "$t"

  tag:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the commit that was published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$HEAD_SHA"
