name: Release

# Publishes only what CI built and passed, on every push to main whose CI run succeeded. The tests are CI's alone.
on: # zizmor: ignore[dangerous-triggers] main only, a push run only, a successful run only, its own head commit on main, and its artifact from that push run, never a pull_request run
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  tip:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}
    timeout-minutes: 5
    steps:
      # A re-run of an older commit's CI would otherwise publish that commit's tree as latest, over every newer change.
      - name: Publish only main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" = "$HEAD_SHA" ]; then echo current=true >> "$GITHUB_OUTPUT"; else echo "CI ran on $HEAD_SHA, but main's tip is $tip: publishing nothing; the tip's own CI run publishes"; echo current=false >> "$GITHUB_OUTPUT"; fi

  release:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      version: ${{ steps.counter.outputs.version }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      # Packing resolves the CLI's workspace dependency on core, which needs node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Take the packages CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-packages
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Stamp the next counter version on both packages
        id: counter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(node -p "require('./packages/spec-controller/package.json').version")"
          prefix="${base%.*}."
          n="$(
            {
              {
                npm view @3f-consulting/spec-controller-core versions --json &&
                npm view spec-controller versions --json &&
                gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '[.[].ref | ltrimstr("refs/tags/v")]'
              } || { echo "could not read the published versions from registry.npmjs.org and the repository's tags" >&2; exit 1; }
            } | jq -r 'if type == "array" then .[] else . end' \
              | awk -v p="$prefix" 'index($0, p) == 1 { s = substr($0, length(p) + 1); if (s ~ /^[0-9]+$/) print s }' \
              | sort -n | tail -1
          )"
          if [ -n "$n" ]; then v="$prefix$((n + 1))"; else v="$base"; fi
          echo "line ${prefix}N, highest published ${n:-none}, releasing $v"
          (cd packages/core && npm pkg set version="$v")
          (cd packages/spec-controller && npm pkg set version="$v")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Pack both packages, once
        run: |
          rm -rf "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/release"
          pnpm --dir packages/core pack --pack-destination "$RUNNER_TEMP/release"
          pnpm --dir packages/spec-controller pack --pack-destination "$RUNNER_TEMP/release"

      - name: Smoke the packed artefacts in a clean room
        run: | # zizmor: ignore[adhoc-packages]
          room="$RUNNER_TEMP/clean-room"
          rm -rf "$room"
          mkdir -p "$room"
          cd "$room"
          npm install --prefer-offline --no-audit --no-fund --loglevel=error "$RUNNER_TEMP/release"/*.tgz
          npx spec-controller balance --help

      - name: Publish core
        run: |
          v="$(node -p "require('./packages/core/package.json').version")"
          case "$v" in *-*) t="${v#*-}"; t="${t%%.*}" ;; *) t=latest ;; esac
          npm publish "$RUNNER_TEMP/release"/3f-consulting-spec-controller-core-*.tgz --tag "$t"

      - name: Publish the CLI
        run: |
          v="$(node -p "require('./packages/spec-controller/package.json').version")"
          case "$v" in *-*) t="${v#*-}"; t="${t%%.*}" ;; *) t=latest ;; esac
          npm publish "$RUNNER_TEMP/release"/spec-controller-*.tgz --tag "$t"

  latest:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      # npm can take 20 to 40 minutes to serve a publish it has acknowledged.
      LATEST_WAIT_S: 2400
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: A bare install resolves the version just published
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          scripts/latest-is.sh @3f-consulting/spec-controller-core "$VERSION"
          scripts/latest-is.sh spec-controller "$VERSION"

  tag:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the commit that was published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$HEAD_SHA"

      - name: Publish the release notes for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "v$VERSION"
