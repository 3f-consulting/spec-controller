name: Release

# Publishes only what CI built and passed, on every push to main whose CI run succeeded. The tests are CI's alone.
on: # zizmor: ignore[dangerous-triggers] main only, a push run only, a successful run only, its own head commit on main, and its artifact from that push run, never a pull_request run
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  tip:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}
    timeout-minutes: 5
    steps:
      # A re-run of an older commit's CI would otherwise publish that commit's tree as latest, over every newer change.
      - name: Publish only main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" = "$HEAD_SHA" ]; then echo current=true >> "$GITHUB_OUTPUT"; else echo "CI ran on $HEAD_SHA, but main's tip is $tip: publishing nothing; the tip's own CI run publishes"; echo current=false >> "$GITHUB_OUTPUT"; fi

  release:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      version: ${{ steps.counter.outputs.version }}
      dist-tag: ${{ steps.heading.outputs.dist-tag }}
      title: ${{ steps.heading.outputs.title }}
      notes: ${{ steps.heading.outputs.notes }}
    timeout-minutes: 15
    steps:
      # The whole history, so the changelog can be read back to the commit the previous publish named.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      # Packing resolves the CLI's workspace dependency on core, which needs node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Take the packages CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-packages
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Stamp the next counter version on both packages
        id: counter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(node -p "require('./packages/spec-controller/package.json').version")"
          prefix="${base%.*}."
          n="$(
            {
              {
                npm view @3f-consulting/spec-controller-core versions --json &&
                npm view spec-controller versions --json &&
                gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/published/" --jq '[.[].ref | ltrimstr("refs/published/")]' &&
                gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '[.[].ref | ltrimstr("refs/tags/v")]'
              } || { echo "could not read the published versions from registry.npmjs.org and the repository's refs" >&2; exit 1; }
            } | jq -r 'if type == "array" then .[] else . end' \
              | awk -v p="$prefix" 'index($0, p) == 1 { s = substr($0, length(p) + 1); if (s ~ /^[0-9]+$/) print s }' \
              | sort -n | tail -1
          )"
          if [ -n "$n" ]; then v="$prefix$((n + 1))"; else v="$base"; fi
          echo "line ${prefix}N, highest published ${n:-none}, releasing $v"
          (cd packages/core && npm pkg set version="$v")
          (cd packages/spec-controller && npm pkg set version="$v")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "previous=${n:+$prefix$n}" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      # A merge releases when the changelog has gained a version heading since the previous publish, and only when the
      # heading names the version this merge publishes; anything else fails here, before anything is published.
      - name: Read the version heading the merge adds
        id: heading
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.counter.outputs.version }}
          PREVIOUS: ${{ steps.counter.outputs.previous }}
          PREFIX: ${{ steps.counter.outputs.prefix }}
        run: |
          # A prerelease publishes under its own identifier, and only a stable version releases.
          case "$VERSION" in *-*) t="${VERSION#*-}"; echo "dist-tag=${t%%.*}" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          # The commit the newest publish at or below the previous version was built from: its own ref, or else an older one.
          since=""
          if [ -n "$PREVIOUS" ]; then
            since="$(
              {
                gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/published/" --jq '.[] | "\(.ref | ltrimstr("refs/published/")) \(.object.sha)"' &&
                gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[] | "\(.ref | ltrimstr("refs/tags/v")) \(.object.sha)"'
              } | awk -v p="$PREFIX" -v top="${PREVIOUS##*.}" 'index($1, p) == 1 { n = substr($1, length(p) + 1); if (n ~ /^[0-9]+$/ && n + 0 <= top + 0 && (sha == "" || n + 0 > best)) { best = n + 0; sha = $2 } } END { print sha }'
            )"
          fi
          since="${since:-$HEAD_SHA^}"
          # A heading is a line of #s and a space, its edges trimmed; edits to a heading already there add none.
          headings() { awk '{ sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") } /^#+[[:space:]]/'; }
          git show "$since:CHANGELOG.md" | headings > "$RUNNER_TEMP/before.txt"
          headings < CHANGELOG.md > "$RUNNER_TEMP/after.txt"
          gained=$(( $(wc -l < "$RUNNER_TEMP/after.txt") - $(wc -l < "$RUNNER_TEMP/before.txt") ))
          if [ "$gained" -le 0 ]; then
            echo "no version heading since $since: publishing $VERSION under next"
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk 'NR == FNR { seen[$0] = 1; next } !($0 in seen)' "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" > "$RUNNER_TEMP/new.txt"
          if [ "$gained" -gt 1 ] || [ "$(wc -l < "$RUNNER_TEMP/new.txt")" -ne 1 ]; then
            printf 'the changelog gained %s heading(s) since %s, and one merge releases once:\n%s\npublishing, tagging and releasing nothing\n' "$gained" "$since" "$(cat "$RUNNER_TEMP/new.txt")" >&2
            exit 1
          fi
          heading="$(cat "$RUNNER_TEMP/new.txt")"
          named="$(printf '%s' "$heading" | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+) — [0-9]{4}-[0-9]{2}-[0-9]{2} — .+$/\1/p')"
          if [ -z "$named" ]; then
            printf 'the changelog gained "%s", which is not a version heading "## <version> — <yyyy-mm-dd> — <title>": publishing, tagging and releasing nothing\n' "$heading" >&2
            exit 1
          fi
          if [ "$named" != "$VERSION" ]; then
            echo "the version heading names $named, but this merge publishes $VERSION: publishing, tagging and releasing nothing" >&2
            exit 1
          fi
          # The heading's section: its lines, up to the next heading or the file's end.
          HEADING="$heading" awk '{ line = $0; sub(/^[[:space:]]+/, "", line); sub(/[[:space:]]+$/, "", line) } found && line ~ /^#+[[:space:]]/ { exit } found { print } line == ENVIRON["HEADING"] { found = 1 }' CHANGELOG.md \
            | awk 'NF { started = 1 } started' > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "the version heading for $VERSION stands over no line: publishing, tagging and releasing nothing" >&2
            exit 1
          fi
          echo "the version heading names $VERSION: publishing it under latest and releasing it, with these notes:"
          cat "$RUNNER_TEMP/notes.md"
          {
            echo "dist-tag=latest"
            echo "title=${heading#\#\# }"
            delimiter="notes_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            echo "notes<<$delimiter"
            cat "$RUNNER_TEMP/notes.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Pack both packages, once
        run: |
          rm -rf "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/release"
          pnpm --dir packages/core pack --pack-destination "$RUNNER_TEMP/release"
          pnpm --dir packages/spec-controller pack --pack-destination "$RUNNER_TEMP/release"

      - name: Smoke the packed artefacts in a clean room
        # npx then fails when the packed bin is missing, rather than fetching an older release of the same name.
        env:
          npm_config_yes: "false"
        run: | # zizmor: ignore[adhoc-packages]
          room="$RUNNER_TEMP/clean-room"
          rm -rf "$room"
          mkdir -p "$room"
          cd "$room"
          npm install --prefer-offline --no-audit --no-fund --loglevel=error "$RUNNER_TEMP/release"/*.tgz
          npx spec-controller balance --help

      - name: Publish core
        env:
          DIST_TAG: ${{ steps.heading.outputs.dist-tag }}
        run: |
          v="$(node -p "require('./packages/core/package.json').version")"
          case "$v" in *-*) t="${v#*-}"; t="${t%%.*}" ;; *) t="$DIST_TAG" ;; esac
          npm publish "$RUNNER_TEMP/release"/3f-consulting-spec-controller-core-*.tgz --tag "$t"

      - name: Publish the CLI
        env:
          DIST_TAG: ${{ steps.heading.outputs.dist-tag }}
        run: |
          v="$(node -p "require('./packages/spec-controller/package.json').version")"
          case "$v" in *-*) t="${v#*-}"; t="${t%%.*}" ;; *) t="$DIST_TAG" ;; esac
          npm publish "$RUNNER_TEMP/release"/spec-controller-*.tgz --tag "$t"

  # The counter's fast source: npm can take 20 to 40 minutes to serve a publish, and a ref is there at once.
  published:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Record the version published at the commit it was built from
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/published/$VERSION" -f sha="$HEAD_SHA"

  dist-tag:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      # npm can take 20 to 40 minutes to serve a publish it has acknowledged.
      DIST_TAG_WAIT_S: 2400
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: The dist-tag the merge published under resolves the version just published
        env:
          VERSION: ${{ needs.release.outputs.version }}
          DIST_TAG: ${{ needs.release.outputs.dist-tag }}
        run: |
          scripts/dist-tag-is.sh @3f-consulting/spec-controller-core "$DIST_TAG" "$VERSION"
          scripts/dist-tag-is.sh spec-controller "$DIST_TAG" "$VERSION"

  # Only a merge that released, under latest, is tagged and given a GitHub release.
  tag:
    needs: release
    if: needs.release.outputs.dist-tag == 'latest'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the commit that was published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$HEAD_SHA"

      # The notes are the version heading's section, as the release job read it.
      - name: Publish the release notes for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          TITLE: ${{ needs.release.outputs.title }}
          NOTES: ${{ needs.release.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$TITLE"
