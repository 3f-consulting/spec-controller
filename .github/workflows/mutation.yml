name: Mutation

on:
  schedule:
    - cron: "17 3 * * 1-6"
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "Run only this matrix scope (empty runs every scope); refused on main"
        required: false
        default: ""
      force:
        description: "Re-test every mutant, reusing no earlier result"
        type: boolean
        required: false
        default: false

env:
  # Production files no scope mutates. These re-export only, so there is no mutant to raise.
  UNSCOPED: |
    packages/core/src/index.ts
    packages/core/src/internal.ts
    packages/core/src/model.ts

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: core-domain
            mutate: "packages/core/src/domain/**/*.ts,!packages/core/src/domain/**/*.test.ts,!packages/core/src/domain/**/*.testkit.ts,!packages/core/src/domain/messages.ts"
            timeout: 60
          - scope: core-provenance
            mutate: "packages/core/src/provenance/**/*.ts,!packages/core/src/provenance/**/*.test.ts,!packages/core/src/provenance/**/*.testkit.ts"
            timeout: 8
          - scope: core-assemble
            mutate: "packages/core/src/assemble/**/*.ts,!packages/core/src/assemble/**/*.test.ts,!packages/core/src/assemble/**/*.testkit.ts"
            timeout: 17
          - scope: spec-controller-cli-allocate
            mutate: "packages/spec-controller/src/cli-allocate/**/*.ts,!packages/spec-controller/src/cli-allocate/**/*.test.ts,!packages/spec-controller/src/cli-allocate/**/*.testkit.ts"
            timeout: 15
          - scope: core-render
            mutate: "packages/core/src/render/**/*.ts,!packages/core/src/render/**/*.test.ts,!packages/core/src/render/**/*.testkit.ts"
            timeout: 60
          - scope: spec-controller-run-management
            mutate: "packages/spec-controller/src/run-management/**/*.ts,!packages/spec-controller/src/run-management/**/*.test.ts,!packages/spec-controller/src/run-management/**/*.testkit.ts"
            timeout: 6
          - scope: spec-controller-shell
            mutate: "packages/spec-controller/src/*.ts,!packages/spec-controller/src/*.test.ts,!packages/spec-controller/src/*.testkit.ts,!packages/spec-controller/src/messages.ts"
            timeout: 36
          - scope: spec-controller-ingest
            mutate: "packages/spec-controller/src/ingest/**/*.ts,!packages/spec-controller/src/ingest/**/*.test.ts,!packages/spec-controller/src/ingest/**/*.testkit.ts"
            timeout: 19
          - scope: spec-controller-cli-balance
            mutate: "packages/spec-controller/src/cli-balance/**/*.ts,!packages/spec-controller/src/cli-balance/**/*.test.ts,!packages/spec-controller/src/cli-balance/**/*.testkit.ts"
            timeout: 21
          - scope: core-census
            mutate: "packages/core/src/census/**/*.ts,!packages/core/src/census/**/*.test.ts,!packages/core/src/census/**/*.testkit.ts"
            timeout: 3
          - scope: core-parse
            mutate: "packages/core/src/parse/**/*.ts,!packages/core/src/parse/**/*.test.ts,!packages/core/src/parse/**/*.testkit.ts"
            timeout: 53
          - scope: core-lib
            mutate: "packages/core/src/lib/**/*.ts,!packages/core/src/lib/**/*.test.ts,!packages/core/src/lib/**/*.testkit.ts"
            timeout: 6
    env:
      SELECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == '' || matrix.scope == inputs.scope }}
      FORCE: ${{ github.event.schedule == '17 3 * * 0' || inputs.force == true }}
      INCREMENTAL_FILE: reports/stryker-incremental-${{ matrix.scope }}.json
    steps:
      - name: Refuse a scoped run on main
        if: inputs.scope != '' && github.ref == 'refs/heads/main'
        run: |
          echo "A scoped dispatch would stand as main's newest mutation run while sweeping one scope; dispatch without a scope on main."
          exit 1

      - if: env.SELECTED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.SELECTED == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable corepack
        if: env.SELECTED == 'true'
        run: corepack enable

      - name: Install dependencies
        if: env.SELECTED == 'true'
        run: pnpm install --frozen-lockfile

      # The key carries the configuration a mutant's result depends on that Stryker's
      # incremental diff cannot see, so a change to it starts a full run. Dependency
      # changes are left to Sunday's forced sweep: the lockfile changes almost daily.
      - name: Restore incremental results
        if: env.SELECTED == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: stryker-incremental-${{ matrix.scope }}-${{ hashFiles('stryker.config.js', 'vitest.config.ts', '.github/workflows/mutation.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-incremental-${{ matrix.scope }}-${{ hashFiles('stryker.config.js', 'vitest.config.ts', '.github/workflows/mutation.yml') }}-

      - name: Mutation test ${{ matrix.scope }}
        if: env.SELECTED == 'true'
        run: |
          args=(--mutate "$MUTATE" --incremental --incrementalFile "$INCREMENTAL_FILE")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          pnpm mutation "${args[@]}"
        env:
          MUTATE: ${{ matrix.mutate }}

      - name: Save incremental results
        if: always() && env.SELECTED == 'true' && hashFiles(env.INCREMENTAL_FILE) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: stryker-incremental-${{ matrix.scope }}-${{ hashFiles('stryker.config.js', 'vitest.config.ts', '.github/workflows/mutation.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation report
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.scope }}
          path: reports/mutation/
          retention-days: 14
