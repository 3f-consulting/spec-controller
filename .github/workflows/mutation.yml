name: Mutation
# The title "Mutation" marks a full sweep; the start gate reads only runs titled so.
run-name: ${{ inputs.scope && format('Mutation of scope {0}', inputs.scope) || 'Mutation' }}

on:
  schedule:
    - cron: "17 3 * * 1-6"
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "Run only this matrix scope (empty runs every scope); refused on main"
        required: false
        default: ""
      force:
        description: "Re-test every mutant, reusing no earlier result"
        type: boolean
        required: false
        default: false

env:
  # Production files no scope mutates. Core's index.ts re-exports only.
  UNSCOPED: |
    packages/core/src/index.ts

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A ceiling against a hung job, shared by every scope.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: core-domain
            mutate: "packages/core/src/domain/**/*.ts,!packages/core/src/domain/**/*.test.ts,!packages/core/src/domain/**/*.test-utils.ts"
          - scope: core-inputs
            mutate: "packages/core/src/inputs/**/*.ts,!packages/core/src/inputs/**/*.test.ts,!packages/core/src/inputs/**/*.test-utils.ts"
          - scope: core-reports
            mutate: "packages/core/src/reports/**/*.ts,!packages/core/src/reports/**/*.test.ts,!packages/core/src/reports/**/*.test-utils.ts"
          - scope: core-messages
            mutate: "packages/core/src/messages/**/*.ts,!packages/core/src/messages/**/*.test.ts,!packages/core/src/messages/**/*.test-utils.ts"
          - scope: app-run-request
            mutate: "packages/spec-controller/src/runRequest/**/*.ts,!packages/spec-controller/src/runRequest/**/*.test.ts,!packages/spec-controller/src/runRequest/**/*.test-utils.ts"
          - scope: app-inputs
            mutate: "packages/spec-controller/src/inputs/**/*.ts,!packages/spec-controller/src/inputs/**/*.test.ts,!packages/spec-controller/src/inputs/**/*.test-utils.ts"
          - scope: app-run-identity
            mutate: "packages/spec-controller/src/runIdentity/**/*.ts,!packages/spec-controller/src/runIdentity/**/*.test.ts,!packages/spec-controller/src/runIdentity/**/*.test-utils.ts"
          - scope: app-repository
            mutate: "packages/spec-controller/src/repository/**/*.ts,!packages/spec-controller/src/repository/**/*.test.ts,!packages/spec-controller/src/repository/**/*.test-utils.ts"
          - scope: app-output
            mutate: "packages/spec-controller/src/output/**/*.ts,!packages/spec-controller/src/output/**/*.test.ts,!packages/spec-controller/src/output/**/*.test-utils.ts"
          - scope: app-run-ending
            mutate: "packages/spec-controller/src/runEnding/**/*.ts,!packages/spec-controller/src/runEnding/**/*.test.ts,!packages/spec-controller/src/runEnding/**/*.test-utils.ts"
          - scope: app-commands
            mutate: "packages/spec-controller/src/commands/**/*.ts,!packages/spec-controller/src/commands/**/*.test.ts,!packages/spec-controller/src/commands/**/*.test-utils.ts"
    env:
      SELECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == '' || matrix.scope == inputs.scope }}
      FORCE: ${{ github.event.schedule == '17 3 * * 0' || inputs.force == true }}
      INCREMENTAL_FILE: reports/stryker-incremental-${{ matrix.scope }}.json
    steps:
      - name: Refuse a scoped run on main
        if: inputs.scope != '' && github.ref == 'refs/heads/main'
        run: |
          echo "A scoped dispatch would stand as main's newest mutation run while sweeping one scope; dispatch without a scope on main."
          exit 1

      - if: env.SELECTED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.SELECTED == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable corepack
        if: env.SELECTED == 'true'
        run: corepack enable

      - name: Install dependencies
        if: env.SELECTED == 'true'
        run: pnpm install --frozen-lockfile

      # The key carries the configuration a mutant's result depends on that Stryker's
      # incremental diff cannot see, so a change to it starts a full run. Dependency
      # changes are left to Sunday's forced sweep: the lockfile changes almost daily.
      - name: Restore incremental results
        if: env.SELECTED == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: stryker-incremental-${{ matrix.scope }}-${{ hashFiles('stryker.config.js', 'vitest.config.ts', '.github/workflows/mutation.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-incremental-${{ matrix.scope }}-${{ hashFiles('stryker.config.js', 'vitest.config.ts', '.github/workflows/mutation.yml') }}-

      - name: Mutation test ${{ matrix.scope }}
        if: env.SELECTED == 'true'
        run: |
          args=(--mutate "$MUTATE" --incremental --incrementalFile "$INCREMENTAL_FILE")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          pnpm mutation "${args[@]}"
        env:
          MUTATE: ${{ matrix.mutate }}

      - name: Save incremental results
        if: always() && env.SELECTED == 'true' && hashFiles(env.INCREMENTAL_FILE) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: stryker-incremental-${{ matrix.scope }}-${{ hashFiles('stryker.config.js', 'vitest.config.ts', '.github/workflows/mutation.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation report
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.scope }}
          path: reports/mutation/
          retention-days: 14
