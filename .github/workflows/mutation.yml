name: Mutation

# Mutation testing over the domain core. NOT a per-push gate — it is a scheduled
# sweep, deliberately kept OUT of ci.yml so the per-push ladder stays fast and
# deterministic (3F-2178): measured, the sweep costs 8-12 minutes on a 2-core
# runner against a ~2-minute ladder.
#
# The domain core is the only mutated scope: packages/core/src/domain/*.ts — the
# posting / reconciliation / fold rules. The rest of the tree is not mutated; the
# value concentrates in the pure logic and the run cost scales with the scope.
#
# THIS JOB NO LONGER HOLDS THE VERDICT (3F-2765). It used to red below the `break`
# threshold in stryker.config.json; that bar is retired, and the score is reconciled
# against `specController.thresholds` → SCN-MUT-011 on this repository's own ledger,
# where every other fitness check is settled. Two bars for one characteristic makes a
# green build depend on two arbiters agreeing, and the ledger's is the one with the
# @SCN. So what this job now owes the ledger is a MEASUREMENT: `pnpm mutation` wraps
# the sweep in the score producer, and the artefact below carries that number to
# whichever push borrows it next.
on:
  schedule:
    # 03:17 UTC nightly — an off-the-hour minute so the run does not queue behind
    # the top-of-hour scheduling spike.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BUILT AND RELINKED BECAUSE A `bin` IS A BUILD OUTPUT, the reason ci.yml sets out at length
      # (3F-2765) — and, since 3F-2810, no longer the reason this job needs them.
      # `.github/actions/persist-measurements` used to reach the persist by its bin name, and
      # pnpm's `node_modules/.bin` entry for a workspace package points into that package's `dist/`
      # — a symlink that dangles until the build runs, and that a second install will not go back
      # and create; without these the persist fell through to the registry, where no such package
      # exists. The action now runs the bundle committed beside it, which nothing here builds. The
      # steps are kept, and said so here rather than left to be rediscovered: removing a CI step is
      # a decision about the pipeline rather than about the slice that removed its reason. Filed
      # for the slice to rule on, alongside ci.yml's own pair.
      #
      # Ahead of the sweep rather than after it: Stryker mutates `packages/core/src/domain/**`
      # only, so a `dist/` on disk cannot change what is measured.
      - name: Build
        run: pnpm build

      - name: Link the bins the build just produced
        run: pnpm rebuild

      # `pnpm mutation` is the sweep wrapped in the score producer: it runs Stryker,
      # derives the score from the mutant statuses, posts it into the run's measurement
      # artefact citing SCN-MUT-011 on the check `mutation`, and carries the sweep's own
      # exit code out unchanged. A sweep that left no readable report posts nothing —
      # the row then reads `missing`, which is the true sentence.
      - name: Mutation test the domain core
        run: pnpm mutation

      # WHEN, WRITTEN INTO THE ARTEFACT, BECAUSE THE BORROWER HAS TO ASK. A push that settles
      # SCN-MUT-011 with this number is judging its own tree against a sweep of last night's, and
      # what makes that honest is an expiry: the restore posts the rows only while they are young
      # enough to still be about the code being judged. It reads the age off `measuredAt`, and an
      # artefact that does not say when it was measured is deliberately not treated as fresh — so a
      # sweep that skipped this step would go quiet rather than red, which is the one reading this
      # axis exists to keep unreachable.
      #
      # THROUGH SHIPPED CODE, NOT THROUGH YAML THIS FILE WROTE (3F-2771). This was a `jq` line and
      # an upload block here, which meant the reading half of the mechanism shipped as product and
      # the writing half shipped as a shell snippet — so a second repository standing a nightly up
      # copied the snippet. The action below dates AND uploads, so what is left here is the
      # artefact's NAME, which is the one term `ci.yml`'s restore has to agree with. Nothing in the
      # action or the CLI it calls names mutation, Stryker or this repository.
      #
      # `runs/` is gitignored with no re-includes, so the artefact this reads leaves the job and is
      # never committed; the dated copy the action writes never enters the checkout at all.
      - name: Persist the measurement this sweep leaves behind
        uses: ./.github/actions/persist-measurements
        with:
          artefact-name: mutation-measurement

      # The HTML report enumerates which domain lines no test kills — the same
      # class of finding as a reconciliation report, so it is never committed
      # (.gitignore) and is kept only as a build artefact for the operator.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
