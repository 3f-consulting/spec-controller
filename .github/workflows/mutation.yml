name: Mutation

# Mutation testing over the domain core. NOT a per-push gate — it is a scheduled
# sweep, deliberately kept OUT of ci.yml so the per-push ladder stays fast and
# deterministic (3F-2178): measured, the sweep costs 8-12 minutes on a 2-core
# runner against a ~2-minute ladder.
#
# The domain core is the only mutated scope: packages/core/src/domain/*.ts — the
# posting / reconciliation / fold rules. The rest of the tree is not mutated; the
# value concentrates in the pure logic and the run cost scales with the scope.
#
# THIS JOB HOLDS NO SECOND BAR (3F-2765). It used to red below the `break` threshold in
# stryker.config.json; that bar is retired, and SCN-FIT-002 is settled on this repository's
# own ledger, where every other fitness check is. Two bars for one characteristic makes a
# green build depend on two arbiters agreeing, and the ledger's is the one with the @SCN.
# So what this job owes the ledger is a MEASUREMENT: `pnpm mutation` wraps the sweep in the
# kill producer, and the artefact below carries that number to whichever push borrows it next.
#
# AND THE VERDICT BELOW IS NOT THAT SECOND BAR RETURNING (3F-2788). What 3F-2765 removed was a
# SEPARATELY DERIVED number sitting beside the ledger's — the runner's own percentage, computed
# its own way, agreeing with the ledger only by coincidence. The ratchet step is the SAME
# integer: the same gate of the same `quality-thresholds.yml` the ledger sources SCN-FIT-002's
# bar from, less the same allowance, by the same subtraction. It cannot disagree with the ledger
# because there is nothing for it to disagree with. What it adds is the three readings a single
# floor cannot express — a population that shrank, a population that grew (a loud pass rather
# than a false red), and a gain nobody banked. Same arbiter, more verdicts.
on:
  schedule:
    # 03:17 UTC nightly — an off-the-hour minute so the run does not queue behind
    # the top-of-hour scheduling spike.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      # WHERE THE SWEEP'S RECORD LIVES, AND IT IS SPELLED EXACTLY AS `ci.yml` SPELLS IT (3F-3099).
      #
      # THE HAND-OVER IS WHAT THIS AGREEMENT IS FOR. This job writes the sweep record and uploads
      # it; a later push downloads it and places it where the converted mutation check reads it.
      # Both ends moved out of the source tree together, and both resolve through the one name —
      # the producer below through `measurementArtefact.ts`'s resolver, the upload through
      # `${{ env.SPEC_CONTROLLER_EVIDENCE_DIR }}`, which is this line's value.
      #
      # A DISAGREEMENT HERE IS SILENT, WHICH IS WHY IT IS ONE NAME AND NOT TWO PATHS. An upload
      # naming somewhere the producer did not write leaves the borrow with nothing to fetch, and
      # the row reads `missing` — wearing the words this repository reserves for a nightly that has
      # lapsed, so the failure would report a different, already-familiar problem.
      #
      # A STEP AND NOT A JOB-LEVEL `env:` KEY, for the reason ci.yml carries at its own copy of
      # this: `jobs.<id>.env` cannot read the `runner` context, and a workflow naming
      # `${{ runner.temp }}` there fails to START.
      - name: Resolve the evidence root
        run: echo "SPEC_CONTROLLER_EVIDENCE_DIR=$RUNNER_TEMP/spec-controller-self-balance" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm mutation` is the sweep wrapped in the score producer: it runs Stryker,
      # derives the score from the mutant statuses, writes it into this sweep's own RECORD
      # citing SCN-FIT-002 on the check `mutation`, and carries the sweep's own exit code
      # out unchanged. A sweep that left no readable report writes nothing — the row then
      # reads `missing`, which is the true sentence.
      #
      # A RECORD, NOT A RUN'S CREDIT STREAM (3F-3152). SCN-FIT-002 is a CONVERTED fitness
      # check: the push that reconciles it runs the row's command and posts the credit
      # itself, so a row written straight into `runs/self-balance/measurements.json` would
      # be a second credit for one Evidence Obligation. What this job owes is the number;
      # what the push does with it is the push's.
      #
      # NOTHING IS BUILT AHEAD OF THIS, AND NOTHING NEEDS TO BE (3F-2841). A `Build` and a
      # `pnpm rebuild` stood here because the retired persist action reached its CLI by
      # a bin name, and pnpm's `node_modules/.bin` entry for a workspace package points into a
      # `dist/` that does not exist until the build runs. 3F-2810 removed that reason, left both
      # steps standing and said so in this file, filing the decision for the slice that owned the
      # pipeline; this is that slice, and it ruled them out. Stryker mutates
      # `packages/core/src/domain/**` through the vitest runner, off source, so a `dist/` on disk
      # could not change what is measured even while it was there.
      - name: Mutation test the domain core
        run: pnpm mutation

      # WHAT THIS SWEEP OWES THE LEDGER, LEFT WHERE THE NEXT PUSH CAN BORROW IT (3F-2765). The
      # score above is what settles SCN-FIT-002, and the push that reconciles that row is a
      # different run of a different workflow — so the number has to cross a run boundary, and
      # this is the whole of that crossing: upload a file, download it, check its age. `ci.yml`
      # names the same artefact and places it at the same path, and that agreement is the entire
      # contract between the two.
      #
      # WRITTEN HERE RATHER THAN SHIPPED (3F-2841). This was a composite action over a CLI
      # (3F-2771, 3F-2810), which made the writing half of a file-move a published capability. It
      # is glue, every piece of it native, and glue is written at the edge that needs it.
      #
      # AND NOTHING IS DATED, WHICH IS THE OTHER HALF OF THAT RULING. The persist stamped
      # `measuredAt` into the payload so the borrower could ask how old the number was — a fact
      # GitHub already records as this RUN's `createdAt`, which is what `ci.yml` now reads. A
      # measurement cannot outlive the run that took it, so the run is the honest clock, and a
      # timestamp written by the thing being judged never was one.
      #
      # A SWEEP THAT MEASURED NOTHING UPLOADS NOTHING, by construction rather than by a CLI: the
      # score producer writes no artefact when it has no readable report, so there is no file for
      # `if-no-files-found: ignore` to collect. The row the borrower would have settled then reads
      # `missing` on the ledger, out loud, in the one place every other verdict on this axis is
      # reported. A warning annotation here would be a second and quieter place to look for it, and
      # an error would red a scheduled job over a cadence rather than over the code.
      #
      # AND THIS STEP CARRIES NO `if:`, WHICH IS THE FENCE AND NOT AN OMISSION (3F-2957,
      # @SCN-MUT-016). GitHub holds a step stating no condition to `success()`, so a sweep that DIED
      # takes this upload down with it and its run reaches the borrow with nothing to download: the
      # row reads `missing` — no measurement arrived — which is the true sentence about a run whose
      # number would have been partial, or would have been a previous run's.
      #
      # THAT FENCE USED TO BE ACCIDENTAL, AND IS NOW THE ONLY ONE THERE IS. The borrow filtered on
      # `--status success`, so a crashed run was excluded by the very filter that also excluded the
      # night which found a regression — one word doing two jobs, and 3F-2901 is the second of them
      # going wrong. @SCN-MUT-015 removed the filter and the two readings came apart. What still
      # tells them apart is this absent condition together with `stryker.config.json` setting no
      # `break` threshold: the sweep cannot exit non-zero over the SCORE, only over ITSELF, so a
      # failed sweep is a failed HARNESS and the silence of this step is what says so.
      #
      # THE REPORT UPLOAD BELOW CARRIES `if: always()` AND MUST, which is an asymmetry with a reason
      # rather than an untidiness. An operator opening the report of the run that died is precisely
      # what that upload is for; a ledger reading the NUMBER of the run that died is precisely what
      # this one must never serve. Two uploads, two conditions — and @SCN-MUT-016 now holds both,
      # so the edit that made them agree would red rather than pass as tidying.
      #
      # THE PATH IS THE JOB'S EVIDENCE ROOT AND NOT THIS REPOSITORY (3F-3099), so the record this
      # uploads was never inside the checkout to begin with — the sweep wrote it to the runner's own
      # disk through the same resolver the self-reconciliation's measurement stream is read with.
      - name: Leave the measurement where a later push can borrow it
        uses: actions/upload-artifact@v7
        with:
          name: mutation-measurement
          path: ${{ env.SPEC_CONTROLLER_EVIDENCE_DIR }}/runs/mutation/measurements.json
          if-no-files-found: ignore
          # The persist action's own default, carried over unchanged: the artefact only has to
          # outlast the gap between two runs of the schedule that produces it.
          retention-days: 14

      # The HTML report enumerates which domain lines no test kills — the same
      # class of finding as a reconciliation report, so it is never committed
      # (.gitignore) and is kept only as a build artefact for the operator.
      #
      # `if: always()` HERE AND NOTHING ABOVE IS THE ASYMMETRY ARGUED AT THE MEASUREMENT UPLOAD, and
      # @SCN-MUT-016 holds both halves of it. The run that died is the one whose report an operator
      # most needs.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

      # THE VERDICT THE MEASUREMENT ALONE CANNOT REACH, AND THE JOB ENDS ON IT (3F-2788,
      # @SCN-MUT-014). The sweep above posts the kills; the ledger holds them to the record's kill
      # floor and answers satisfied or failing. That is one comparison, and it is blind to two
      # things a nightly sweep should say out loud: a population that SHRANK — fewer mutants than
      # the record banks, which counts alone cannot tell from a regression somebody masked by
      # deleting the code under it — and a gain nobody banked, which leaves the record understating
      # what this suite actually does. This step is where those are said, and it reads the same
      # gate of the same file the ledger reads, so it is the ledger's own bar with a wider
      # vocabulary rather than a bar of its own.
      #
      # LAST, AFTER BOTH UPLOADS, WHICH IS PLACEMENT WITH A REASON. A red verdict fails the job,
      # and a step placed before the uploads would take them down with it — leaving the run that
      # found the fault as the one run with nothing for an operator to open. Put last, the
      # measurement and the report leave the job whatever the verdict is, and the job's own ending
      # IS the verdict, which is what the ledger's arbiter cannot be asked to be.
      #
      # AND THE LEDGER'S MEASUREMENT DEPENDS ON THAT PLACEMENT TOO, WHICH IS WHY A SCENARIO NOW
      # HOLDS IT (3F-2947, @SCN-MUT-015). `ci.yml` borrows from the newest COMPLETED run of this
      # workflow, whatever verdict followed it, so the night that finds a regression is the night
      # whose number crosses to the next push — but only because the measurement leaves this job
      # BEFORE the step below reds it. Move this step up and that night uploads nothing: the row
      # reads `missing`, a regression is reported as a lapse, and every assertion about WHICH run
      # is selected stays green while it happens. So the ordering is asserted alongside the
      # selection rather than defended here alone, and the paragraph above is now the second of
      # two reasons for it rather than the only one.
      #
      # NO `lint:` / `guard:` PREFIX ON THE SCRIPT IT RUNS, WHICH IS LOAD-BEARING RATHER THAN
      # STYLISTIC. `runningStaticChecks` observes a package.json script as a RUNNING static check
      # when its name carries an observed prefix and a workflow `run:` step invokes it — and the
      # ledger reads every workflow under `.github/workflows/`, this one included. A `lint:` name
      # here would register a per-push static check on spec-controller's own ledger for a step that
      # only ever runs nightly: a claim this pipeline does not honour, and an uncited one at that.
      # Same ruling `scripts/verify.sh` already carries for `verify` and `ladder`.
      #
      # AND NO `if: always()`. A sweep that died left no verdict worth reaching, and a
      # reconciliation over a report that run never finished writing would answer about the wrong
      # tree.
      - name: Reconcile the sweep against the record
        run: pnpm mutation:ratchet
