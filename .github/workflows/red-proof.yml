name: Red proof

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: The code of the scenario whose tests the proof runs, such as SCN-ABC-001
        required: true
        type: string
      layer:
        description: The evidence layer the scenario's tests run in
        required: true
        type: choice
        options:
          - unit
          - integration
          - e2e

permissions:
  contents: read

jobs:
  red-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Resolve the evidence root
        run: |
          echo "SPEC_CONTROLLER_EVIDENCE_DIR=$RUNNER_TEMP/spec-controller-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/suite-tmp/vitest" "$RUNNER_TEMP/suite-tmp/cucumber"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the scenario's own tests alone
        env:
          LAYER: ${{ inputs.layer }}
          SCENARIO: ${{ inputs.scenario }}
          RED_PROOF_DIR: ${{ runner.temp }}/red-proof
          TMPDIR: ${{ runner.temp }}/suite-tmp/vitest
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: scripts/red-proof.sh "$LAYER" "$SCENARIO"
