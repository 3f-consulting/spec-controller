name: Mutation sweep of domain-rework

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

env:
  BRANCH: domain-rework

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the sweep when the branch exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # An absent branch answers an empty list, so a failed read reds instead of passing as absent.
          found=$(gh api "repos/$GH_REPO/git/matching-refs/heads/$BRANCH" --jq "map(select(.ref == \"refs/heads/$BRANCH\")) | length")
          if [ "$found" -eq 0 ]; then
            echo "No $BRANCH branch, so nothing to sweep."
            exit 0
          fi
          gh workflow run mutation.yml --ref "$BRANCH"
