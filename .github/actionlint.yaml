# ACTIONLINT'S CONFIGURATION — ONE ENTRY, AND IT IS A SUPPRESSION (3F-3444, @SCN-FIT-020).
#
# WHAT actionlint 1.7.12 SAID ABOUT THIS TREE THE FIRST TIME IT WAS EVER RUN OVER IT, VERBATIM AND
# WHOLE — two findings across three workflow files, both the same construct in the same step:
#
#   .github/workflows/ci.yml:1044:9: shellcheck reported issue in this script:
#     SC2046:warning:1:160: Quote this to prevent word splitting [shellcheck]
#   .github/workflows/ci.yml:1044:9: shellcheck reported issue in this script:
#     SC2046:warning:1:293: Quote this to prevent word splitting [shellcheck]
#
# `release.yml` and `mutation.yml` were clean. The workflow line was 1016 before the step that
# carries this check was written in and 1044 after — the pattern below does not read it, and it is
# quoted only so a reader can find the step. The column IS read, and it is the character offset of
# the `$(` inside the `Self-reconciliation balance` step's own command string — positional, so it
# is the same whichever shellcheck build reports it.
#
# ONE EXPANSION NOW, AND ONE COLUMN (3F-3504). The `--measurements` expansion at column 160 left
# when the only writer of its file did, so the `--ci-steps` expansion moved up into column 160 and
# column 293 names nothing. Read off actionlint 1.7.12 with this file emptied, not counted:
#
#   .github/workflows/ci.yml:605:9: shellcheck reported issue in this script:
#     SC2046:warning:1:160: Quote this to prevent word splitting [shellcheck]
#
# WORD SPLITTING IS THE MECHANISM HERE, NOT AN OVERSIGHT, and that step's own comment says so in as
# many words: "The `$(...)` is unquoted on purpose — the two tokens have to split." The expansion
# is `$([ -f "$DIR/x.json" ] && echo "--flag $DIR/x.json")` and has to yield TWO words where the
# file exists and NO word where it does not. Quoted it yields exactly one word in both cases: a
# flag and a path welded into a single token the CLI cannot read, or — worse — an EMPTY token,
# which `balance` reds as a supplied-but-absent path with exit 2 (@SCN-CLI-002). So the fix
# shellcheck is asking for would break the step it is asking about.
#
# THE WARNING IS REAL ABOUT A PATH CARRYING A SPACE, AND THIS PATH CARRIES NONE. actionlint reads
# workflow files and nothing else, so the only value in scope here is CI's:
# `$RUNNER_TEMP/spec-controller-evidence`, written by the `Resolve the evidence root` step of this
# same file rather than supplied by a caller.
#
# THE SECOND REASON THIS SUPPRESSION CARRIED HAS GONE, AND THE SUPPRESSION IS DELIBERATELY UNMOVED.
# It used to argue that the idiomatic fix — shellcheck's own answer to SC2046, a bash array, which
# needs a multi-line `run:` — was barred, because a derived local green-check reported a multi-line
# `run:` as `unsupported` and redded outright. That derivation was deleted at 3F-3475, so the bar
# it imposed no longer exists: `unsupported` was its notion alone, and the engine's own walk reads a
# multi-line block scalar on purpose (`checkScriptsRunInCI.ts`). WHETHER THE IDIOMATIC FIX SHOULD
# NOW BE TAKEN WAS ASKED AND ANSWERED NO, 2026-09-17. The first reason, word splitting, is untouched
# and is sufficient on its own, so nothing is owed here and there is no debt to name: taking the
# array would be REPLACING a working step of ours that reaches no consumer, not removing one. No
# ticket is open for it and none should be, and the pattern below stands exactly as it was.
#
# THE RESIDUAL, SAID RATHER THAN LEFT TO BE INFERRED. actionlint filters by the ERROR MESSAGE and
# by nothing else: there is no per-step directive, and a `# shellcheck disable=` line needs a
# script with a line above the command, which a single-line `run:` does not have. So the narrowest
# instrument the tool offers is this pattern, and it is pinned as far as it will go — one file, one
# rule, one severity, script line 1, the message in full, and the one exact column. What it
# cannot exclude is a second SC2046 arriving at precisely column 160 of another single-line
# `run:` in this same file. THE PINNING FAILS SAFE: edit the balance command and the column moves,
# this pattern stops matching, and the gate REDS — it never goes quiet. That is the intended
# behaviour and not a maintenance defect; a reader who moves that line is meant to come back here.
#
# NOTHING ELSE IS CONFIGURED. Every other rule in `ci.yml`, and every rule in every other workflow
# file, is unsuppressed.

paths:
  .github/workflows/ci.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2046:warning:1:160: Quote this to prevent word splitting'
