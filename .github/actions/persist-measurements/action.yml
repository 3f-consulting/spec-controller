# THE MEASUREMENT PERSIST, AS A STEP ANOTHER REPOSITORY CAN CALL (3F-2771).
#
# The counterpart of `.github/actions/restore-measurements`, and it exists because that one shipped
# alone. The restore reads a `measuredAt` off a persisted artefact to decide whether last night's
# number is still about this code; nothing in the product ever WROTE that field. One repository's
# nightly stamped it with a `jq` line in its own workflow, so a second repository standing a
# scheduled check up got the reading half as shipped code and copy-pasted the writing half. Half a
# mechanism shipped is a mechanism that gets forked, and the two halves then drift over the one
# field they share.
#
# IT DATES AND IT UPLOADS, BECAUSE THE RESTORE DOWNLOADS AND POSTS. Splitting those would leave the
# caller holding the upload's settings, and one of them is load-bearing and silent: the restore
# finds its payload with `find -name measurements.json`, so the collected file MUST carry that
# name. Where the caller names the path, that match holds by luck of whatever path they happened to
# upload from, and a caller who picked another one gets a lapsed-schedule reading forever. Pinned
# here, it cannot be got wrong. What is left for the caller is the artefact's NAME — the one term
# the restore's caller has to agree with — and nothing else.
#
# NOTHING BELOW NAMES A CHECK, A RUNNER, A WORKFLOW OR A REPOSITORY, and the WINDOW is not here
# either. How long a number stays worth posting is a fact about the cadence of whoever BORROWS it,
# so it is an input to the restore and absent from this: the persist writes a moment and says
# nothing about what that moment is worth.
#
# IT IS NOT AN ARBITER. A run that measured nothing leaves nothing, the upload collects nothing,
# and the rows that would have been settled reconcile `missing` on the borrowing run's ledger —
# out loud, on the row that owed the measurement, which is the same reading a schedule that quietly
# stopped running produces. So there is no `continue-on-error` here and nothing for one to hide.
name: Persist measurements
description: >-
  Date what this run measured with the clock it measured on, and leave it where a later run's
  restore can borrow it.

inputs:
  artefact-name:
    description: >-
      The name to upload the dated measurement under. The restore that borrows it names the same
      one, and that agreement is the whole contract between the two.
    required: true
  retention-days:
    description: >-
      How long the uploaded artefact is kept. It only has to outlast the gap between two runs of
      the schedule that produces it, so it belongs to the caller like the cadence does.
    required: false
    default: "14"

runs:
  using: composite
  steps:
    - name: Date what this run measured
      id: persist
      shell: bash
      run: |
        set -euo pipefail

        # Outside the checkout, deliberately. The run's own measurement artefact lives under
        # `runs/`, which the product's guards keep uncommittable; a dated COPY written beside it
        # would be a second artefact in the same place, and the one thing that must never be
        # ambiguous is which of the two a later step is reading.
        into="${RUNNER_TEMP}/persist-measurements"
        rm -rf "${into}"
        mkdir -p "${into}"

        # `measurements.json`, because the restore finds the payload by that name and by no other.
        echo "to=${into}/measurements.json" >> "${GITHUB_OUTPUT}"

        # Reached by its bin name rather than by a package path, so this names no package and the
        # caller's own manifest decides which version of the persist it is running. The contract is
        # that `spec-controller-persist-measurements` resolves from the workspace — the caller
        # depends on the package that ships it, and has installed and BUILT it before this step.
        # `--no` because a bin that does not resolve is a misconfigured caller and must say so,
        # never a version fetched from the registry behind the caller's back.
        #
        # THE `--` IS LOAD-BEARING, as it is on the restore. Without it every `--flag` after the
        # command name is read as npx's own config and never reaches the persist, which then
        # reports a missing `--to` and exits 2.
        #
        # AND `--to` IS ABSOLUTE. A relative one resolves against `--root`, so a path that looked
        # right beside the runner's temp directory would be written inside the checkout and the
        # upload below would collect nothing — a run that measured plenty, reported as one that
        # measured nothing.
        npx --no -- spec-controller-persist-measurements \
          --to "${into}/measurements.json" \
          --root "${GITHUB_WORKSPACE}"

    - name: Leave it where a later run can borrow it
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artefact-name }}
        path: ${{ steps.persist.outputs.to }}
        # NOTHING TO COLLECT IS THE ORDINARY READING OF A RUN THAT MEASURED NOTHING, already said
        # out loud by the step above and already loud on the borrowing run's ledger as a row that
        # reads `missing`. A warning annotation here would be a second, quieter place to look for
        # it — and an `error` would red a scheduled job over a cadence rather than over the code.
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}
