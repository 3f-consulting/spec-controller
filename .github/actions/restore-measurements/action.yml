# THE MEASUREMENT RESTORE, AS A STEP ANOTHER REPOSITORY CAN CALL (3F-2766).
#
# A check that costs more than a per-push ladder can afford runs on a schedule, and its number is
# last night's. This step fetches that number and posts it into the run's measurement artefact
# while it is still young enough to be about this code; past that it posts nothing, the bar it
# would have settled reconciles `missing`, and the ledger reds. A schedule that quietly stopped
# running cannot stay quiet.
#
# BUILT ONCE, HERE, AND CALLED FROM ANYWHERE. Every term is an input: WHICH artefact, WHICH
# schedule produced it, and HOW LONG its number stays worth posting. Nothing below names a check,
# a runner, a workflow or a repository — a second repository with a different cadence passes a
# different `max-age` rather than forking this file. Inlining the equivalent YAML per project is
# what this exists to stop: a step copy-pasted into four repositories is four gates that drift.
#
# IT IS NOT AN ARBITER. Having nothing to restore — no scheduled run yet, no artefact uploaded, a
# number past its window — is the ordinary reading of a cadence, not a fault of this step's, and
# the place it is reported is the ledger, out loud, on the row that owed the measurement. So there
# is no `continue-on-error` here and there is nothing for one to hide: the quiet paths are quiet
# because they are true, and the loud path below is the one case that is genuinely a misuse.
name: Restore measurements
description: >-
  Post a measurement a scheduled run persisted into this run's measurement artefact, while it is
  still young enough to be about this code.

inputs:
  artefact-name:
    description: The uploaded artefact holding the persisted measurement.
    required: true
  workflow:
    description: >-
      The scheduled workflow whose latest successful run persisted that artefact — its file name,
      or the `name:` it carries.
    required: true
  max-age:
    description: >-
      How long, in seconds, the persisted measurement stays close enough to true about this code.
      A window is a fact about the cadence that produced the number, so it belongs to the caller:
      a nightly an hour apart from another one wants a different one.
    required: true
  github-token:
    description: The token the persisted artefact is fetched with.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Fetch the persisted measurement
      id: fetch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ARTEFACT_NAME: ${{ inputs.artefact-name }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        set -euo pipefail

        into="${RUNNER_TEMP}/restore-measurements"
        rm -rf "${into}"
        mkdir -p "${into}"

        # The artefact's own run supplies the moment it was measured, so nothing here has to
        # invent a timestamp or trust one written into the payload by the thing being judged.
        run_id="$(gh run list \
          --workflow "${WORKFLOW}" \
          --status success \
          --limit 1 \
          --json databaseId \
          --jq '.[0].databaseId // empty')"

        # A NOMINAL PATH, DELIBERATELY. Where there is nothing to fetch, the restore is still run
        # and still told where it would have looked: it reports a lapsed schedule and exits 0, the
        # rows read `missing`, and the ledger says so. Skipping the step instead would leave the
        # log silent about a cadence that has stopped.
        echo "from=${into}/measurements.json" >> "${GITHUB_OUTPUT}"

        if [ -z "${run_id}" ]; then
          echo "restore measurements: no successful run of ${WORKFLOW} to restore from."
          exit 0
        fi

        if ! gh run download "${run_id}" --name "${ARTEFACT_NAME}" --dir "${into}"; then
          echo "restore measurements: run ${run_id} of ${WORKFLOW} uploaded no ${ARTEFACT_NAME}."
          exit 0
        fi

        # WHAT ARRIVED, IN THE LOG, EVERY RUN. An artefact whose rows never reach the ledger and an
        # artefact that was never fetched produce the same `missing` row, so the fetch says out
        # loud which of the two happened rather than leaving them to be told apart by their
        # absence.
        echo "restore measurements: fetched ${ARTEFACT_NAME} from run ${run_id} of ${WORKFLOW}:"
        find "${into}" -type f -print

        # Found by name wherever the upload happened to put it, since an artefact holding one file
        # and an artefact holding a tree flatten differently.
        found="$(find "${into}" -type f -name measurements.json -print -quit)"
        if [ -z "${found}" ]; then
          # THE ONE LOUD PATH, AND IT IS A MISUSE RATHER THAN A VERDICT. The artefact named by
          # `artefact-name` is present and holds no measurement, which is this step having been
          # pointed at the wrong upload — a fault in how it was CALLED. Reported as `missing`
          # instead, it would read as a cadence that had lapsed and go on reading that way.
          echo "::error::restore measurements: ${ARTEFACT_NAME} holds no measurements.json, so it" \
            "is not a measurement artefact. Check which artefact artefact-name names."
          exit 1
        fi
        echo "from=${found}" >> "${GITHUB_OUTPUT}"

    - name: Post what is still fresh
      shell: bash
      env:
        FROM: ${{ steps.fetch.outputs.from }}
        MAX_AGE: ${{ inputs.max-age }}
      run: |
        set -euo pipefail

        # THE FILE THAT TRAVELS WITH THIS ACTION, AND `github.action_path` IS THE ONLY WAY TO REACH
        # IT (3F-2810). This step used to run the restore by its bin name, which resolves out of the
        # CALLER's node_modules from a `dist/` that is build output and is not committed. A
        # cross-repository `uses:` checks this action out into a workspace that has neither, so the
        # step died before it ran — which is precisely what happened to the first repository that
        # tried to import it, and why it went back to writing its own. An action a consumer has to
        # install a package for is a fork waiting to happen.
        #
        # THE CHECKOUT BESIDE THIS IS THE CALLER'S TREE, so no sibling path is reachable from here
        # and `${{ github.action_path }}` is not a convenience: on a cross-repository `uses:` it is
        # the one directory that exists. `lint:action-bundles` reds any step here that reaches
        # outside it, and reds this bundle the moment it stops being what building its source
        # produces — the committed build output being the one thing that can rot in silence.
        #
        # THE BINS ARE UNTOUCHED. A project that HAS installed the package still reaches
        # `spec-controller-restore-measurements` directly; what changed is how the ACTION reaches
        # the restore, and nothing at all about what the restore does — every flag below, and the
        # `measurements.json` name the payload is found by above, are the bytes they always were.
        #
        # AND `FROM` IS ABSOLUTE. A relative `--from` resolves against `--root`, so a path that
        # looked right beside the runner's temp directory would be sought inside the checkout and
        # found nowhere — a lapsed schedule reported where the truth was a path bug.
        node "${{ github.action_path }}/dist/restore-measurements.mjs" \
          --from "${FROM}" \
          --max-age "${MAX_AGE}" \
          --root "${GITHUB_WORKSPACE}"
