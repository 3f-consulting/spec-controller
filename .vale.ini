StylesPath = .vale/styles
MinAlertLevel = error
IgnoredScopes = tt
SkippedScopes = script, style

[*.md]
BasedOnStyles = History, Identifiers

[*.{ts,tsx,js,jsx}]
BasedOnStyles = History, Identifiers

[*.{yml,yaml}]
BasedOnStyles = History, Identifiers
View = Comments

[*.feature]
BasedOnStyles = History, Identifiers
View = Gherkin

[tests/fixtures/**]
BasedOnStyles =

[pnpm-lock.yaml]
BasedOnStyles =

[{**/CHANGELOG*.md,**/decisions*.md,**/work-item/**}]
BasedOnStyles =
