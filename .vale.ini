StylesPath = .vale/styles
MinAlertLevel = error
IgnoredScopes = tt
SkippedScopes = script, style
IgnoredClasses = sample-report

[*.md]
BasedOnStyles = History, Identifiers

[*.{ts,tsx,js,jsx,mjs,cjs}]
BasedOnStyles = History, Identifiers

[*.{yml,yaml}]
BasedOnStyles = History, Identifiers
View = Comments

[*.feature]
BasedOnStyles = History, Identifiers
View = Gherkin

[tests/fixtures/**/*.{md,feature,ts,tsx,js,jsx,mjs,cjs,yml,yaml}]
BasedOnStyles = History, Identifiers
Identifiers.ScenarioCode = NO

[pnpm-lock.yaml]
BasedOnStyles =
