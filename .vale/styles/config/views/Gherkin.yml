engine: textfsm
template: |
  Value List Description (\S.*)
  Value List Comment (.*)

  Start
    ^\s*#\s?${Comment}
    ^\s*(?:Scenario Outline|Scenario Template|Scenario|Example): -> ScenarioDescription
    ^\s*(?:Feature|Rule|Background|Examples|Scenarios): -> Description

  Description
    ^\s*#\s?${Comment}
    ^\s*(?:Scenario Outline|Scenario Template|Scenario|Example): -> ScenarioDescription
    ^\s*(?:Feature|Rule|Background|Examples|Scenarios): -> Description
    ^\s*(?:@|\||Given |When |Then |And |But |\* ) -> Start
    ^\s*$$
    ^\s*${Description}

  ScenarioDescription
    ^\s*#\s?${Comment}
    ^\s*(?:Scenario Outline|Scenario Template|Scenario|Example): -> ScenarioDescription
    ^\s*(?:Feature|Rule|Background|Examples|Scenarios): -> Description
    ^\s*(?:given|when|then|and|but)\s+
    ^\s*(?:@|\||Given |When |Then |And |But |\* ) -> Start
    ^\s*$$
    ^\s*${Description}
scopes:
  - name: description
    expr: Description
  - name: comment
    expr: Comment
