extends: existence
message: "'%s' names the code; say what it does in the reader's words."
level: error
tokens:
  - '[a-z]+[A-Z][A-Za-z0-9]*'
  - '[A-Z][a-z0-9]+[A-Z][A-Za-z0-9]*'
  - '[\w./-]*\w\.(?:ts|tsx|mjs|cjs|js)'
exceptions:
  # The keys of the published report, which a reader of spec-reconciliation.json reads.
  - byOutcome
  - claimReconciliations
  - evidenceObligations
  - evidenceObservations
  - excludedOccurrences
  - featureNames
  - fitnessFunctions
  - missingByQualityCheckKind
  - onPhantomClaim
  - onScenario
  - onUnnamedClaim
  - outOfBalance
  - phantomClaim
  - qualityCheckKind
  - qualityCheckReconciliations
  - rawByLayer
  - reconciliationLines
  - runningFitnessFunctionCount
  - runProvenance
  - scenarioCodes
  - scnId
  - sourceSha
  - uncitedFitnessFunctionCount
  - unnamedClaim
  - untaggedScenarios
  # The keys an adopter writes in package.json; checkRegistry and staticChecks are the retired ones the report names as not read.
  - specController
  - notChecks
  - checkRegistry
  - staticChecks
  # The published API's type, which a package consumer reads off the v1 barrel.
  - QualityCheckReconciliation
  # Names that belong to others: a company, its product, a JavaScript built-in, a TypeScript option.
  - GitHub
  - CodeQL
  - SyntaxError
  - noEmit
