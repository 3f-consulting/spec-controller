extends: existence
message: "'%s' names the code; say what it does in the reader's words."
level: error
tokens:
  - '[a-z]+[A-Z][A-Za-z0-9]*'
  - '[A-Z][a-z0-9]+[A-Z][A-Za-z0-9]*'
  - '[\w./-]*\w\.(?:ts|tsx|mjs|cjs|js)'
exceptions:
  # The keys of the published report, which a reader of spec-reconciliation.json reads.
  - byOutcome
  - claimCodeErrors
  - claimCodes
  - claimReconciliations
  - errorsInTheInputs
  - outOfBalance
  - qualityCheckReconciliations
  # The published API's type, which a package consumer reads off the v1 barrel, and GitHub, TypeScript and JavaScript, names that belong to others.
  - QualityCheckReconciliation
  - GitHub
  - TypeScript
  - JavaScript
